<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Dots and Boxes 💕 | UsBlog Games</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --dark-amethyst: #1a1a2e;
            --purple-deep: #2d1b69;
            --rose-pink: #ff6b9d;
            --rose-glow: rgba(255, 107, 157, 0.6);
            --sunset-gold: #fdcb6e;
            --gold-glow: rgba(253, 203, 110, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --pearl: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #2d1b69 0%, #1a1a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            animation: floatParticle linear infinite;
            opacity: 0.2;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.25; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
        }

        .game-container {
            position: relative;
            z-index: 10;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .back-btn {
            color: #ff6b9d;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 157, 0.3);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 107, 157, 0.2);
        }

        .game-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
        }

        .status-bar {
            text-align: center;
            padding: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #ff6b9d;
            font-weight: 600;
        }

        .scoreboard {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .score-chip {
            padding: 0.5rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .score-chip.pink { color: #ff6b9d; border: 1px solid rgba(255, 107, 157, 0.3); }
        .score-chip.gold { color: #fdcb6e; border: 1px solid rgba(253, 203, 110, 0.3); }

        .board-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 2px solid var(--glass-border);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .board {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 420px;
            margin: 0 auto;
        }

        /* Dots */
        .dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 40% 40%, #ffffff, #e0e0e0, #b0b0b0);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        /* Horizontal lines */
        .h-line {
            position: absolute;
            height: 6px;
            background: transparent;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.25s ease;
            z-index: 1;
            transform: translateY(-50%);
        }

        .h-line:hover {
            background: rgba(255, 107, 157, 0.4);
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.5);
        }

        .h-line.pink {
            background: #ff6b9d;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.7);
            cursor: default;
        }

        .h-line.gold {
            background: #fdcb6e;
            box-shadow: 0 0 15px rgba(253, 203, 110, 0.7);
            cursor: default;
        }

        /* Vertical lines */
        .v-line {
            position: absolute;
            width: 6px;
            background: transparent;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.25s ease;
            z-index: 1;
            transform: translateX(-50%);
        }

        .v-line:hover {
            background: rgba(255, 107, 157, 0.4);
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.5);
        }

        .v-line.pink {
            background: #ff6b9d;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.7);
            cursor: default;
        }

        .v-line.gold {
            background: #fdcb6e;
            box-shadow: 0 0 15px rgba(253, 203, 110, 0.7);
            cursor: default;
        }

        /* Boxes */
        .box {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            z-index: 0;
        }

        .box.pink {
            animation: popIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .box.gold {
            animation: popIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(10deg); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .box.pink::after {
            content: '💕';
            animation: heartPulse 1.5s ease infinite;
        }

        .box.gold::after {
            content: '💍';
            animation: ringRotate 2s ease infinite;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes ringRotate {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-family: 'Poppins', sans-serif;
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }

        .btn-reset:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .overlay-content {
            text-align: center;
            background: rgba(26, 26, 46, 0.95);
            padding: 2rem 3rem;
            border-radius: 2rem;
            border: 2px solid rgba(255, 107, 157, 0.5);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .overlay-emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .overlay-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #ff6b9d;
            margin-bottom: 1rem;
        }

        @media (max-width: 500px) {
            .game-container {
                padding: 0.75rem;
                border-radius: 1.25rem;
            }
            .game-title {
                font-size: 1.4rem;
            }
            .board-wrapper {
                padding: 0.75rem;
            }
            .dot {
                width: 10px;
                height: 10px;
            }
            .h-line, .v-line {
                height: 4px;
                width: 4px;
            }
            .box {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-btn">← Back</a>
            <h1 class="game-title">💕 Dots & Boxes</h1>
            <div style="width: 60px;"></div>
        </div>

        <div class="status-bar" id="statusBar">💕 Your turn! Draw a line</div>

        <div class="scoreboard">
            <div class="score-chip pink">💕 You: <span id="playerScore">0</span></div>
            <div class="score-chip gold">💍 Partner: <span id="aiScore">0</span></div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="game.resetBoard()">🔄 Reset Board</button>
        </div>
    </div>

    <script src="../js/games/dots-boxes.js"></script>
</body>
</html>
