<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dino Run 1vs1 💕 | UsBlog Games</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-light: #f8bbd0;
            --blue: #74b9ff;
            --blue-light: #a8d8ff;
            --green: #4CAF50;
            --green-light: #a5d6a7;
            --orange: #FF9800;
            --orange-light: #ffcc80;
            --purple: #9c27b0;
            --purple-light: #ce93d8;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --darker: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
            --red: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1200px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255,107,157,0.5);
        }

        .scoreboard {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .score-chip {
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
        }

        .score-chip.you { background: rgba(255,107,157,0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .score-chip.opponent { background: rgba(116,185,255,0.2); border: 1px solid #74b9ff; color: #74b9ff; }
        .score-chip.status { background: rgba(255,255,255,0.1); color: #fdcb6e; font-size: 10px; }

        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .player-section {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.15);
            background: #0a0a1a;
        }

        .player-section.you-frame {
            border-color: rgba(255, 107, 157, 0.5);
        }

        .player-section.opponent-frame {
            border-color: rgba(116, 185, 255, 0.5);
        }

        .player-label {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 5;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
        }

        .player-label.you-label {
            background: rgba(255, 107, 157, 0.7);
            color: white;
        }

        .player-label.opp-label {
            background: rgba(116, 185, 255, 0.7);
            color: white;
        }

        .player-score-mini {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 5;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
        }

        .player-score-mini.you-mini {
            background: rgba(0,0,0,0.7);
            color: #ff6b9d;
        }

        .player-score-mini.opp-mini {
            background: rgba(0,0,0,0.7);
            color: #74b9ff;
        }

        .player-left-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #ff4444;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            z-index: 10;
            text-align: center;
        }

        .player-left-overlay.show { display: block; }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .info-bar {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .info-pill {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.06);
            padding: 4px 10px;
            border-radius: 10px;
        }

        .chat-bar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            align-items: center;
        }

        .chat-bar input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
            font-size: 11px;
        }

        .chat-bar button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: #ff6b9d;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .chat-messages {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 5px 0;
            margin-top: 5px;
        }

        .chat-message {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 10px;
            white-space: nowrap;
        }

        .chat-message .sender { font-weight: bold; }

        @media (max-width: 800px) {
            .split-layout {
                grid-template-columns: 1fr;
            }
            .game-title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Dino Run 1vs1</h1>
            <div class="scoreboard">
                <div class="score-chip you">💕 <span id="youName">You</span>: <span id="youScore">0</span></div>
                <div class="score-chip opponent">💙 <span id="oppName">Opp</span>: <span id="oppScore">0</span></div>
                <div class="score-chip status" id="statusChip">Connecting...</div>
            </div>
        </div>

        <!-- SPLIT SCREEN: Two Canvases -->
        <div class="split-layout">
            <!-- MY FRAME -->
            <div class="player-section you-frame" id="myFrame">
                <div class="player-label you-label">💕 YOU - <span id="myColorName">Pink</span></div>
                <div class="player-score-mini you-mini" id="myMiniScore">0</div>
                <canvas id="myCanvas" width="560" height="350"></canvas>
                <div class="player-left-overlay" id="myLeftOverlay">Opponent Left!</div>
            </div>

            <!-- OPPONENT FRAME -->
            <div class="player-section opponent-frame" id="oppFrame">
                <div class="player-label opp-label">💙 <span id="oppLabelName">Opponent</span> - <span id="oppColorName">Blue</span></div>
                <div class="player-score-mini opp-mini" id="oppMiniScore">0</div>
                <canvas id="oppCanvas" width="560" height="350"></canvas>
                <div class="player-left-overlay" id="oppLeftOverlay">Player Left!</div>
            </div>
        </div>

        <div class="info-bar">
            <div class="info-pill">⌨️ Space/Click/Tap to Jump</div>
            <div class="info-pill">💗 Hearts +100</div>
            <div class="info-pill">⚡ 2s Blink After Hit</div>
            <div class="info-pill">🔴 100000 Target</div>
        </div>

        <!-- Chat -->
        <div class="chat-bar">
            <input type="text" id="chatInput" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Constants
        const W = 560, H = 350;
        const GROUND_Y = 280;
        const GRAVITY = 0.7;
        const JUMP_FORCE = -13;
        const BASE_SPEED = 5;
        const MAX_SPEED = 10;
        const HEART_BONUS = 100;
        const TARGET_SCORE = 100000;
        const INVINCIBLE_MS = 2000;

        // Random player colors
        const playerColors = [
            { name: 'Pink', color: '#ff6b9d', light: '#f8bbd0' },
            { name: 'Blue', color: '#74b9ff', light: '#a8d8ff' },
            { name: 'Green', color: '#4CAF50', light: '#a5d6a7' },
            { name: 'Orange', color: '#FF9800', light: '#ffcc80' },
            { name: 'Purple', color: '#9c27b0', light: '#ce93d8' },
            { name: 'Gold', color: '#fdcb6e', light: '#ffeaa7' }
        ];

        // Two canvases
        const myCanvas = document.getElementById('myCanvas');
        const myCtx = myCanvas.getContext('2d');
        const oppCanvas = document.getElementById('oppCanvas');
        const oppCtx = oppCanvas.getContext('2d');
        myCanvas.width = W; myCanvas.height = H;
        oppCanvas.width = W; oppCanvas.height = H;

        // State
        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let isHost = false, gameStarted = false, gameOver = false;
        let myScore = 0, oppScore = 0;
        let myObstacles = [], myHearts = [];
        let oppObstacles = [], oppHearts = [];
        let mySpeed = BASE_SPEED, oppSpeed = BASE_SPEED;
        let frameCount = 0;
        let myInvincibleUntil = 0;
        let myDead = false;
        let oppInvincibleUntil = 0;
        let oppDead = false;
        let myColorObj, oppColorObj;
        let oppLastSeen = Date.now();

        // My dino (in my canvas)
        const myDino = { x: 80, y: GROUND_Y - 50, w: 42, h: 50, vy: 0, jumping: false, alive: true };
        // Opponent dino (in opponent canvas)
        const oppDino = { x: 80, y: GROUND_Y - 50, w: 42, h: 50, vy: 0, jumping: false, alive: true };

        function init() {
            // Assign random colors
            const myColorIndex = Math.floor(Math.random() * playerColors.length);
            let oppColorIndex = Math.floor(Math.random() * playerColors.length);
            while (oppColorIndex === myColorIndex) {
                oppColorIndex = Math.floor(Math.random() * playerColors.length);
            }
            myColorObj = playerColors[myColorIndex];
            oppColorObj = playerColors[oppColorIndex];

            document.getElementById('myColorName').textContent = myColorObj.name;
            document.getElementById('myColorName').style.color = myColorObj.color;
            document.getElementById('oppColorName').textContent = oppColorObj.name;
            document.getElementById('oppColorName').style.color = oppColorObj.color;

            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || user.email.split('@')[0];
                    document.getElementById('youName').textContent = myName;
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                myPlayerId = user.uid;
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val(), 'matchmaking');
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val(), 'teams');
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data, col) {
            if (data.player1 === myPlayerId) {
                isHost = true;
                opponentId = data.player2 || null;
                opponentName = data.player2Name || 'Opponent';
            } else {
                opponentId = data.player1 || null;
                opponentName = data.player1Name || 'Opponent';
            }
            document.getElementById('oppName').textContent = opponentName;
            document.getElementById('oppLabelName').textContent = opponentName;

            if (opponentId) startGame();
            else {
                document.getElementById('statusChip').textContent = '⏳ Waiting...';
                db.ref(col + '/' + roomId).on('value', s => {
                    const d = s.val();
                    if (d && d.player2) {
                        opponentId = d.player2;
                        opponentName = d.player2Name || 'Opponent';
                        document.getElementById('oppName').textContent = opponentName;
                        document.getElementById('oppLabelName').textContent = opponentName;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            oppLastSeen = Date.now();
            document.getElementById('statusChip').textContent = '🟢 LIVE';
            setupChat();
            setupSync();
            gameLoop();
        }

        function setupSync() {
            // Send my state
            setInterval(() => {
                if (gameStarted && !gameOver) {
                    db.ref('gameRooms/' + roomId + '/players/' + myPlayerId).update({
                        y: myDino.y,
                        jumping: myDino.jumping,
                        alive: myDino.alive,
                        score: Math.floor(myScore),
                        speed: mySpeed,
                        invincible: Date.now() < myInvincibleUntil,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            }, 40);

            // Listen opponent state
            db.ref('gameRooms/' + roomId + '/players/' + opponentId).on('value', s => {
                const d = s.val();
                if (d && d.lastSeen) {
                    oppLastSeen = Date.now();
                    oppDino.y = d.y || oppDino.y;
                    oppDino.alive = d.alive !== false;
                    oppScore = d.score || 0;
                    oppSpeed = d.speed || BASE_SPEED;
                    if (d.invincible) {
                        oppInvincibleUntil = Date.now() + 500;
                    }
                    document.getElementById('oppScore').textContent = Math.floor(oppScore);
                    document.getElementById('oppMiniScore').textContent = Math.floor(oppScore);
                    document.getElementById('statusChip').textContent = '🟢 LIVE';
                    document.getElementById('myLeftOverlay').classList.remove('show');
                }
            });

            // Check disconnect every 3 seconds
            setInterval(() => {
                if (gameStarted && !gameOver) {
                    if (Date.now() - oppLastSeen > 8000) {
                        gameOver = true;
                        document.getElementById('statusChip').textContent = '💔 Left';
                        document.getElementById('myLeftOverlay').classList.add('show');
                        document.getElementById('myLeftOverlay').textContent = opponentName + ' left!';
                        
                        let count = 5;
                        const countdownInterval = setInterval(() => {
                            count--;
                            if (count > 0) {
                                document.getElementById('myLeftOverlay').textContent = opponentName + ' left! ' + count;
                            } else {
                                clearInterval(countdownInterval);
                                location.href = 'lobby.html';
                            }
                        }, 1000);
                    }
                }
            }, 3000);
        }

        function spawnMyObstacle() {
            const type = Math.random() > 0.5 ? 'cactus' : 'rock';
            const w = type === 'cactus' ? 22 + Math.random() * 10 : 28 + Math.random() * 14;
            const h = type === 'cactus' ? 35 + Math.random() * 25 : 18 + Math.random() * 14;
            myObstacles.push({ x: W + 40, y: GROUND_Y - h, w, h, type });
        }

        function spawnMyHeart() {
            myHearts.push({ x: W + 40, y: Math.random() * 100 + 60, w: 24, h: 24 });
        }

        function jump() {
            if (!gameStarted || gameOver || myDead) return;
            if (!myDino.jumping && myDino.alive) {
                myDino.vy = JUMP_FORCE;
                myDino.jumping = true;
            }
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
        });
        myCanvas.addEventListener('click', jump);
        myCanvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

        function update() {
            if (!gameStarted || gameOver) return;
            frameCount++;
            mySpeed = Math.min(MAX_SPEED, BASE_SPEED + frameCount * 0.001);

            // My dino physics
            if (myDino.jumping) {
                myDino.vy += GRAVITY;
                myDino.y += myDino.vy;
                if (myDino.y >= GROUND_Y - myDino.h) {
                    myDino.y = GROUND_Y - myDino.h;
                    myDino.jumping = false;
                    myDino.vy = 0;
                }
            }

            // Spawn my obstacles and hearts
            if (frameCount % 100 === 0) spawnMyObstacle();
            if (frameCount % 150 === 0) spawnMyHeart();

            // Move my obstacles
            for (let i = myObstacles.length - 1; i >= 0; i--) {
                myObstacles[i].x -= mySpeed;
                if (myObstacles[i].x + myObstacles[i].w < 0) myObstacles.splice(i, 1);
            }
            for (let i = myHearts.length - 1; i >= 0; i--) {
                myHearts[i].x -= mySpeed * 0.85;
                if (myHearts[i].x < -30) myHearts.splice(i, 1);
            }

            // My collisions - skip if invincible
            const myInvincible = Date.now() < myInvincibleUntil;
            if (myDino.alive && !myDead && !myInvincible) {
                for (const obs of myObstacles) {
                    if (rectCollide(myDino, obs)) {
                        myInvincibleUntil = Date.now() + INVINCIBLE_MS;
                        myDead = true;
                        setTimeout(() => { myDino.alive = true; myDead = false; myDino.y = GROUND_Y - 50; }, 500);
                        break;
                    }
                }
                for (let i = myHearts.length - 1; i >= 0; i--) {
                    if (rectCollide(myDino, myHearts[i])) {
                        myScore += HEART_BONUS;
                        myHearts.splice(i, 1);
                    }
                }
            }

            // Score
            if (myDino.alive && !myDead) {
                myScore += mySpeed * 0.2;
            }
            document.getElementById('youScore').textContent = Math.floor(myScore);
            document.getElementById('myMiniScore').textContent = Math.floor(myScore);
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function render() {
            // MY CANVAS
            myCtx.clearRect(0, 0, W, H);
            renderSky(myCtx);
            renderGround(myCtx);
            
            // My obstacles
            for (const o of myObstacles) {
                renderObstacle(myCtx, o);
            }
            // My hearts
            for (const h of myHearts) {
                myCtx.font = '20px Arial';
                myCtx.textAlign = 'center';
                myCtx.fillText('💗', h.x + 12, h.y + 12);
            }
            // My dino with blink
            if (myDino.alive) {
                const myInvincible = Date.now() < myInvincibleUntil;
                if (myInvincible && Math.floor(Date.now() / 100) % 2 === 0) {
                    myCtx.globalAlpha = 0.3;
                }
                drawDino(myCtx, myDino, myColorObj.color, myColorObj.name === 'Pink' ? '💕' : '🎮');
                myCtx.globalAlpha = 1;
            }

            // OPPONENT CANVAS
            oppCtx.clearRect(0, 0, W, H);
            renderSky(oppCtx);
            renderGround(oppCtx);
            
            // Opponent dino (simplified - just shows movement)
            if (oppDino.alive) {
                const oppInvincible = Date.now() < oppInvincibleUntil;
                if (oppInvincible && Math.floor(Date.now() / 100) % 2 === 0) {
                    oppCtx.globalAlpha = 0.3;
                }
                drawDino(oppCtx, oppDino, oppColorObj.color, oppColorObj.name === 'Blue' ? '💙' : '🎮');
                oppCtx.globalAlpha = 1;
            }
        }

        function renderSky(c) {
            const grad = c.createLinearGradient(0, 0, 0, GROUND_Y);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(0.4, '#1a1a3e');
            grad.addColorStop(0.7, '#4a2d6b');
            grad.addColorStop(0.9, '#e8a87c');
            grad.addColorStop(1, '#f4c4a8');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, GROUND_Y);
        }

        function renderGround(c) {
            c.fillStyle = '#2d3436';
            c.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            c.strokeStyle = '#e8a87c';
            c.lineWidth = 2;
            c.beginPath();
            c.moveTo(0, GROUND_Y);
            c.lineTo(W, GROUND_Y);
            c.stroke();
        }

        function renderObstacle(c, o) {
            if (o.type === 'cactus') {
                c.fillStyle = '#4CAF50';
                c.fillRect(o.x, o.y, o.w, o.h);
            } else {
                c.fillStyle = '#795548';
                c.beginPath();
                c.arc(o.x + o.w / 2, o.y + o.h, o.w / 2, Math.PI, 0);
                c.fill();
            }
        }

        function drawDino(c, d, color, emoji) {
            c.fillStyle = color;
            c.fillRect(d.x, d.y, d.w, d.h);
            c.fillStyle = 'rgba(255,255,255,0.25)';
            c.fillRect(d.x + 10, d.y + 20, d.w - 20, d.h - 25);
            c.fillStyle = 'white';
            c.beginPath();
            c.arc(d.x + d.w - 15, d.y + 14, 6, 0, Math.PI * 2);
            c.fill();
            c.fillStyle = '#1a1a1a';
            c.beginPath();
            c.arc(d.x + d.w - 13, d.y + 15, 3, 0, Math.PI * 2);
            c.fill();
            c.font = '15px Arial';
            c.textAlign = 'center';
            c.fillText(emoji, d.x + d.w / 2, d.y + d.h / 2 + 5);
        }

        // Chat
        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(20).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message';
            div.innerHTML = `<span class="sender" style="color:${sender === myName ? '#ff6b9d' : '#74b9ff'}">${sender}:</span> ${msg}`;
            c.appendChild(div);
            c.scrollLeft = c.scrollWidth;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
