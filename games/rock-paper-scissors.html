<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors ✂️ | UsBlog Games</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --blush-pink: #f8bbd0;
            --rose-gold: #b76e79;
            --dreamy-lavender: #e1bee7;
            --soft-cream: #fff9f0;
            --deep-rose: #d81b60;
            --soft-purple: #9c27b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 25%, #e8eaf6 50%, #fce4ec 75%, #f3e5f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -60px;
            animation: floatUp linear infinite;
            opacity: 0.2;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.25; }
            90% { opacity: 0.15; }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .game-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
            max-width: 700px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-btn {
            color: #d81b60;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            border: 1px solid rgba(216, 27, 96, 0.3);
        }

        .back-btn:hover {
            background: rgba(216, 27, 96, 0.1);
            transform: translateX(-3px);
        }

        .game-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            font-weight: 700;
            color: #d81b60;
            text-align: center;
        }

        .timer-display {
            text-align: center;
            margin-bottom: 1rem;
        }

        .timer-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f8bbd0, #e1bee7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 1.5rem;
            font-weight: 700;
            color: #d81b60;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.2);
            transition: all 0.3s;
        }

        .timer-circle.warning {
            background: linear-gradient(135deg, #ffccbc, #ffab91);
            animation: timerPulse 0.5s ease infinite;
            color: #e64a19;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .score-card {
            background: linear-gradient(135deg, #fff, #fce4ec);
            border-radius: 1.25rem;
            padding: 1rem;
            text-align: center;
            border: 2px solid rgba(216, 27, 96, 0.15);
            transition: all 0.3s;
        }

        .score-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .score-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #9c27b0;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .score-value {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #d81b60;
            transition: all 0.3s;
        }

        .score-value.pulse {
            animation: scorePulse 0.6s ease;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .battle-arena {
            background: linear-gradient(135deg, #fdf2f8, #fce4ec, #f3e5f5);
            border-radius: 1.5rem;
            padding: 1.5rem;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(216, 27, 96, 0.1);
        }

        .arena-content {
            text-align: center;
            width: 100%;
        }

        .arena-choices {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .arena-choice {
            text-align: center;
        }

        .arena-choice-label {
            font-size: 0.8rem;
            color: #9c27b0;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .arena-choice-emoji {
            font-size: 4rem;
            animation: fadeInScale 0.5s ease;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .arena-choice-name {
            font-size: 0.8rem;
            color: #999;
            margin-top: 0.25rem;
        }

        .vs-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #b76e79;
            font-weight: 700;
        }

        .arena-message {
            font-size: 1.3rem;
            color: #d81b60;
            font-family: 'Dancing Script', cursive;
        }

        .result-message {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #d81b60;
            min-height: 3rem;
            margin-bottom: 1rem;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .choice-card {
            background: linear-gradient(135deg, #ffffff, #fdf2f8);
            border-radius: 1.25rem;
            padding: 1.5rem 0.75rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(216, 27, 96, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .choice-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border-color: rgba(216, 27, 96, 0.4);
        }

        .choice-card:active {
            transform: translateY(-4px) scale(0.98);
        }

        .choice-card.selected {
            transform: translateY(-5px) scale(1.1);
            border-color: #d81b60;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.3);
            animation: selectedPulse 0.5s ease;
        }

        @keyframes selectedPulse {
            0%, 100% { transform: translateY(-5px) scale(1.1); }
            50% { transform: translateY(-5px) scale(1.2); }
        }

        .choice-icon {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            transition: transform 0.3s;
        }

        .choice-card:hover .choice-icon {
            transform: scale(1.2);
        }

        .choice-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.25rem;
        }

        .choice-desc {
            font-size: 0.7rem;
            color: #999;
            font-style: italic;
        }

        .reset-btn {
            display: block;
            margin: 0 auto;
            padding: 0.8rem 2.5rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: linear-gradient(135deg, #f8bbd0, #e1bee7);
            color: #d81b60;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.2);
            font-family: 'Poppins', sans-serif;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 1rem;
                border-radius: 1.5rem;
            }

            .game-title {
                font-size: 2rem;
            }

            .score-value {
                font-size: 2rem;
            }

            .choice-icon {
                font-size: 2.5rem;
            }

            .arena-choice-emoji {
                font-size: 3rem;
            }

            .vs-text {
                font-size: 2rem;
            }

            .choice-name {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-btn">← Back</a>
            <h1 class="game-title">✂️ Rock Paper Scissors</h1>
            <div style="width: 80px;"></div>
        </div>
        
        <div class="timer-display">
            <div class="timer-circle" id="timerCircle">5</div>
        </div>
        
        <div class="scoreboard">
            <div class="score-card">
                <div class="score-label">Your Score</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score-card">
                <div class="score-label">Partner's Score</div>
                <div class="score-value" id="aiScore">0</div>
            </div>
        </div>
        
        <div class="battle-arena" id="battleArena">
            <div class="arena-content" id="arenaContent">
                <div class="arena-message">💕 Choose your move!</div>
            </div>
        </div>
        
        <div class="result-message" id="resultMessage"></div>
        
        <div class="choices-grid">
            <div class="choice-card" id="cardRock" onclick="makeChoice('rock')">
                <div class="choice-icon">🪨</div>
                <div class="choice-name">Rock</div>
                <div class="choice-desc">Crushes Scissors</div>
            </div>
            <div class="choice-card" id="cardPaper" onclick="makeChoice('paper')">
                <div class="choice-icon">📄</div>
                <div class="choice-name">Paper</div>
                <div class="choice-desc">Covers Rock</div>
            </div>
            <div class="choice-card" id="cardScissors" onclick="makeChoice('scissors')">
                <div class="choice-icon">✂️</div>
                <div class="choice-name">Scissors</div>
                <div class="choice-desc">Cuts Paper</div>
            </div>
        </div>
        
        <button class="reset-btn" onclick="resetGame()">🌹 Reset Game</button>
    </div>
    
    <script src="../js/games/rock-paper-scissors.js"></script>
</body>
</html>
