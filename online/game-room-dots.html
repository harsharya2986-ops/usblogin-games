<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dots & Boxes 💕 | UsBlog Games</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --dark-amethyst: #1a1a2e;
            --purple-deep: #2d1b69;
            --rose-pink: #ff6b9d;
            --rose-glow: rgba(255, 107, 157, 0.6);
            --sunset-gold: #fdcb6e;
            --gold-glow: rgba(253, 203, 110, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --pearl: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #2d1b69 0%, #1a1a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }

        .particle {
            position: absolute;
            animation: floatParticle linear infinite;
            opacity: 0.2;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.25; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
        }

        .game-container {
            position: relative;
            z-index: 10;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .back-btn {
            color: #ff6b9d;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 157, 0.3);
        }

        .game-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
        }

        .status-bar {
            text-align: center;
            padding: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #ff6b9d;
            font-weight: 600;
        }

        .scoreboard {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .score-chip {
            padding: 0.5rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .score-chip.pink { color: #ff6b9d; border: 1px solid rgba(255, 107, 157, 0.3); }
        .score-chip.gold { color: #fdcb6e; border: 1px solid rgba(253, 203, 110, 0.3); }

        .main-layout {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .game-area {
            flex: 1;
            min-width: 0;
        }

        .board-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 2px solid var(--glass-border);
            position: relative;
        }

        .board {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 400px;
            margin: 0 auto;
        }

        .dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 40% 40%, #ffffff, #e0e0e0, #b0b0b0);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            z-index: 3;
            pointer-events: none;
        }

        .hline, .vline {
            position: absolute;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.25s ease;
            z-index: 2;
            background: transparent;
        }

        .hline { height: 6px; transform: translateY(-3px); }
        .vline { width: 6px; transform: translateX(-3px); }

        .hline:hover, .vline:hover {
            background: rgba(255, 107, 157, 0.4);
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.5);
        }

        .hline.pink, .vline.pink {
            background: #ff6b9d;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.7);
            cursor: default;
        }

        .hline.gold, .vline.gold {
            background: #fdcb6e;
            box-shadow: 0 0 15px rgba(253, 203, 110, 0.7);
            cursor: default;
        }

        .box-icon {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            z-index: 1;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
        }

        .chat-sidebar {
            width: 240px;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 450px;
        }

        .chat-header {
            padding: 12px 15px;
            background: rgba(255, 107, 157, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 14px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; min-height: 150px; max-height: 250px; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message { margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; font-size: 12px; }
        .chat-message.you { background: rgba(255, 107, 157, 0.15); border: 1px solid rgba(255, 107, 157, 0.3); margin-left: 15px; }
        .chat-message.opponent { background: rgba(116, 185, 255, 0.15); border: 1px solid rgba(116, 185, 255, 0.3); margin-right: 15px; }
        .chat-message .sender { font-weight: bold; font-size: 10px; display: block; margin-bottom: 3px; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); }

        .chat-input-area { display: flex; gap: 6px; padding: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-input-area input { flex: 1; padding: 8px 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 12px; }
        .chat-input-area button { padding: 8px 14px; border-radius: 18px; border: none; background: linear-gradient(135deg, #ff6b9d, #e84393); color: white; font-weight: bold; cursor: pointer; font-size: 12px; }

        .win-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }

        .win-content {
            text-align: center;
            background: rgba(26,26,46,0.95);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 2px solid #ff6b9d;
        }

        .win-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
        .win-title { font-family: 'Dancing Script', cursive; font-size: 1.8rem; font-weight: bold; color: #ff6b9d; margin-bottom: 0.5rem; }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 15px; max-height: 200px; }
            .chat-messages { max-height: 100px; min-height: 80px; }
            .game-title { font-size: 1.4rem; }
            .box-icon { font-size: 1.5rem; }
            .dot { width: 10px; height: 10px; }
            .hline { height: 4px; }
            .vline { width: 4px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Dots & Boxes</h1>
            <div style="width: 60px;"></div>
        </div>

        <div class="status-bar" id="statusBar">Loading...</div>

        <div class="scoreboard">
            <div class="score-chip pink">💕 You: <span id="playerScore">0</span></div>
            <div class="score-chip gold">💍 Opponent: <span id="opponentScore">0</span></div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="board-wrapper">
                    <div class="board" id="board"></div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; padding: 20px 0;">💕 Start chatting!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let roomId = null;
        let myPlayerId = null;
        let opponentId = null;
        let myName = '';
        let opponentName = '';
        let isHost = false;
        let gameStarted = false;
        let myColor = 'pink';
        let currentTurn = 'pink';
        let myScore = 0;
        let opponentScore = 0;
        let hLines = Array(4).fill(null).map(() => Array(3).fill(null));
        let vLines = Array(3).fill(null).map(() => Array(4).fill(null));
        let boxes = Array(3).fill(null).map(() => Array(3).fill(null));
        let gameOver = false;

        function createParticles() {
            const container = document.getElementById('particles');
            const symbols = ['💕', '💗', '💖', '✨', '💘'];
            for (let i = 0; i < 10; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.fontSize = Math.random() * 12 + 8 + 'px';
                p.style.animationDuration = Math.random() * 12 + 8 + 's';
                container.appendChild(p);
            }
        }

        function init() {
            createParticles();
            auth.onAuthStateChanged((user) => {
                if (!user) { window.location.href = 'login.html'; return; }
                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    myName = data ? data.username : user.email.split('@')[0];
                    document.getElementById('playerScore').textContent = '0';
                });
                const params = new URLSearchParams(window.location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;
                if (!roomId) { window.location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            database.ref('matchmaking/' + roomId).once('value').then((snapshot) => {
                if (snapshot.exists()) setupFromRoomData(snapshot.val(), 'matchmaking');
                else {
                    database.ref('teams/' + roomId).once('value').then((teamSnap) => {
                        if (teamSnap.exists()) setupFromRoomData(teamSnap.val(), 'teams');
                        else { alert('Room not found!'); window.location.href = 'lobby.html'; }
                    });
                }
            });
        }

        function setupFromRoomData(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true;
                myColor = 'pink';
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                isHost = false;
                myColor = 'gold';
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }
            document.getElementById('opponentScore').textContent = '0';
            if (opponentId) startGame();
            else {
                database.ref(collection + '/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.player2) {
                        opponentId = data.player2;
                        opponentName = data.player2Name || 'Opponent';
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            renderBoard();
            updateStatus();
            if (isHost) {
                syncState();
                database.ref('gameRooms/' + roomId + '/dbTurn').set('pink');
            }
            database.ref('gameRooms/' + roomId + '/dbState').on('value', (snap) => {
                const data = snap.val();
                if (data && !isHost) {
                    hLines = data.hLines || hLines;
                    vLines = data.vLines || vLines;
                    boxes = data.boxes || boxes;
                    renderBoard();
                }
            });
            database.ref('gameRooms/' + roomId + '/dbTurn').on('value', (snap) => {
                const turn = snap.val();
                if (turn) { currentTurn = turn; updateStatus(); }
            });
            database.ref('gameRooms/' + roomId + '/dbScores').on('value', (snap) => {
                const scores = snap.val();
                if (scores) {
                    myScore = scores[myColor] || 0;
                    opponentScore = scores[myColor === 'pink' ? 'gold' : 'pink'] || 0;
                    updateScores();
                }
            });
            setupChat();
        }

        function syncState() {
            database.ref('gameRooms/' + roomId + '/dbState').set({ hLines, vLines, boxes });
        }

        function updateStatus() {
            const bar = document.getElementById('statusBar');
            if (gameOver) return;
            if (currentTurn === myColor) bar.textContent = '💕 Your turn! Draw a line';
            else bar.textContent = '💙 Opponent\'s turn...';
        }

        function updateScores() {
            document.getElementById('playerScore').textContent = myScore;
            document.getElementById('opponentScore').textContent = opponentScore;
        }

        function drawLine(type, row, col) {
            if (!gameStarted || gameOver) return;
            if (currentTurn !== myColor) return;
            if (type === 'h' && hLines[row][col] !== null) return;
            if (type === 'v' && vLines[row][col] !== null) return;

            if (type === 'h') hLines[row][col] = myColor;
            else vLines[row][col] = myColor;

            let boxDone = false;
            if (type === 'h') {
                if (row > 0 && checkBox(row-1, col)) { boxes[row-1][col] = myColor; myScore++; boxDone = true; }
                if (row < 3 && checkBox(row, col)) { boxes[row][col] = myColor; myScore++; boxDone = true; }
            } else {
                if (col > 0 && checkBox(row, col-1)) { boxes[row][col-1] = myColor; myScore++; boxDone = true; }
                if (col < 3 && checkBox(row, col)) { boxes[row][col] = myColor; myScore++; boxDone = true; }
            }

            if (!boxDone) currentTurn = currentTurn === 'pink' ? 'gold' : 'pink';

            syncState();
            database.ref('gameRooms/' + roomId + '/dbTurn').set(currentTurn);
            database.ref('gameRooms/' + roomId + '/dbScores').set({
                pink: myColor === 'pink' ? myScore : opponentScore,
                gold: myColor === 'gold' ? myScore : opponentScore
            });

            if (boxes.every(r => r.every(b => b !== null))) {
                gameOver = true;
                showGameOver();
            }

            renderBoard();
            updateStatus();
            updateScores();
        }

        function checkBox(row, col) {
            return hLines[row][col] !== null && hLines[row+1][col] !== null &&
                   vLines[row][col] !== null && vLines[row][col+1] !== null;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const spacing = 100;

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    if (boxes[r][c]) {
                        const box = document.createElement('div');
                        box.className = 'box-icon';
                        box.style.left = (c*spacing + spacing/2) + 'px';
                        box.style.top = (r*spacing + spacing/2) + 'px';
                        box.textContent = boxes[r][c] === 'pink' ? '💕' : '💍';
                        boardEl.appendChild(box);
                    }
                }
            }

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 3; c++) {
                    const line = document.createElement('div');
                    line.className = 'hline';
                    if (hLines[r][c]) line.classList.add(hLines[r][c]);
                    line.style.left = (c*spacing + 5) + 'px';
                    line.style.top = (r*spacing) + 'px';
                    line.style.width = (spacing - 10) + 'px';
                    if (!hLines[r][c]) line.addEventListener('click', () => drawLine('h', r, c));
                    boardEl.appendChild(line);
                }
            }

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                    const line = document.createElement('div');
                    line.className = 'vline';
                    if (vLines[r][c]) line.classList.add(vLines[r][c]);
                    line.style.left = (c*spacing) + 'px';
                    line.style.top = (r*spacing + 5) + 'px';
                    line.style.height = (spacing - 10) + 'px';
                    if (!vLines[r][c]) line.addEventListener('click', () => drawLine('v', r, c));
                    boardEl.appendChild(line);
                }
            }

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.style.left = (c*spacing) + 'px';
                    dot.style.top = (r*spacing) + 'px';
                    boardEl.appendChild(dot);
                }
            }
        }

        function showGameOver() {
            const overlay = document.createElement('div');
            overlay.className = 'win-overlay';
            const isWin = myScore > opponentScore;
            const isTie = myScore === opponentScore;
            overlay.innerHTML = `
                <div class="win-content">
                    <div class="win-emoji">${isTie ? '🤝' : isWin ? '🎉' : '💙'}</div>
                    <div class="win-title">${isTie ? 'It\'s a Tie!' : isWin ? 'You Win!' : 'Opponent Wins!'}</div>
                    <div style="color: white; margin-bottom: 1rem;">💕 ${myScore} - ${opponentScore} 💍</div>
                    <button onclick="location.href='lobby.html'" style="padding: 10px 20px; border-radius: 20px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer;">Back to Lobby</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function setupChat() {
            const chatRef = database.ref('gameRooms/' + roomId + '/chat');
            chatRef.off();
            chatRef.limitToLast(50).on('child_added', (snap) => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message && roomId) {
                database.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: message,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMessage(sender, message, isYou) {
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages.querySelector('div[style*="padding: 20px"]')) chatMessages.innerHTML = '';
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
