<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Tic Tac Toe ⭕ | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --secondary: #e84393;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 30%, #9d174d 60%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 2rem;
            padding: 1.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .game-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9a8d4, #f472b6, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .players-info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .player-chip {
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .player-chip.you {
            background: rgba(255, 107, 157, 0.2);
            border: 1px solid #ff6b9d;
            color: #ff6b9d;
        }

        .player-chip.opponent {
            background: rgba(116, 185, 255, 0.2);
            border: 1px solid #74b9ff;
            color: #74b9ff;
        }

        .main-layout {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .game-area {
            flex: 1;
            min-width: 0;
        }

        .turn-indicator {
            text-align: center;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 13px;
        }

        .turn-indicator.your-turn {
            background: rgba(255, 107, 157, 0.2);
            color: #ff6b9d;
            border: 1px solid #ff6b9d;
        }

        .turn-indicator.opponent-turn {
            background: rgba(116, 185, 255, 0.2);
            color: #74b9ff;
            border: 1px solid #74b9ff;
        }

        .board-wrap {
            position: relative;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1;
        }

        .ttt-cell {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .ttt-cell:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #ff6b9d;
            transform: scale(1.05);
        }

        .ttt-cell.pink {
            animation: popIn 0.4s ease;
            text-shadow: 0 0 25px rgba(255, 107, 157, 0.9);
        }

        .ttt-cell.blue {
            animation: popIn 0.4s ease;
            text-shadow: 0 0 25px rgba(116, 185, 255, 0.9);
        }

        .ttt-cell.win {
            animation: winPulse 0.7s ease infinite;
            border-color: #fdcb6e;
            box-shadow: 0 0 30px rgba(253, 203, 110, 0.8);
            background: rgba(253, 203, 110, 0.15);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.25) rotate(10deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes winPulse {
            0%, 100% { border-color: #fdcb6e; box-shadow: 0 0 30px rgba(253, 203, 110, 0.8); }
            50% { border-color: #fff; box-shadow: 0 0 50px rgba(255, 255, 255, 1); }
        }

        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }

        .info-pill {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-sidebar {
            width: 260px;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 550px;
        }

        .chat-header {
            padding: 12px 15px;
            background: rgba(255, 107, 157, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 200px;
            max-height: 400px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.you {
            background: rgba(255, 107, 157, 0.15);
            border: 1px solid rgba(255, 107, 157, 0.3);
            margin-left: 20px;
        }

        .chat-message.opponent {
            background: rgba(116, 185, 255, 0.15);
            border: 1px solid rgba(116, 185, 255, 0.3);
            margin-right: 20px;
        }

        .chat-message .sender { font-weight: bold; font-size: 10px; display: block; margin-bottom: 3px; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); word-wrap: break-word; }
        .chat-message .time { font-size: 9px; color: rgba(255, 255, 255, 0.4); display: block; margin-top: 3px; text-align: right; }

        .chat-input-area {
            display: flex;
            gap: 6px;
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 12px;
        }

        .chat-input-area input:focus { border-color: #ff6b9d; }

        .chat-input-area button {
            padding: 8px 14px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .waiting-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            border-radius: 1.25rem;
        }

        .waiting-content { text-align: center; color: white; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff6b9d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            border-radius: 1.25rem;
        }

        .win-content {
            text-align: center;
            color: white;
            background: rgba(26, 26, 46, 0.95);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 2px solid #ff6b9d;
        }

        .win-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
        .win-title { font-size: 1.5rem; font-weight: bold; color: #ff6b9d; margin-bottom: 0.5rem; }
        .win-text { font-size: 0.9rem; opacity: 0.8; }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 15px; max-height: 250px; }
            .chat-messages { max-height: 150px; min-height: 100px; }
            .game-title { font-size: 18px; }
            .ttt-cell { font-size: 2.5rem; }
        }

        @media (max-width: 500px) {
            .ttt-cell { font-size: 2rem; }
            .ttt-board { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">⭕ Online Tic Tac Toe</h1>
            <div class="players-info">
                <div class="player-chip you" id="youChip">💕 You (Heart): 0</div>
                <div class="player-chip opponent" id="opponentChip">💙 Opponent (Ring): 0</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="turn-indicator" id="turnIndicator">Waiting for opponent...</div>
                <div class="board-wrap" id="boardWrap">
                    <div class="ttt-board" id="tttBoard"></div>
                    <div class="waiting-overlay" id="waitingOverlay">
                        <div class="waiting-content">
                            <div class="spinner"></div>
                            <p>Waiting for opponent...</p>
                        </div>
                    </div>
                </div>
                <div class="info-bar">
                    <div class="info-pill">💕 You are Heart</div>
                    <div class="info-pill">💍 Opponent is Ring</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; padding: 20px 0;">💕 Start chatting!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============ GAME STATE ============
        const WIN_PATTERNS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        let roomId = null;
        let myPlayerId = null;
        let opponentId = null;
        let myName = '';
        let opponentName = '';
        let isHost = false;
        let gameStarted = false;
        let mySymbol = 'pink'; // 'pink' (heart) or 'blue' (ring)
        let currentTurn = 'pink';
        let board = Array(9).fill(null);
        let myScore = 0;
        let opponentScore = 0;
        let winningCells = [];
        let gameOver = false;

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    myName = data ? data.username : user.email.split('@')[0];
                    document.getElementById('youChip').textContent = `💕 ${myName}: 0`;
                });

                const params = new URLSearchParams(window.location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;

                if (!roomId) {
                    window.location.href = 'lobby.html';
                    return;
                }

                setupRoom();
            });
        }

        function setupRoom() {
            const roomRef = database.ref('matchmaking/' + roomId);
            
            roomRef.once('value').then((snapshot) => {
                const roomData = snapshot.val();
                if (!roomData) {
                    database.ref('teams/' + roomId).once('value').then((teamSnap) => {
                        const teamData = teamSnap.val();
                        if (!teamData) { window.location.href = 'lobby.html'; return; }
                        setupFromRoomData(teamData, 'teams');
                    });
                    return;
                }
                setupFromRoomData(roomData, 'matchmaking');
            });
        }

        function setupFromRoomData(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true;
                mySymbol = 'pink';
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                isHost = false;
                mySymbol = 'blue';
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }

            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;

            if (opponentId) {
                startGame();
            } else {
                database.ref(collection + '/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.player2) {
                        opponentId = data.player2;
                        opponentName = data.player2Name || 'Opponent';
                        document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            document.getElementById('waitingOverlay').style.display = 'none';
            renderBoard();
            updateTurnIndicator();

            // Listen for board updates
            database.ref('gameRooms/' + roomId + '/tttBoard').on('value', (snap) => {
                const data = snap.val();
                if (data && !isHost) {
                    board = data;
                    renderBoard();
                    updateTurnIndicator();
                }
            });

            // Listen for turn
            database.ref('gameRooms/' + roomId + '/tttTurn').on('value', (snap) => {
                const turn = snap.val();
                if (turn) {
                    currentTurn = turn;
                    updateTurnIndicator();
                }
            });

            // Listen for game over
            database.ref('gameRooms/' + roomId + '/tttGameOver').on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    gameOver = true;
                    winningCells = data.winningCells || [];
                    if (data.winner === mySymbol) {
                        myScore++;
                    } else {
                        opponentScore++;
                    }
                    updateScoreDisplay();
                    renderBoard();
                    showWin(data.winner);
                }
            });

            setupChat();
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            if (!gameStarted) {
                indicator.textContent = 'Waiting for opponent...';
                indicator.className = 'turn-indicator';
                return;
            }
            if (gameOver) return;
            
            if (currentTurn === mySymbol) {
                indicator.textContent = '💕 Your Turn! Place your heart';
                indicator.className = 'turn-indicator your-turn';
            } else {
                indicator.textContent = '💙 Opponent\'s Turn...';
                indicator.className = 'turn-indicator opponent-turn';
            }
        }

        function updateScoreDisplay() {
            document.getElementById('youChip').textContent = `💕 ${myName}: ${myScore}`;
            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: ${opponentScore}`;
        }

        function makeMove(index) {
            if (!gameStarted || gameOver) return;
            if (currentTurn !== mySymbol) return;
            if (board[index] !== null) return;

            board[index] = mySymbol;
            
            // Check win
            const winCells = checkWin(mySymbol);
            if (winCells) {
                gameOver = true;
                winningCells = winCells;
                database.ref('gameRooms/' + roomId + '/tttGameOver').set({
                    winner: mySymbol,
                    winningCells: winCells
                });
                if (mySymbol === mySymbol) myScore++;
                updateScoreDisplay();
                renderBoard();
                showWin(mySymbol);
                return;
            }

            // Check draw
            if (board.every(cell => cell !== null)) {
                gameOver = true;
                database.ref('gameRooms/' + roomId + '/tttGameOver').set({
                    winner: 'tie',
                    winningCells: []
                });
                renderBoard();
                showWin('tie');
                return;
            }

            currentTurn = currentTurn === 'pink' ? 'blue' : 'pink';
            
            database.ref('gameRooms/' + roomId + '/tttBoard').set(board);
            database.ref('gameRooms/' + roomId + '/tttTurn').set(currentTurn);
            
            renderBoard();
            updateTurnIndicator();
        }

        function checkWin(symbol) {
            for (const pattern of WIN_PATTERNS) {
                const [a, b, c] = pattern;
                if (board[a] === symbol && board[b] === symbol && board[c] === symbol) {
                    return pattern;
                }
            }
            return null;
        }

        function renderBoard() {
            const boardEl = document.getElementById('tttBoard');
            boardEl.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'ttt-cell';
                cell.dataset.index = i;

                if (board[i] === 'pink') {
                    cell.textContent = '💕';
                    cell.classList.add('pink');
                } else if (board[i] === 'blue') {
                    cell.textContent = '💍';
                    cell.classList.add('blue');
                }

                if (winningCells.includes(i)) {
                    cell.classList.add('win');
                }

                cell.addEventListener('click', () => makeMove(i));
                boardEl.appendChild(cell);
            }
        }

        function showWin(winner) {
            const boardWrap = document.getElementById('boardWrap');
            const winOverlay = document.createElement('div');
            winOverlay.className = 'win-overlay';
            
            let emoji, title, text;
            if (winner === 'tie') {
                emoji = '🤝';
                title = 'It\'s a Tie!';
                text = 'Great minds think alike!';
            } else if (winner === mySymbol) {
                emoji = '🎉';
                title = 'You Win!';
                text = 'Three in a row!';
            } else {
                emoji = '💙';
                title = 'Opponent Wins!';
                text = 'Three in a row!';
            }
            
            winOverlay.innerHTML = `
                <div class="win-content">
                    <div class="win-emoji">${emoji}</div>
                    <div class="win-title">${title}</div>
                    <div class="win-text">${text}</div>
                    <button onclick="location.href='lobby.html'" style="margin-top: 1rem; padding: 10px 20px; border-radius: 20px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer;">Back to Lobby</button>
                </div>
            `;
            boardWrap.appendChild(winOverlay);
        }

        // Chat
        function setupChat() {
            database.ref('gameRooms/' + roomId + '/chat').on('child_added', (snap) => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName, msg.timestamp);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message) {
                database.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName,
                    message: message,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }

        function displayMessage(sender, message, isYou, timestamp) {
            const chatMessages = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            const time = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span><span class="time">${time}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
