<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Ping Pong 💕 | UsBlog Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #533483 75%, #e94560 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* Floating hearts background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .floating-heart {
            position: absolute;
            bottom: -50px;
            animation: floatHeart linear infinite;
            opacity: 0.3;
        }
        
        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.3; }
            90% { opacity: 0.2; }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .game-container {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5),
                        0 0 60px rgba(233, 69, 96, 0.3);
            max-width: 900px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .back-btn {
            color: #ff6b9d;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            border: 1px solid rgba(255, 107, 157, 0.3);
        }
        
        .back-btn:hover {
            background: rgba(255, 107, 157, 0.2);
            transform: translateX(-3px);
        }
        
        .game-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b9d, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        
        .scoreboard {
            display: flex;
            gap: 15px;
        }
        
        .score-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 10px 20px;
            text-align: center;
            min-width: 100px;
        }
        
        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 30px;
            font-weight: 800;
            display: block;
        }
        
        .pink-score { color: #ff6b9d; text-shadow: 0 0 15px rgba(255, 107, 157, 0.6); }
        .blue-score { color: #74b9ff; text-shadow: 0 0 15px rgba(116, 185, 255, 0.6); }
        
        .canvas-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 107, 157, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            background: #1a1a2e;
        }
        
        .info-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .info-pill {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            min-width: 120px;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .btn-start {
            background: linear-gradient(135deg, #ff6b9d, #e94560);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }
        
        .btn-pause {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
            box-shadow: 0 5px 20px rgba(253, 203, 110, 0.4);
        }
        
        .btn-reset {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.4);
        }
        
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
                border-radius: 20px;
            }
            
            .game-title {
                font-size: 20px;
            }
            
            .score-card {
                padding: 8px 12px;
                min-width: 70px;
            }
            
            .score-value {
                font-size: 22px;
            }
            
            .btn {
                padding: 10px 18px;
                font-size: 13px;
                min-width: 90px;
            }
            
            .info-pill {
                font-size: 10px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-btn">← Back</a>
            <h1 class="game-title">💕 Romantic Ping Pong</h1>
            <div class="scoreboard">
                <div class="score-card">
                    <span class="score-label">You</span>
                    <span class="score-value pink-score" id="playerScore">0</span>
                </div>
                <div class="score-card">
                    <span class="score-label">Partner</span>
                    <span class="score-value blue-score" id="aiScore">0</span>
                </div>
            </div>
        </div>
        
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>
        
        <div class="info-bar">
            <div class="info-pill">🖱️ Mouse or W/S Keys</div>
            <div class="info-pill">💕 First to 11 Wins</div>
            <div class="info-pill">⚡ Speed Increases</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-start" id="startBtn">💕 Start</button>
            <button class="btn btn-pause" id="pauseBtn">⏸️ Pause</button>
            <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
        </div>
    </div>
    
    <script src="../js/games/ping-pong.js"></script>
</body>
</html>
