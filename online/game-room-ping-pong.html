<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Ping Pong 🏓 | UsBlog Games</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --blue: #74b9ff;
            --green: #4CAF50;
            --orange: #FF9800;
            --purple: #9c27b0;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --white: #ffffff;
            --red: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1000px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b9d;
        }

        .scoreboard { display: flex; gap: 6px; flex-wrap: wrap; }

        .score-chip {
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
        }

        .score-chip.status { background: rgba(255,255,255,0.1); color: #fdcb6e; font-size: 10px; }

        .main-layout { display: flex; gap: 10px; }
        .game-area { flex: 1; min-width: 0; }

        .canvas-wrap {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            background: #0a0a1a;
            touch-action: none;
        }

        canvas { display: block; width: 100%; height: auto; }

        .info-bar { display: flex; gap: 5px; margin-top: 6px; justify-content: center; flex-wrap: wrap; }
        .info-pill { font-size: 9px; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.06); padding: 3px 8px; border-radius: 8px; }

        .chat-sidebar {
            width: 200px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            max-height: 350px;
        }

        .chat-header {
            padding: 8px;
            background: rgba(255,107,157,0.15);
            text-align: center;
            color: #ff6b9d;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 80px; max-height: 220px; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 2px; }

        .chat-message { margin-bottom: 5px; padding: 5px 8px; border-radius: 8px; font-size: 11px; }
        .chat-message.you { background: rgba(255,107,157,0.15); margin-left: 10px; }
        .chat-message.opponent { background: rgba(116,185,255,0.15); margin-right: 10px; }
        .chat-message .sender { font-weight: bold; font-size: 9px; display: block; }

        .chat-input-area { display: flex; gap: 4px; padding: 6px; }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 11px; }
        .chat-input-area button { padding: 6px 12px; border-radius: 14px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; font-size: 10px; }

        @media (max-width: 800px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; max-height: 120px; }
            .chat-messages { max-height: 50px; min-height: 30px; }
            .game-title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">🏓 Online Ping Pong</h1>
            <div class="scoreboard">
                <div class="score-chip" id="myScoreChip" style="background:rgba(255,255,255,0.1);">YOU: <span id="youScore">0</span></div>
                <div class="score-chip" id="oppScoreChip" style="background:rgba(255,255,255,0.1);">OPP: <span id="oppScore">0</span></div>
                <div class="score-chip status" id="statusChip">Connecting...</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="canvas-wrap" id="canvasWrap">
                    <canvas id="gameCanvas" width="800" height="450"></canvas>
                </div>
                <div class="info-bar">
                    <div class="info-pill">🖱️ Mouse / Touch / W-S</div>
                    <div class="info-pill">🎯 First to 25</div>
                    <div class="info-pill">🌐 LIVE</div>
                </div>
            </div>
            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const W = 800, H = 450;
        const PADDLE_W = 10, PADDLE_H = 90;
        const TARGET_SCORE = 25;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = W; canvas.height = H;

        const colors = ['#ff6b9d', '#74b9ff', '#4CAF50', '#FF9800', '#9c27b0', '#fdcb6e'];
        
        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let isHost = false, gameStarted = false, gameOver = false;
        let myScore = 0, oppScore = 0;
        let myPaddleY = H/2 - PADDLE_H/2;
        let oppPaddleY = H/2 - PADDLE_H/2;
        let myColor, oppColor;
        let oppLastSeen = Date.now();
        const ball = { x: W/2, y: H/2, vx: 4, vy: 2, radius: 8 };

        function init() {
            // Random colors - always different
            const myIdx = Math.floor(Math.random() * colors.length);
            let oppIdx = Math.floor(Math.random() * colors.length);
            while (oppIdx === myIdx) oppIdx = Math.floor(Math.random() * colors.length);
            myColor = colors[myIdx];
            oppColor = colors[oppIdx];

            document.getElementById('myScoreChip').style.color = myColor;
            document.getElementById('myScoreChip').style.borderColor = myColor;
            document.getElementById('oppScoreChip').style.color = oppColor;
            document.getElementById('oppScoreChip').style.borderColor = oppColor;

            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || user.email.split('@')[0];
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                myPlayerId = user.uid;
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val());
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val());
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data) {
            if (data.player1 === myPlayerId) {
                isHost = true;
                opponentId = data.player2 || null;
                opponentName = data.player2Name || 'Opponent';
            } else {
                opponentId = data.player1 || null;
                opponentName = data.player1Name || 'Opponent';
            }

            if (opponentId) startGame();
            else {
                document.getElementById('statusChip').textContent = 'Waiting...';
                const ref = db.ref('matchmaking/' + roomId + '/player2');
                ref.on('value', s => {
                    if (s.val()) {
                        opponentId = s.val();
                        db.ref('users/' + opponentId).once('value').then(us => {
                            opponentName = us.val()?.username || 'Opponent';
                            startGame();
                        });
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            oppLastSeen = Date.now();
            document.getElementById('statusChip').textContent = '🟢 LIVE';
            setupChat();
            setupSync();
            gameLoop();
        }

        function setupSync() {
            if (isHost) {
                resetBall();
                setInterval(() => {
                    if (gameStarted && !gameOver) {
                        updateBall();
                        db.ref('gameRooms/' + roomId + '/ppState').set({
                            bx: ball.x, by: ball.y, bvx: ball.vx, bvy: ball.vy,
                            hs: myScore, gs: oppScore
                        });
                    }
                }, 16);
            } else {
                db.ref('gameRooms/' + roomId + '/ppState').on('value', s => {
                    const d = s.val();
                    if (d) {
                        ball.x = d.bx; ball.y = d.by;
                        ball.vx = d.bvx; ball.vy = d.bvy;
                        myScore = d.gs || 0;
                        oppScore = d.hs || 0;
                        document.getElementById('youScore').textContent = myScore;
                        document.getElementById('oppScore').textContent = oppScore;
                    }
                });
            }

            // Paddle sync
            setInterval(() => {
                if (gameStarted && !gameOver) {
                    db.ref('gameRooms/' + roomId + '/ppPaddles/' + myPlayerId).set({
                        y: myPaddleY, t: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            }, 30);

            db.ref('gameRooms/' + roomId + '/ppPaddles/' + opponentId).on('value', s => {
                const d = s.val();
                if (d && d.t) {
                    oppLastSeen = Date.now();
                    oppPaddleY = d.y;
                    document.getElementById('statusChip').textContent = '🟢 LIVE';
                }
            });

            setInterval(() => {
                if (gameStarted && !gameOver && Date.now() - oppLastSeen > 8000) {
                    gameOver = true;
                    document.getElementById('statusChip').textContent = '💔 Left';
                    alert(opponentName + ' left!');
                    setTimeout(() => location.href = 'lobby.html', 1500);
                }
            }, 3000);
        }

        function resetBall() {
            ball.x = W/2; ball.y = H/2;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * 4;
            ball.vy = (Math.random() - 0.5) * 3;
        }

        function updateBall() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.y <= ball.radius) { ball.y = ball.radius; ball.vy = Math.abs(ball.vy); }
            if (ball.y >= H - ball.radius) { ball.y = H - ball.radius; ball.vy = -Math.abs(ball.vy); }

            // My paddle (left)
            if (ball.vx < 0 && ball.x - ball.radius <= PADDLE_W + 15 && ball.y >= myPaddleY && ball.y <= myPaddleY + PADDLE_H) {
                const rel = (myPaddleY + PADDLE_H/2) - ball.y;
                const norm = rel / (PADDLE_H/2);
                const ang = norm * 0.8;
                const sp = Math.min(10, Math.abs(ball.vx) + 0.3);
                ball.vx = sp * Math.cos(ang);
                ball.vy = -sp * Math.sin(ang);
                ball.x = PADDLE_W + 15 + ball.radius;
            }

            // Opponent paddle (right)
            if (ball.vx > 0 && ball.x + ball.radius >= W - PADDLE_W - 15 && ball.y >= oppPaddleY && ball.y <= oppPaddleY + PADDLE_H) {
                const rel = (oppPaddleY + PADDLE_H/2) - ball.y;
                const norm = rel / (PADDLE_H/2);
                const ang = norm * 0.8;
                const sp = Math.min(10, Math.abs(ball.vx) + 0.3);
                ball.vx = -sp * Math.cos(ang);
                ball.vy = -sp * Math.sin(ang);
                ball.x = W - PADDLE_W - 15 - ball.radius;
            }

            if (ball.x < -20) { oppScore++; updateScores(); checkWin(); resetBall(); }
            if (ball.x > W + 20) { myScore++; updateScores(); checkWin(); resetBall(); }
        }

        function updateScores() {
            document.getElementById('youScore').textContent = myScore;
            document.getElementById('oppScore').textContent = oppScore;
        }

        function checkWin() {
            if (myScore >= TARGET_SCORE || oppScore >= TARGET_SCORE) {
                gameOver = true;
                const win = myScore >= TARGET_SCORE;
                setTimeout(() => {
                    alert(win ? '🏆 YOU WIN!' : '💙 OPPONENT WINS!');
                    location.href = 'lobby.html';
                }, 500);
            }
        }

        document.addEventListener('mousemove', e => {
            const r = canvas.getBoundingClientRect();
            myPaddleY = (e.clientY - r.top) * (H / r.height) - PADDLE_H/2;
            clamp();
        });
        document.addEventListener('touchmove', e => {
            e.preventDefault();
            const r = canvas.getBoundingClientRect();
            myPaddleY = (e.touches[0].clientY - r.top) * (H / r.height) - PADDLE_H/2;
            clamp();
        }, {passive:false});
        document.addEventListener('keydown', e => {
            if (e.key==='w'||e.key==='W'||e.key==='ArrowUp') { myPaddleY -= 8; clamp(); }
            if (e.key==='s'||e.key==='S'||e.key==='ArrowDown') { myPaddleY += 8; clamp(); }
        });
        function clamp() {
            if (myPaddleY < 0) myPaddleY = 0;
            if (myPaddleY > H - PADDLE_H) myPaddleY = H - PADDLE_H;
        }

        function render() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8,8]);
            ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
            ctx.setLineDash([]);

            // MY PADDLE - left side with MY color
            ctx.fillStyle = myColor;
            ctx.shadowColor = myColor;
            ctx.shadowBlur = 15;
            ctx.fillRect(15, myPaddleY, PADDLE_W, PADDLE_H);
            ctx.shadowBlur = 0;

            // OPPONENT PADDLE - right side with OPPONENT color
            ctx.fillStyle = oppColor;
            ctx.shadowColor = oppColor;
            ctx.shadowBlur = 15;
            ctx.fillRect(W - PADDLE_W - 15, oppPaddleY, PADDLE_W, PADDLE_H);
            ctx.shadowBlur = 0;

            // Ball
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(50).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message, m.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg, isYou) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message ' + (isYou ? 'you' : 'opponent');
            div.innerHTML = '<span class="sender">' + sender + '</span>' + msg;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
