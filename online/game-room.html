<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dino Run 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --secondary: #e84393;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 30%, #9d174d 60%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 2rem;
            padding: 1.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .game-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9a8d4, #f472b6, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .players-info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .player-chip {
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .player-chip.you {
            background: rgba(255, 107, 157, 0.2);
            border: 1px solid #ff6b9d;
            color: #ff6b9d;
        }

        .player-chip.opponent {
            background: rgba(116, 185, 255, 0.2);
            border: 1px solid #74b9ff;
            color: #74b9ff;
        }

        .main-layout {
            display: flex;
            gap: 15px;
            align-items: stretch;
        }

        .game-area {
            flex: 1;
            min-width: 0;
        }

        .canvas-wrap {
            position: relative;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            background: #0a0a1a;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }

        .info-pill {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-sidebar {
            width: 260px;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 500px;
        }

        .chat-header {
            padding: 12px 15px;
            background: rgba(255, 107, 157, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 150px;
            max-height: 300px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.you {
            background: rgba(255, 107, 157, 0.15);
            border: 1px solid rgba(255, 107, 157, 0.3);
            margin-left: 20px;
        }

        .chat-message.opponent {
            background: rgba(116, 185, 255, 0.15);
            border: 1px solid rgba(116, 185, 255, 0.3);
            margin-right: 20px;
        }

        .chat-message .sender { font-weight: bold; font-size: 10px; display: block; margin-bottom: 3px; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); word-wrap: break-word; }

        .chat-input-area {
            display: flex;
            gap: 6px;
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 12px;
        }

        .chat-input-area button {
            padding: 8px 14px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 15px; max-height: 250px; }
            .chat-messages { max-height: 150px; }
            .game-title { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Dino Run</h1>
            <div class="players-info">
                <div class="player-chip you" id="youChip">💕 You: 0</div>
                <div class="player-chip opponent" id="opponentChip">💙 Opponent: 0</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="canvas-wrap" id="canvasWrap">
                    <canvas id="gameCanvas" width="850" height="400"></canvas>
                </div>
                <div class="info-bar">
                    <div class="info-pill">⌨️ Space / Click to Jump</div>
                    <div class="info-pill">💗 Collect Hearts (+100)</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; padding: 20px 0;">💕 Start chatting!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============ GAME STATE ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 850;
        const H = 400;
        canvas.width = W;
        canvas.height = H;

        const GROUND_Y = 320;
        const GRAVITY = 0.65;
        const JUMP_FORCE = -12.5;
        const BASE_SPEED = 5.5;
        const MAX_SPEED = 12;
        const HEART_BONUS = 100;

        let roomId = null;
        let myPlayerId = null;
        let opponentId = null;
        let myName = '';
        let opponentName = '';
        let isHost = false;
        let gameStarted = false;
        let myScore = 0;
        let opponentScore = 0;
        let obstacles = [];
        let hearts = [];
        let speed = BASE_SPEED;
        let frameCount = 0;
        let myDino = { x: 110, y: GROUND_Y - 50, width: 42, height: 50, vy: 0, jumping: false, isAlive: true, legFrame: 0 };
        let opponentDino = { x: 620, y: GROUND_Y - 50, width: 42, height: 50, vy: 0, jumping: false, isAlive: true, legFrame: 0 };

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    myName = data ? data.username : user.email.split('@')[0];
                    document.getElementById('youChip').textContent = `💕 ${myName}: 0`;
                });

                const params = new URLSearchParams(window.location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;

                if (!roomId) {
                    window.location.href = 'lobby.html';
                    return;
                }

                setupRoom();
            });
        }

        function setupRoom() {
            // Try matchmaking first
            database.ref('matchmaking/' + roomId).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    setupFromRoomData(snapshot.val(), 'matchmaking');
                } else {
                    // Try teams
                    database.ref('teams/' + roomId).once('value').then((teamSnap) => {
                        if (teamSnap.exists()) {
                            setupFromRoomData(teamSnap.val(), 'teams');
                        } else {
                            alert('Room not found!');
                            window.location.href = 'lobby.html';
                        }
                    });
                }
            });
        }

        function setupFromRoomData(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true;
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                isHost = false;
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }

            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;

            if (opponentId) {
                startGame();
            } else {
                // Wait for opponent
                const ref = database.ref(collection + '/' + roomId);
                ref.on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.player2) {
                        opponentId = data.player2;
                        opponentName = data.player2Name || 'Opponent';
                        document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;

            if (isHost) {
                // Host spawns obstacles
                setInterval(() => {
                    if (gameStarted) spawnObstacle();
                }, 1800);

                // Host spawns hearts
                setInterval(() => {
                    if (gameStarted) spawnHeart();
                }, 2500);

                // Host syncs game state
                setInterval(() => {
                    if (gameStarted) {
                        database.ref('gameRooms/' + roomId + '/obstacles').set(obstacles);
                        database.ref('gameRooms/' + roomId + '/hearts').set(hearts);
                        database.ref('gameRooms/' + roomId + '/speed').set(speed);
                    }
                }, 100);
            } else {
                // Non-host listens
                database.ref('gameRooms/' + roomId + '/obstacles').on('value', (snap) => {
                    if (snap.val()) obstacles = snap.val();
                });
                database.ref('gameRooms/' + roomId + '/hearts').on('value', (snap) => {
                    if (snap.val()) hearts = snap.val();
                });
                database.ref('gameRooms/' + roomId + '/speed').on('value', (snap) => {
                    if (snap.val()) speed = snap.val();
                });
            }

            // Sync my position
            setInterval(() => {
                if (gameStarted) {
                    database.ref('gameRooms/' + roomId + '/players/' + myPlayerId).set({
                        y: myDino.y,
                        jumping: myDino.jumping,
                        isAlive: myDino.isAlive,
                        score: Math.floor(myScore)
                    });
                }
            }, 50);

            // Listen to opponent
            database.ref('gameRooms/' + roomId + '/players/' + opponentId).on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    opponentDino.y = data.y || opponentDino.y;
                    opponentDino.isAlive = data.isAlive !== false;
                    opponentScore = data.score || 0;
                    document.getElementById('opponentChip').textContent = `💙 ${opponentName}: ${Math.floor(opponentScore)}`;
                }
            });

            setupChat();
            gameLoop();
        }

        function spawnObstacle() {
            const type = Math.random() > 0.55 ? 'cactus' : 'rock';
            let w = type === 'cactus' ? 22 + Math.random() * 10 : 28 + Math.random() * 14;
            let h = type === 'cactus' ? 38 + Math.random() * 25 : 18 + Math.random() * 14;
            obstacles.push({ x: W + 40, y: GROUND_Y - h, width: w, height: h, type: type });
        }

        function spawnHeart() {
            hearts.push({ x: W + 40, y: Math.random() * 130 + 70, width: 24, height: 24 });
        }

        function jump() {
            if (!gameStarted || !myDino.isAlive) return;
            if (!myDino.jumping) {
                myDino.vy = JUMP_FORCE;
                myDino.jumping = true;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

        function update() {
            if (!gameStarted) return;
            frameCount++;
            if (isHost) speed = Math.min(MAX_SPEED, BASE_SPEED + frameCount * 0.0015);

            if (myDino.jumping) {
                myDino.vy += GRAVITY;
                myDino.y += myDino.vy;
                if (myDino.y >= GROUND_Y - myDino.height) {
                    myDino.y = GROUND_Y - myDino.height;
                    myDino.jumping = false;
                    myDino.vy = 0;
                }
            }

            if (frameCount % 8 === 0) {
                myDino.legFrame = (myDino.legFrame + 1) % 2;
                opponentDino.legFrame = (opponentDino.legFrame + 1) % 2;
            }

            // Move obstacles (host only)
            if (isHost) {
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= speed;
                    if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
                }
                for (let i = hearts.length - 1; i >= 0; i--) {
                    hearts[i].x -= speed * 0.85;
                    if (hearts[i].x < -30) hearts.splice(i, 1);
                }
            }

            // Collisions (local for each player)
            if (myDino.isAlive) {
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    if (rectCollide(myDino, obstacles[i])) {
                        myDino.isAlive = false;
                        setTimeout(() => { myDino.isAlive = true; myDino.y = GROUND_Y - 50; }, 2000);
                    }
                }
                for (let i = hearts.length - 1; i >= 0; i--) {
                    if (rectCollide(myDino, hearts[i])) {
                        myScore += HEART_BONUS;
                        if (isHost) hearts.splice(i, 1);
                    }
                }
            }

            if (myDino.isAlive) myScore += speed * 0.1;
            document.getElementById('youChip').textContent = `💕 ${myName}: ${Math.floor(myScore)}`;
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            
            // Sky
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, '#0a0a1a');
            skyGrad.addColorStop(0.35, '#1a1a3e');
            skyGrad.addColorStop(0.7, '#4a2d6b');
            skyGrad.addColorStop(0.9, '#e8a87c');
            skyGrad.addColorStop(1, '#f4c4a8');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.arc((i * 40) % W, (i * 30) % 150, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Ground
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.strokeStyle = '#e8a87c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();

            // Obstacles
            for (let obs of obstacles) {
                if (obs.type === 'cactus') {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.fillRect(obs.x - 6, obs.y + 10, 8, 15);
                    ctx.fillRect(obs.x + obs.width - 2, obs.y + 14, 8, 12);
                } else {
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.width / 2, obs.y + obs.height, obs.width / 2, Math.PI, 0);
                    ctx.fill();
                }
            }

            // Hearts
            for (let h of hearts) {
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('💗', h.x + 12, h.y + 12);
            }

            // My dino (pink)
            if (myDino.isAlive) drawDino(myDino, '#f472b6', '💕');

            // Opponent dino (blue)
            if (opponentDino.isAlive) drawDino(opponentDino, '#60a5fa', '💙');

            // Connection line
            if (myDino.isAlive && opponentDino.isAlive) {
                ctx.save();
                ctx.strokeStyle = 'rgba(244,114,182,0.25)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(myDino.x + myDino.width / 2, myDino.y + myDino.height / 2);
                ctx.lineTo(opponentDino.x + opponentDino.width / 2, opponentDino.y + opponentDino.height / 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }
        }

        function drawDino(d, color, emoji) {
            ctx.fillStyle = color;
            ctx.fillRect(d.x, d.y, d.width, d.height);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(d.x + 10, d.y + 20, d.width - 20, d.height - 25);
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(d.x + d.width - 15, d.y + 14, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(d.x + d.width - 13, d.y + 15, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = color;
            const lo = d.legFrame === 0 ? 0 : 6;
            ctx.fillRect(d.x + 10, d.y + d.height - 4, 10, 18 + lo);
            ctx.fillRect(d.x + d.width - 20, d.y + d.height - 4, 10, 18 - lo);
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(emoji, d.x + d.width / 2, d.y + d.height / 2 + 6);
        }

        // ============ CHAT ============
        function setupChat() {
            const chatRef = database.ref('gameRooms/' + roomId + '/chat');
            chatRef.off();
            chatRef.limitToLast(50).on('child_added', (snap) => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message && roomId) {
                database.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName,
                    message: message,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMessage(sender, message, isYou) {
            const chatMessages = document.getElementById('chatMessages');
            // Clear placeholder
            if (chatMessages.querySelector('div[style*="padding: 20px"]')) {
                chatMessages.innerHTML = '';
            }
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
