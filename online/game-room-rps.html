<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Rock Paper Scissors ✂️ | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --white: #ffffff;
            --red: #ff4444;
            --green: #4CAF50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255,107,157,0.5);
        }

        /* BIG SCOREBOARD */
        .scoreboard {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 12px;
        }

        .score-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 12px 25px;
            text-align: center;
            min-width: 140px;
            border: 2px solid;
        }

        .score-card.you-card {
            border-color: #ff6b9d;
            background: rgba(255,107,157,0.15);
        }

        .score-card.opp-card {
            border-color: #74b9ff;
            background: rgba(116,185,255,0.15);
        }

        .score-card.round-card {
            border-color: #fdcb6e;
            background: rgba(253,203,110,0.15);
            min-width: 100px;
        }

        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .score-value {
            font-size: 32px;
            font-weight: 800;
            display: block;
        }

        .score-card.you-card .score-value { color: #ff6b9d; text-shadow: 0 0 15px rgba(255,107,157,0.6); }
        .score-card.opp-card .score-value { color: #74b9ff; text-shadow: 0 0 15px rgba(116,185,255,0.6); }
        .score-card.round-card .score-value { color: #fdcb6e; text-shadow: 0 0 15px rgba(253,203,110,0.6); }

        .timer-display {
            text-align: center;
            margin-bottom: 10px;
        }

        .timer-circle {
            display: inline-block;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 3px solid #fdcb6e;
            color: #fdcb6e;
            font-size: 22px;
            font-weight: bold;
            line-height: 44px;
            text-align: center;
            animation: pulseTimer 1s infinite;
        }

        @keyframes pulseTimer {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .main-layout { display: flex; gap: 10px; }
        .game-area { flex: 1; min-width: 0; }

        .arena {
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .arena-content { text-align: center; }

        .arena-hands {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .hand-display { text-align: center; }

        .hand-label {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .hand-emoji {
            font-size: 4rem;
            transition: all 0.3s;
        }

        .hand-emoji.hidden-hand {
            filter: blur(5px);
            opacity: 0.5;
        }

        .hand-emoji.revealed {
            animation: revealHand 0.5s ease;
        }

        @keyframes revealHand {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .vs-badge {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 15px rgba(255,107,157,0.6);
        }

        .result-display {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 30px;
            margin-bottom: 10px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .choice-card {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-card:hover {
            transform: translateY(-5px);
            border-color: #ff6b9d;
            box-shadow: 0 5px 20px rgba(255,107,157,0.3);
        }

        .choice-card.selected {
            border-color: #ff6b9d;
            background: rgba(255,107,157,0.25);
            transform: translateY(-3px);
        }

        .choice-card:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .hand-emoji-small { font-size: 2.5rem; display: block; margin-bottom: 3px; }
        .hand-name { font-size: 12px; color: white; font-weight: 600; }

        .chat-sidebar {
            width: 200px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            max-height: 400px;
        }

        .chat-header {
            padding: 8px;
            background: rgba(255,107,157,0.15);
            text-align: center;
            color: #ff6b9d;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 120px; max-height: 250px; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 2px; }

        .chat-message { margin-bottom: 5px; padding: 5px 8px; border-radius: 8px; font-size: 11px; }
        .chat-message.you { background: rgba(255,107,157,0.15); margin-left: 10px; }
        .chat-message.opponent { background: rgba(116,185,255,0.15); margin-right: 10px; }
        .chat-message .sender { font-weight: bold; font-size: 9px; display: block; }

        .chat-input-area { display: flex; gap: 4px; padding: 6px; }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 11px; }
        .chat-input-area button { padding: 6px 12px; border-radius: 14px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; font-size: 10px; }

        @media (max-width: 700px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; max-height: 130px; }
            .chat-messages { max-height: 60px; min-height: 40px; }
            .hand-emoji { font-size: 2.5rem; }
            .hand-emoji-small { font-size: 2rem; }
            .score-value { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">✂️ Online RPS</h1>
        </div>

        <!-- BIG SCOREBOARD -->
        <div class="scoreboard">
            <div class="score-card you-card">
                <span class="score-label">💕 You</span>
                <span class="score-value" id="youScore">0</span>
            </div>
            <div class="score-card round-card">
                <span class="score-label">Round</span>
                <span class="score-value" id="roundNum">1/25</span>
            </div>
            <div class="score-card opp-card">
                <span class="score-label">💙 Opponent</span>
                <span class="score-value" id="oppScore">0</span>
            </div>
        </div>

        <div class="timer-display">
            <div class="timer-circle" id="timerDisplay">5</div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="arena">
                    <div class="arena-content" id="arenaContent">
                        <div class="arena-hands">
                            <div class="hand-display">
                                <div class="hand-label">YOU</div>
                                <div class="hand-emoji" id="myHand">❓</div>
                            </div>
                            <div class="vs-badge">VS</div>
                            <div class="hand-display">
                                <div class="hand-label">OPPONENT</div>
                                <div class="hand-emoji hidden-hand" id="oppHand">❓</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="result-display" id="resultDisplay">Choose your move!</div>

                <div class="choices-grid">
                    <div class="choice-card" id="rockBtn" onclick="makeChoice('rock')">
                        <span class="hand-emoji-small">✊</span>
                        <span class="hand-name">Rock</span>
                    </div>
                    <div class="choice-card" id="paperBtn" onclick="makeChoice('paper')">
                        <span class="hand-emoji-small">✋</span>
                        <span class="hand-name">Paper</span>
                    </div>
                    <div class="choice-card" id="scissorsBtn" onclick="makeChoice('scissors')">
                        <span class="hand-emoji-small">✌️</span>
                        <span class="hand-name">Scissors</span>
                    </div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const TOTAL_ROUNDS = 25;
        const ROUND_TIME = 5;
        const HANDS = { rock: '✊', paper: '✋', scissors: '✌️' };

        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let gameStarted = false, gameOver = false;
        let myScore = 0, oppScore = 0;
        let currentRound = 1;
        let myChoice = null, oppChoice = null;
        let timerInterval = null;
        let timeLeft = ROUND_TIME;
        let oppLastSeen = Date.now();

        function init() {
            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || user.email.split('@')[0];
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                myPlayerId = user.uid;
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val());
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val());
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data) {
            if (data.player1 === myPlayerId) {
                opponentId = data.player2 || null;
                opponentName = data.player2Name || 'Opponent';
            } else {
                opponentId = data.player1 || null;
                opponentName = data.player1Name || 'Opponent';
            }

            if (opponentId) startGame();
            else {
                db.ref('matchmaking/' + roomId + '/player2').on('value', s => {
                    if (s.val()) {
                        opponentId = s.val();
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            oppLastSeen = Date.now();
            setupChat();
            setupListeners();
            startTimer();
        }

        function startTimer() {
            timeLeft = ROUND_TIME;
            document.getElementById('timerDisplay').textContent = timeLeft;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    if (!myChoice) {
                        const random = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
                        makeChoice(random);
                    }
                }
            }, 1000);
        }

        function setupListeners() {
            db.ref('gameRooms/' + roomId + '/rpsChoices').on('value', s => {
                const data = s.val();
                if (data && data[opponentId]) {
                    oppLastSeen = Date.now();
                    if (!oppChoice) {
                        oppChoice = data[opponentId];
                        document.getElementById('oppHand').textContent = HANDS[oppChoice];
                        document.getElementById('oppHand').classList.remove('hidden-hand');
                        document.getElementById('oppHand').classList.add('revealed');
                        checkResult();
                    }
                }
            });

            db.ref('gameRooms/' + roomId + '/rpsScores').on('value', s => {
                const scores = s.val();
                if (scores) {
                    myScore = scores[myPlayerId] || 0;
                    oppScore = scores[opponentId] || 0;
                    document.getElementById('youScore').textContent = myScore;
                    document.getElementById('oppScore').textContent = oppScore;
                }
            });

            // Opponent disconnect check
            setInterval(() => {
                if (gameStarted && !gameOver && Date.now() - oppLastSeen > 10000) {
                    gameOver = true;
                    alert(opponentName + ' has left!');
                    location.href = 'lobby.html';
                }
            }, 5000);
        }

        function makeChoice(choice) {
            if (!gameStarted || gameOver || myChoice) return;

            myChoice = choice;
            document.getElementById('myHand').textContent = HANDS[choice];
            document.getElementById('myHand').classList.add('revealed');

            document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(choice + 'Btn').classList.add('selected');
            document.querySelectorAll('.choice-card').forEach(c => c.disabled = true);

            db.ref('gameRooms/' + roomId + '/rpsChoices/' + myPlayerId).set(choice);
            checkResult();
        }

        function checkResult() {
            if (!myChoice || !oppChoice || gameOver) return;

            clearInterval(timerInterval);
            const result = determineWinner(myChoice, oppChoice);
            const display = document.getElementById('resultDisplay');

            if (result === 'win') {
                myScore++;
                display.textContent = '🎉 YOU WIN!';
                display.style.color = '#4CAF50';
            } else if (result === 'lose') {
                oppScore++;
                display.textContent = '💙 OPPONENT WINS!';
                display.style.color = '#ff4444';
            } else {
                display.textContent = '🤝 TIE!';
                display.style.color = '#fdcb6e';
            }

            db.ref('gameRooms/' + roomId + '/rpsScores').set({
                [myPlayerId]: myScore,
                [opponentId]: oppScore
            });

            document.getElementById('youScore').textContent = myScore;
            document.getElementById('oppScore').textContent = oppScore;

            if (currentRound >= TOTAL_ROUNDS) {
                gameOver = true;
                setTimeout(() => {
                    const msg = myScore > oppScore ? '🏆 YOU WIN THE GAME!' : myScore < oppScore ? '💙 OPPONENT WINS!' : '🤝 TIE GAME!';
                    alert(msg);
                    location.href = 'lobby.html';
                }, 1500);
                return;
            }

            setTimeout(() => {
                currentRound++;
                document.getElementById('roundNum').textContent = currentRound + '/25';
                myChoice = null;
                oppChoice = null;
                document.getElementById('myHand').textContent = '❓';
                document.getElementById('myHand').classList.remove('revealed');
                document.getElementById('oppHand').textContent = '❓';
                document.getElementById('oppHand').classList.add('hidden-hand');
                document.getElementById('oppHand').classList.remove('revealed');
                document.getElementById('resultDisplay').textContent = 'Choose your move!';
                document.querySelectorAll('.choice-card').forEach(c => {
                    c.disabled = false;
                    c.classList.remove('selected');
                });
                db.ref('gameRooms/' + roomId + '/rpsChoices').remove();
                startTimer();
            }, 2000);
        }

        function determineWinner(my, opp) {
            if (my === opp) return 'tie';
            if ((my === 'rock' && opp === 'scissors') ||
                (my === 'paper' && opp === 'rock') ||
                (my === 'scissors' && opp === 'paper')) return 'win';
            return 'lose';
        }

        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(50).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message, m.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg, isYou) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message ' + (isYou ? 'you' : 'opponent');
            div.innerHTML = '<span class="sender">' + sender + '</span>' + msg;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
