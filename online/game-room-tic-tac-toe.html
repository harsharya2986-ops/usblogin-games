<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Super Tic Tac Toe 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 30%, #9d174d 60%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 2rem;
            padding: 1.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .game-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9a8d4, #f472b6, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .players-info { display: flex; gap: 8px; flex-wrap: wrap; }
        .player-chip { padding: 6px 14px; border-radius: 18px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .player-chip.you { background: rgba(255, 107, 157, 0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .player-chip.opponent { background: rgba(116, 185, 255, 0.2); border: 1px solid #74b9ff; color: #74b9ff; }

        .main-layout { display: flex; gap: 15px; align-items: flex-start; }
        .game-area { flex: 1; min-width: 0; }

        .turn-indicator {
            text-align: center;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .turn-indicator.your-turn { background: rgba(255, 107, 157, 0.2); color: #ff6b9d; border: 1px solid #ff6b9d; }
        .turn-indicator.opponent-turn { background: rgba(116, 185, 255, 0.2); color: #74b9ff; border: 1px solid #74b9ff; }

        .board-wrap {
            border-radius: 1rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
        }

        .macro-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            aspect-ratio: 1;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .macro-cell {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .macro-cell.active {
            border-color: #ff6b9d;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.5);
        }

        .macro-cell.won-pink {
            background: rgba(255, 107, 157, 0.15);
            border-color: #ff6b9d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .macro-cell.won-blue {
            background: rgba(116, 185, 255, 0.15);
            border-color: #74b9ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .macro-overlay { font-size: 35px; animation: popIn 0.4s ease; }

        @keyframes popIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .mini-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .mini-cell {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mini-cell:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .mini-cell.pink { color: #ff6b9d; text-shadow: 0 0 10px rgba(255, 107, 157, 0.8); animation: placeMark 0.3s ease; }
        .mini-cell.blue { color: #74b9ff; text-shadow: 0 0 10px rgba(116, 185, 255, 0.8); animation: placeMark 0.3s ease; }

        @keyframes placeMark {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .info-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; justify-content: center; }
        .info-pill { font-size: 11px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 15px; }

        .chat-sidebar {
            width: 250px;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 500px;
        }

        .chat-header {
            padding: 10px;
            background: rgba(255, 107, 157, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 13px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; min-height: 150px; max-height: 350px; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message { margin-bottom: 8px; padding: 6px 10px; border-radius: 10px; font-size: 11px; }
        .chat-message.you { background: rgba(255, 107, 157, 0.15); border: 1px solid rgba(255, 107, 157, 0.3); margin-left: 15px; }
        .chat-message.opponent { background: rgba(116, 185, 255, 0.15); border: 1px solid rgba(116, 185, 255, 0.3); margin-right: 15px; }
        .chat-message .sender { font-weight: bold; font-size: 9px; display: block; margin-bottom: 2px; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); }

        .chat-input-area { display: flex; gap: 5px; padding: 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 11px; }
        .chat-input-area button { padding: 6px 12px; border-radius: 15px; border: none; background: linear-gradient(135deg, #ff6b9d, #e84393); color: white; font-weight: bold; cursor: pointer; font-size: 11px; }

        .win-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }

        .win-content {
            text-align: center;
            background: rgba(26,26,46,0.95);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 2px solid #ff6b9d;
        }

        .win-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
        .win-title { font-size: 1.5rem; font-weight: bold; color: #ff6b9d; margin-bottom: 0.5rem; }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 10px; max-height: 200px; }
            .chat-messages { max-height: 100px; min-height: 80px; }
            .game-title { font-size: 16px; }
            .mini-cell { font-size: 12px; }
            .macro-overlay { font-size: 25px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Super Tic Tac Toe</h1>
            <div class="players-info">
                <div class="player-chip you" id="youChip">💕 You: 0</div>
                <div class="player-chip opponent" id="opponentChip">💙 Opponent: 0</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="turn-indicator" id="turnIndicator">Loading...</div>
                <div class="board-wrap">
                    <div class="macro-board" id="macroBoard"></div>
                </div>
                <div class="info-bar">
                    <div class="info-pill">💕 You are Pink</div>
                    <div class="info-pill">💙 Opponent is Blue</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 11px; padding: 15px 0;">💕 Start chatting!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let isHost = false, gameStarted = false, myColor = 'pink', currentTurn = 'pink';
        let myScore = 0, opponentScore = 0;
        let macroBoard = Array(9).fill(null);
        let miniBoards = Array(9).fill(null).map(() => Array(9).fill(null));
        let gameOver = false;

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) { window.location.href = 'login.html'; return; }

                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    myName = data ? data.username : user.email.split('@')[0];
                    document.getElementById('youChip').textContent = `💕 ${myName}: 0`;
                });

                const params = new URLSearchParams(window.location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;
                if (!roomId) { window.location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            database.ref('matchmaking/' + roomId).once('value').then((snapshot) => {
                if (snapshot.exists()) setupFromRoomData(snapshot.val(), 'matchmaking');
                else {
                    database.ref('teams/' + roomId).once('value').then((teamSnap) => {
                        if (teamSnap.exists()) setupFromRoomData(teamSnap.val(), 'teams');
                        else { alert('Room not found!'); window.location.href = 'lobby.html'; }
                    });
                }
            });
        }

        function setupFromRoomData(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true;
                myColor = 'pink';
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                isHost = false;
                myColor = 'blue';
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }

            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;

            if (opponentId) startGame();
            else {
                database.ref(collection + '/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.player2) {
                        opponentId = data.player2;
                        opponentName = data.player2Name || 'Opponent';
                        document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            renderBoard();
            updateTurnIndicator();

            if (isHost) {
                database.ref('gameRooms/' + roomId + '/sttMacro').set(macroBoard);
                database.ref('gameRooms/' + roomId + '/sttMini').set(miniBoards);
                database.ref('gameRooms/' + roomId + '/sttTurn').set('pink');
            }

            database.ref('gameRooms/' + roomId + '/sttMacro').on('value', (snap) => {
                const data = snap.val();
                if (data && !isHost) { macroBoard = data; renderBoard(); }
            });

            database.ref('gameRooms/' + roomId + '/sttMini').on('value', (snap) => {
                const data = snap.val();
                if (data && !isHost) { miniBoards = data; renderBoard(); }
            });

            database.ref('gameRooms/' + roomId + '/sttTurn').on('value', (snap) => {
                const turn = snap.val();
                if (turn) { currentTurn = turn; updateTurnIndicator(); }
            });

            setupChat();
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            if (currentTurn === myColor) {
                indicator.textContent = '💕 Your Turn!';
                indicator.className = 'turn-indicator your-turn';
            } else {
                indicator.textContent = '💙 Opponent\'s Turn...';
                indicator.className = 'turn-indicator opponent-turn';
            }
        }

        function checkMiniWinner(boardIndex) {
            const b = miniBoards[boardIndex];
            const patterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (const [a,b2,c] of patterns) {
                if (b[a] && b[a] === b[b2] && b[a] === b[c]) return b[a];
            }
            return null;
        }

        function checkMacroWinner() {
            const patterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (const [a,b,c] of patterns) {
                if (macroBoard[a] && macroBoard[a] === macroBoard[b] && macroBoard[a] === macroBoard[c] && macroBoard[a] !== 'tie') return macroBoard[a];
            }
            return null;
        }

        function isMiniFull(boardIndex) {
            return miniBoards[boardIndex].every(cell => cell !== null);
        }

        function makeMove(macroIndex, miniIndex) {
            if (!gameStarted || gameOver) return;
            if (currentTurn !== myColor) return;
            if (miniBoards[macroIndex][miniIndex] !== null) return;
            if (macroBoard[macroIndex] !== null) return;

            miniBoards[macroIndex][miniIndex] = myColor;

            const miniWinner = checkMiniWinner(macroIndex);
            if (miniWinner) macroBoard[macroIndex] = miniWinner;
            else if (isMiniFull(macroIndex)) macroBoard[macroIndex] = 'tie';

            const macroWinner = checkMacroWinner();
            if (macroWinner) {
                gameOver = true;
                database.ref('gameRooms/' + roomId + '/sttMacro').set(macroBoard);
                database.ref('gameRooms/' + roomId + '/sttMini').set(miniBoards);
                renderBoard();
                showWin(macroWinner);
                return;
            }

            currentTurn = currentTurn === 'pink' ? 'blue' : 'pink';
            database.ref('gameRooms/' + roomId + '/sttMacro').set(macroBoard);
            database.ref('gameRooms/' + roomId + '/sttMini').set(miniBoards);
            database.ref('gameRooms/' + roomId + '/sttTurn').set(currentTurn);
            renderBoard();
            updateTurnIndicator();
        }

        function renderBoard() {
            const boardEl = document.getElementById('macroBoard');
            boardEl.innerHTML = '';

            for (let macroIndex = 0; macroIndex < 9; macroIndex++) {
                const macroCell = document.createElement('div');
                macroCell.className = 'macro-cell';

                if (macroBoard[macroIndex] === 'pink') {
                    macroCell.classList.add('won-pink');
                    macroCell.innerHTML = '<div class="macro-overlay">💕</div>';
                } else if (macroBoard[macroIndex] === 'blue') {
                    macroCell.classList.add('won-blue');
                    macroCell.innerHTML = '<div class="macro-overlay">💙</div>';
                } else if (macroBoard[macroIndex] === 'tie') {
                    macroCell.innerHTML = '<div class="macro-overlay">🤝</div>';
                    macroCell.style.opacity = '0.5';
                } else {
                    const miniBoard = document.createElement('div');
                    miniBoard.className = 'mini-board';
                    for (let miniIndex = 0; miniIndex < 9; miniIndex++) {
                        const miniCell = document.createElement('div');
                        miniCell.className = 'mini-cell';
                        miniCell.dataset.macro = macroIndex;
                        miniCell.dataset.mini = miniIndex;
                        const val = miniBoards[macroIndex][miniIndex];
                        if (val === 'pink') { miniCell.textContent = '💕'; miniCell.classList.add('pink'); }
                        else if (val === 'blue') { miniCell.textContent = '💙'; miniCell.classList.add('blue'); }
                        miniCell.addEventListener('click', () => makeMove(macroIndex, miniIndex));
                        miniBoard.appendChild(miniCell);
                    }
                    macroCell.appendChild(miniBoard);
                }
                boardEl.appendChild(macroCell);
            }
        }

        function showWin(winner) {
            const overlay = document.createElement('div');
            overlay.className = 'win-overlay';
            const isWinner = winner === myColor;
            overlay.innerHTML = `
                <div class="win-content">
                    <div class="win-emoji">${isWinner ? '🎉' : '💙'}</div>
                    <div class="win-title">${isWinner ? 'You Win!' : 'Opponent Wins!'}</div>
                    <button onclick="location.href='lobby.html'" style="padding: 10px 20px; border-radius: 20px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; margin-top: 1rem;">Back to Lobby</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function setupChat() {
            const chatRef = database.ref('gameRooms/' + roomId + '/chat');
            chatRef.off();
            chatRef.limitToLast(50).on('child_added', (snap) => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message && roomId) {
                database.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: message,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMessage(sender, message, isYou) {
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages.querySelector('div[style*="padding: 15px"]')) chatMessages.innerHTML = '';
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
