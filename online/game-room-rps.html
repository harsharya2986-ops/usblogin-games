<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Rock Paper Scissors ✂️ | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --secondary: #e84393;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 30%, #9d174d 60%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 2rem;
            padding: 1.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .game-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9a8d4, #f472b6, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .players-info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .player-chip {
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .player-chip.you {
            background: rgba(255, 107, 157, 0.2);
            border: 1px solid #ff6b9d;
            color: #ff6b9d;
        }

        .player-chip.opponent {
            background: rgba(116, 185, 255, 0.2);
            border: 1px solid #74b9ff;
            color: #74b9ff;
        }

        .main-layout {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .game-area {
            flex: 1;
            min-width: 0;
        }

        .round-indicator {
            text-align: center;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .arena-wrap {
            position: relative;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
        }

        .arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 150px;
            flex-wrap: wrap;
        }

        .choice-display {
            text-align: center;
        }

        .choice-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .choice-emoji {
            font-size: 4rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .vs-text {
            font-size: 2rem;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .result-display {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fdcb6e;
            min-height: 30px;
            margin-top: 10px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .choice-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-card:hover {
            transform: translateY(-5px);
            border-color: #ff6b9d;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .choice-card.selected {
            border-color: #ff6b9d;
            background: rgba(255, 107, 157, 0.2);
        }

        .choice-card:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .choice-icon {
            font-size: 2.5rem;
            margin-bottom: 0.25rem;
        }

        .choice-name {
            font-size: 0.8rem;
            color: white;
            font-weight: 600;
        }

        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }

        .info-pill {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-sidebar {
            width: 260px;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 550px;
        }

        .chat-header {
            padding: 12px 15px;
            background: rgba(255, 107, 157, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 200px;
            max-height: 400px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.you {
            background: rgba(255, 107, 157, 0.15);
            border: 1px solid rgba(255, 107, 157, 0.3);
            margin-left: 20px;
        }

        .chat-message.opponent {
            background: rgba(116, 185, 255, 0.15);
            border: 1px solid rgba(116, 185, 255, 0.3);
            margin-right: 20px;
        }

        .chat-message .sender { font-weight: bold; font-size: 10px; display: block; margin-bottom: 3px; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); word-wrap: break-word; }
        .chat-message .time { font-size: 9px; color: rgba(255, 255, 255, 0.4); display: block; margin-top: 3px; text-align: right; }

        .chat-input-area {
            display: flex;
            gap: 6px;
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 12px;
        }

        .chat-input-area input:focus { border-color: #ff6b9d; }

        .chat-input-area button {
            padding: 8px 14px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .waiting-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            border-radius: 1.25rem;
        }

        .waiting-content { text-align: center; color: white; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff6b9d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 15px; max-height: 250px; }
            .chat-messages { max-height: 150px; min-height: 100px; }
            .game-title { font-size: 18px; }
            .choice-emoji { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">✂️ Online Rock Paper Scissors</h1>
            <div class="players-info">
                <div class="player-chip you" id="youChip">💕 You: 0</div>
                <div class="player-chip opponent" id="opponentChip">💙 Opponent: 0</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="round-indicator" id="roundIndicator">Round 1</div>
                <div class="arena-wrap" id="arenaWrap">
                    <div class="arena" id="arena">
                        <div class="choice-display">
                            <div class="choice-label">You</div>
                            <div class="choice-emoji" id="myChoice">❓</div>
                        </div>
                        <div class="vs-text">VS</div>
                        <div class="choice-display">
                            <div class="choice-label">Opponent</div>
                            <div class="choice-emoji" id="opponentChoice">❓</div>
                        </div>
                    </div>
                    <div class="result-display" id="resultDisplay"></div>
                    <div class="waiting-overlay" id="waitingOverlay">
                        <div class="waiting-content">
                            <div class="spinner"></div>
                            <p>Waiting for opponent...</p>
                        </div>
                    </div>
                </div>

                <div class="choices-grid">
                    <button class="choice-card" id="rockBtn" onclick="makeChoice('rock')">
                        <div class="choice-icon">🪨</div>
                        <div class="choice-name">Rock</div>
                    </button>
                    <button class="choice-card" id="paperBtn" onclick="makeChoice('paper')">
                        <div class="choice-icon">📄</div>
                        <div class="choice-name">Paper</div>
                    </button>
                    <button class="choice-card" id="scissorsBtn" onclick="makeChoice('scissors')">
                        <div class="choice-icon">✂️</div>
                        <div class="choice-name">Scissors</div>
                    </button>
                </div>

                <div class="info-bar">
                    <div class="info-pill">✂️ Click to choose</div>
                    <div class="info-pill">🏆 First to 5 wins</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; padding: 20px 0;">💕 Start chatting!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============ GAME STATE ============
        const WIN_SCORE = 5;
        const choices = { rock: '🪨', paper: '📄', scissors: '✂️' };
        
        let roomId = null;
        let myPlayerId = null;
        let opponentId = null;
        let myName = '';
        let opponentName = '';
        let isHost = false;
        let gameStarted = false;
        let myScore = 0;
        let opponentScore = 0;
        let round = 1;
        let myChoice = null;
        let opponentChoice = null;
        let roundActive = true;

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    myName = data ? data.username : user.email.split('@')[0];
                    document.getElementById('youChip').textContent = `💕 ${myName}: 0`;
                });

                const params = new URLSearchParams(window.location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;

                if (!roomId) {
                    window.location.href = 'lobby.html';
                    return;
                }

                setupRoom();
            });
        }

        function setupRoom() {
            const roomRef = database.ref('matchmaking/' + roomId);
            
            roomRef.once('value').then((snapshot) => {
                const roomData = snapshot.val();
                if (!roomData) {
                    database.ref('teams/' + roomId).once('value').then((teamSnap) => {
                        const teamData = teamSnap.val();
                        if (!teamData) { window.location.href = 'lobby.html'; return; }
                        setupFromRoomData(teamData, 'teams');
                    });
                    return;
                }
                setupFromRoomData(roomData, 'matchmaking');
            });
        }

        function setupFromRoomData(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true;
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                isHost = false;
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }

            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;

            if (opponentId) {
                startGame();
            } else {
                database.ref(collection + '/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.player2) {
                        opponentId = data.player2;
                        opponentName = data.player2Name || 'Opponent';
                        document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            document.getElementById('waitingOverlay').style.display = 'none';

            // Listen for opponent choice
            database.ref('gameRooms/' + roomId + '/rpsChoices').on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    if (data[opponentId]) {
                        opponentChoice = data[opponentId];
                        document.getElementById('opponentChoice').textContent = choices[opponentChoice] || '❓';
                        checkRoundResult();
                    }
                }
            });

            // Listen for scores
            database.ref('gameRooms/' + roomId + '/rpsScores').on('value', (snap) => {
                const scores = snap.val();
                if (scores) {
                    myScore = scores[myPlayerId] || 0;
                    opponentScore = scores[opponentId] || 0;
                    updateScoreDisplay();
                    checkGameOver();
                }
            });

            // Listen for round reset
            database.ref('gameRooms/' + roomId + '/rpsRound').on('value', (snap) => {
                const roundNum = snap.val();
                if (roundNum) {
                    round = roundNum;
                    document.getElementById('roundIndicator').textContent = `Round ${round}`;
                    resetRound();
                }
            });

            setupChat();
        }

        function makeChoice(choice) {
            if (!gameStarted || !roundActive) return;
            if (myChoice) return;

            myChoice = choice;
            document.getElementById('myChoice').textContent = choices[choice];
            
            // Highlight selected
            document.querySelectorAll('.choice-card').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(choice + 'Btn').classList.add('selected');
            document.querySelectorAll('.choice-card').forEach(btn => btn.disabled = true);

            // Send choice
            database.ref('gameRooms/' + roomId + '/rpsChoices/' + myPlayerId).set(choice);

            checkRoundResult();
        }

        function checkRoundResult() {
            if (!myChoice || !opponentChoice || !roundActive) return;

            roundActive = false;
            const result = determineWinner(myChoice, opponentChoice);
            
            if (result === 'win') {
                myScore++;
                document.getElementById('resultDisplay').textContent = '🎉 You win this round!';
                document.getElementById('resultDisplay').style.color = '#4caf50';
            } else if (result === 'lose') {
                opponentScore++;
                document.getElementById('resultDisplay').textContent = '💙 Opponent wins this round!';
                document.getElementById('resultDisplay').style.color = '#e91e63';
            } else {
                document.getElementById('resultDisplay').textContent = '🤝 Tie!';
                document.getElementById('resultDisplay').style.color = '#ff9800';
            }

            // Update scores in Firebase
            database.ref('gameRooms/' + roomId + '/rpsScores').set({
                [myPlayerId]: myScore,
                [opponentId]: opponentScore
            });

            updateScoreDisplay();

            // Next round after delay
            setTimeout(() => {
                round++;
                database.ref('gameRooms/' + roomId + '/rpsRound').set(round);
            }, 2000);
        }

        function determineWinner(my, opponent) {
            if (my === opponent) return 'tie';
            if ((my === 'rock' && opponent === 'scissors') ||
                (my === 'paper' && opponent === 'rock') ||
                (my === 'scissors' && opponent === 'paper')) {
                return 'win';
            }
            return 'lose';
        }

        function resetRound() {
            myChoice = null;
            opponentChoice = null;
            roundActive = true;
            document.getElementById('myChoice').textContent = '❓';
            document.getElementById('opponentChoice').textContent = '❓';
            document.getElementById('resultDisplay').textContent = '';
            document.querySelectorAll('.choice-card').forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('selected');
            });
        }

        function checkGameOver() {
            if (myScore >= WIN_SCORE || opponentScore >= WIN_SCORE) {
                const winner = myScore >= WIN_SCORE ? myName : opponentName;
                setTimeout(() => {
                    alert(`🏆 ${winner} wins the game!`);
                    location.href = 'lobby.html';
                }, 1000);
            }
        }

        function updateScoreDisplay() {
            document.getElementById('youChip').textContent = `💕 ${myName}: ${myScore}`;
            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: ${opponentScore}`;
        }

        // Chat
        function setupChat() {
            database.ref('gameRooms/' + roomId + '/chat').on('child_added', (snap) => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName, msg.timestamp);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message) {
                database.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName,
                    message: message,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }

        function displayMessage(sender, message, isYou, timestamp) {
            const chatMessages = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            const time = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span><span class="time">${time}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
