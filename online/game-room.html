<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dino Run 💕 | UsBlog Games</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-light: #f8bbd0;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --darker: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
            --red: #ff4444;
            --green: #4CAF50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255,107,157,0.5);
        }

        .scoreboard { display: flex; gap: 6px; flex-wrap: wrap; }

        .score-chip {
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
        }

        .score-chip.you { background: rgba(255,107,157,0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .score-chip.opponent { background: rgba(116,185,255,0.2); border: 1px solid #74b9ff; color: #74b9ff; }
        .score-chip.status { background: rgba(255,255,255,0.1); color: #fdcb6e; font-size: 10px; }
        .score-chip.target { background: rgba(253,203,110,0.2); border: 1px solid #fdcb6e; color: #fdcb6e; }

        .main-layout { display: flex; gap: 10px; }
        .game-area { flex: 1; min-width: 0; }

        .canvas-wrap {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            background: #0a0a1a;
        }

        canvas { display: block; width: 100%; height: auto; }

        /* Disconnect Overlay */
        .disconnect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .disconnect-overlay.show { display: flex; }

        .disconnect-content {
            text-align: center;
            background: rgba(26, 26, 46, 0.95);
            padding: 2rem 3rem;
            border-radius: 20px;
            border: 2px solid #ff4444;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .disconnect-emoji { font-size: 4rem; margin-bottom: 1rem; }
        .disconnect-title { font-size: 1.5rem; font-weight: bold; color: #ff4444; margin-bottom: 0.5rem; }
        .disconnect-text { font-size: 1rem; color: white; margin-bottom: 1rem; }
        .disconnect-countdown { font-size: 3rem; font-weight: bold; color: #fdcb6e; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .info-bar { display: flex; gap: 6px; margin-top: 8px; justify-content: center; flex-wrap: wrap; }
        .info-pill { font-size: 10px; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 10px; }
        .info-pill.warning { color: #fdcb6e; background: rgba(253,203,110,0.1); }

        .chat-sidebar {
            width: 220px;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            max-height: 400px;
        }

        .chat-header {
            padding: 8px;
            background: rgba(255,107,157,0.15);
            text-align: center;
            color: #ff6b9d;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 100px; max-height: 250px; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 2px; }

        .chat-message { margin-bottom: 5px; padding: 5px 8px; border-radius: 8px; font-size: 11px; }
        .chat-message.you { background: rgba(255,107,157,0.15); margin-left: 10px; }
        .chat-message.opponent { background: rgba(116,185,255,0.15); margin-right: 10px; }
        .chat-message .sender { font-weight: bold; font-size: 9px; display: block; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }

        .chat-input-area { display: flex; gap: 4px; padding: 6px; }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 11px; }
        .chat-input-area button { padding: 6px 12px; border-radius: 14px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; font-size: 10px; }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; max-height: 140px; }
            .chat-messages { max-height: 70px; min-height: 50px; }
            .game-title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Dino Run</h1>
            <div class="scoreboard">
                <div class="score-chip you">💕 <span id="youName">You</span>: <span id="youScore">0</span></div>
                <div class="score-chip opponent">💙 <span id="oppName">Opp</span>: <span id="oppScore">0</span></div>
                <div class="score-chip target">🎯 Target: <span id="targetScore">10000</span></div>
                <div class="score-chip status" id="statusChip">Connecting...</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="canvas-wrap">
                    <canvas id="gameCanvas" width="850" height="400"></canvas>
                </div>
                <div class="info-bar">
                    <div class="info-pill">⌨️ Space/Click/Tap</div>
                    <div class="info-pill">💗 +100</div>
                    <div class="info-pill warning">🛡️ 3s Invincible After Hit</div>
                    <div class="info-pill">🌐 LIVE</div>
                </div>
            </div>
            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Disconnect Overlay -->
    <div class="disconnect-overlay" id="disconnectOverlay">
        <div class="disconnect-content">
            <div class="disconnect-emoji">💔</div>
            <div class="disconnect-title" id="disconnectTitle">Teammate Left!</div>
            <div class="disconnect-text" id="disconnectText">Redirecting in...</div>
            <div class="disconnect-countdown" id="disconnectCountdown">5</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        // =====================================================
        // FIREBASE CONFIGURATION
        // =====================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // =====================================================
        // GAME CONSTANTS
        // =====================================================
        const W = 850, H = 400;
        const GROUND_Y = 320;
        const GRAVITY = 0.7;
        const JUMP_FORCE = -13;
        const BASE_SPEED = 5;
        const MAX_SPEED = 10;
        const HEART_BONUS = 100;
        const TARGET_SCORE = 10000;
        const INVINCIBLE_DURATION = 3000; // 3 seconds in ms
        const DISCONNECT_REDIRECT_DELAY = 5000; // 5 seconds

        // =====================================================
        // CANVAS SETUP
        // =====================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = W;
        canvas.height = H;

        // =====================================================
        // GAME STATE
        // =====================================================
        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let isHost = false, gameStarted = false, gameOver = false;
        let myScore = 0, oppScore = 0;
        let obstacles = [], hearts = [];
        let speed = BASE_SPEED;
        let frameCount = 0;
        let invincibleUntil = 0;
        let disconnectTimer = null;
        let disconnectCountdownInterval = null;

        // =====================================================
        // PLAYER OBJECTS
        // =====================================================
        const myDino = {
            x: 100, y: GROUND_Y - 50, w: 42, h: 50,
            vy: 0, jumping: false, alive: true
        };

        const oppDino = {
            x: 620, y: GROUND_Y - 50, w: 42, h: 50,
            currentY: GROUND_Y - 50, targetY: GROUND_Y - 50,
            previousY: GROUND_Y - 50,
            interpolationTime: 0, interpolationDuration: 0.05,
            alive: true
        };

        // =====================================================
        // INITIALIZATION
        // =====================================================
        function init() {
            document.getElementById('targetScore').textContent = TARGET_SCORE;
            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || user.email.split('@')[0];
                    document.getElementById('youName').textContent = myName;
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                myPlayerId = user.uid;
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val(), 'matchmaking');
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val(), 'teams');
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data, col) {
            if (data.player1 === myPlayerId) {
                isHost = true;
                opponentId = data.player2 || null;
                opponentName = data.player2Name || 'Opponent';
            } else {
                opponentId = data.player1 || null;
                opponentName = data.player1Name || 'Opponent';
            }
            document.getElementById('oppName').textContent = opponentName;

            if (opponentId) startGame();
            else {
                document.getElementById('statusChip').textContent = '⏳ Waiting...';
                db.ref(col + '/' + roomId).on('value', s => {
                    const d = s.val();
                    if (d && d.player2) {
                        opponentId = d.player2;
                        opponentName = d.player2Name || 'Opponent';
                        document.getElementById('oppName').textContent = opponentName;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            document.getElementById('statusChip').textContent = '🟢 LIVE';
            setupChat();
            setupSync();
            gameLoop();
        }

        function setupSync() {
            if (isHost) {
                setInterval(() => { if (gameStarted && !gameOver) spawnObstacle(); }, 1600);
                setInterval(() => { if (gameStarted && !gameOver) spawnHeart(); }, 2400);
                setInterval(() => {
                    if (gameStarted) {
                        db.ref('gameRooms/' + roomId + '/state').set({
                            obstacles, hearts, speed,
                            hostScore: Math.floor(myScore),
                            hostAlive: myDino.alive
                        });
                    }
                }, 80);
            } else {
                db.ref('gameRooms/' + roomId + '/state').on('value', s => {
                    const d = s.val();
                    if (d) {
                        obstacles = d.obstacles || [];
                        hearts = d.hearts || [];
                        speed = d.speed || BASE_SPEED;
                        oppScore = d.hostScore || 0;
                        oppDino.alive = d.hostAlive !== false;
                        document.getElementById('oppScore').textContent = Math.floor(oppScore);
                    }
                });
            }

            setInterval(() => {
                if (gameStarted) {
                    db.ref('gameRooms/' + roomId + '/players/' + myPlayerId).set({
                        y: myDino.y, jumping: myDino.jumping,
                        alive: myDino.alive, score: Math.floor(myScore)
                    });
                }
            }, 40);

            // Listen opponent with disconnect detection
            db.ref('gameRooms/' + roomId + '/players/' + opponentId).on('value', s => {
                const d = s.val();
                if (d) {
                    oppDino.targetY = d.y ?? oppDino.targetY;
                    oppDino.alive = d.alive !== false;
                    document.getElementById('statusChip').textContent = '🟢 LIVE';
                } else {
                    // Opponent disconnected
                    handleOpponentDisconnect();
                }
            });
        }

        // =====================================================
        // DISCONNECT HANDLING
        // =====================================================
        function handleOpponentDisconnect() {
            if (gameOver) return;
            gameOver = true;
            document.getElementById('statusChip').textContent = '💔 Left';
            
            const overlay = document.getElementById('disconnectOverlay');
            const countdownEl = document.getElementById('disconnectCountdown');
            const titleEl = document.getElementById('disconnectTitle');
            
            titleEl.textContent = `${opponentName} has gone!`;
            overlay.classList.add('show');
            
            let countdown = 5;
            countdownEl.textContent = countdown;
            
            disconnectCountdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    countdownEl.textContent = countdown;
                } else {
                    clearInterval(disconnectCountdownInterval);
                    window.location.href = 'lobby.html';
                }
            }, 1000);
        }

        // =====================================================
        // GAME OBJECTS
        // =====================================================
        function spawnObstacle() {
            const type = Math.random() > 0.5 ? 'cactus' : 'rock';
            const w = type === 'cactus' ? 22 + Math.random() * 10 : 28 + Math.random() * 14;
            const h = type === 'cactus' ? 35 + Math.random() * 25 : 18 + Math.random() * 14;
            obstacles.push({ x: W + 40, y: GROUND_Y - h, w, h, type });
        }

        function spawnHeart() {
            hearts.push({ x: W + 40, y: Math.random() * 120 + 70, w: 24, h: 24 });
        }

        // =====================================================
        // JUMP CONTROL
        // =====================================================
        function jump() {
            if (!gameStarted || gameOver || !myDino.alive) return;
            if (!myDino.jumping) {
                myDino.vy = JUMP_FORCE;
                myDino.jumping = true;
            }
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
        });
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

        // =====================================================
        // GAME UPDATE
        // =====================================================
        function update() {
            if (!gameStarted || gameOver) return;
            frameCount++;

            // Medium speed progression
            if (isHost) {
                speed = Math.min(MAX_SPEED, BASE_SPEED + frameCount * 0.001);
            }

            // My dino physics
            if (myDino.jumping) {
                myDino.vy += GRAVITY;
                myDino.y += myDino.vy;
                if (myDino.y >= GROUND_Y - myDino.h) {
                    myDino.y = GROUND_Y - myDino.h;
                    myDino.jumping = false;
                    myDino.vy = 0;
                }
            }

            // Interpolate opponent
            oppDino.interpolationTime += 0.016; // Approx 60fps dt
            const t = Math.min(oppDino.interpolationTime / oppDino.interpolationDuration, 1);
            oppDino.y = oppDino.previousY + (oppDino.targetY - oppDino.previousY) * t;
            if (t >= 1) {
                oppDino.previousY = oppDino.targetY;
                oppDino.interpolationTime = 0;
            }

            // Move obstacles (host)
            if (isHost) {
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= speed;
                    if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
                }
                for (let i = hearts.length - 1; i >= 0; i--) {
                    hearts[i].x -= speed * 0.85;
                    if (hearts[i].x < -30) hearts.splice(i, 1);
                }
            }

            // Collisions
            const isInvincible = Date.now() < invincibleUntil;
            
            if (myDino.alive) {
                if (!isInvincible) {
                    for (const obs of obstacles) {
                        if (rectCollide(myDino, obs)) {
                            myDino.alive = false;
                            setTimeout(() => {
                                myDino.alive = true;
                                myDino.y = GROUND_Y - 50;
                                invincibleUntil = Date.now() + INVINCIBLE_DURATION;
                            }, 1500);
                            break;
                        }
                    }
                }
                
                for (let i = hearts.length - 1; i >= 0; i--) {
                    if (rectCollide(myDino, hearts[i])) {
                        myScore += HEART_BONUS;
                        if (isHost) hearts.splice(i, 1);
                    }
                }
            }

            // Score increases only when alive AND not in respawn period
            if (myDino.alive) {
                // Medium score speed
                myScore += speed * 0.15;
            }
            document.getElementById('youScore').textContent = Math.floor(myScore);

            // Check target score
            if (myScore >= TARGET_SCORE || oppScore >= TARGET_SCORE) {
                gameOver = true;
                const isWinner = myScore > oppScore;
                setTimeout(() => {
                    alert(isWinner ? '🏆 You reached 10000 first! You Win!' : '💙 Opponent reached 10000 first!');
                    window.location.href = 'lobby.html';
                }, 500);
            }
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // =====================================================
        // RENDER
        // =====================================================
        function render() {
            ctx.clearRect(0, 0, W, H);

            // Sky
            const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(0.4, '#1a1a3e');
            grad.addColorStop(0.7, '#4a2d6b');
            grad.addColorStop(0.9, '#e8a87c');
            grad.addColorStop(1, '#f4c4a8');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // Ground
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.strokeStyle = '#e8a87c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();

            // Obstacles
            for (const o of obstacles) {
                if (o.type === 'cactus') {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                    ctx.fillRect(o.x - 5, o.y + 10, 7, 13);
                } else {
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.arc(o.x + o.w / 2, o.y + o.h, o.w / 2, Math.PI, 0);
                    ctx.fill();
                }
            }

            // Hearts
            for (const h of hearts) {
                ctx.font = '22px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('💗', h.x + 12, h.y + 12);
            }

            // Connection line
            if (myDino.alive && oppDino.alive) {
                ctx.strokeStyle = 'rgba(244,114,182,0.3)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(myDino.x + 20, myDino.y + 25);
                ctx.lineTo(oppDino.x + 20, oppDino.y + 25);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw my dino with blink effect if invincible
            const isInvincible = Date.now() < invincibleUntil;
            if (myDino.alive) {
                if (isInvincible && Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                drawDino(myDino, '#f472b6', '💕');
                ctx.globalAlpha = 1;
            }

            // Draw opponent
            if (oppDino.alive) {
                drawDino(oppDino, '#60a5fa', '💙');
            }
        }

        function drawDino(d, color, emoji) {
            ctx.fillStyle = color;
            ctx.fillRect(d.x, d.y, d.w, d.h);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(d.x + 10, d.y + 20, d.w - 20, d.h - 25);
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(d.x + d.w - 15, d.y + 14, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(d.x + d.w - 13, d.y + 15, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '15px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(emoji, d.x + d.w / 2, d.y + d.h / 2 + 5);
        }

        // =====================================================
        // CHAT
        // =====================================================
        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(50).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message, m.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg, isYou) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${msg}</span>`;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        // =====================================================
        // GAME LOOP
        // =====================================================
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
