<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dino Run 1vs1 💕 | UsBlog Games</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --blue: #74b9ff;
            --green: #4CAF50;
            --orange: #FF9800;
            --purple: #9c27b0;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --red: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1150px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255,107,157,0.5);
        }

        .scoreboard { display: flex; gap: 6px; flex-wrap: wrap; }

        .score-chip {
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
        }

        .score-chip.you { background: rgba(255,107,157,0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .score-chip.opponent { background: rgba(116,185,255,0.2); border: 1px solid #74b9ff; color: #74b9ff; }
        .score-chip.status { background: rgba(255,255,255,0.1); color: #fdcb6e; font-size: 10px; }
        .score-chip.target { background: rgba(253,203,110,0.2); border: 1px solid #fdcb6e; color: #fdcb6e; }

        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .player-frame {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.15);
            background: #0a0a1a;
        }

        .player-frame.my-frame { border-color: rgba(255, 107, 157, 0.5); }
        .player-frame.opp-frame { border-color: rgba(116, 185, 255, 0.5); }

        .frame-label {
            position: absolute;
            top: 5px;
            left: 5px;
            z-index: 5;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: bold;
            pointer-events: none;
            color: white;
        }

        .frame-label.my-label { background: rgba(255, 107, 157, 0.8); }
        .frame-label.opp-label { background: rgba(116, 185, 255, 0.8); }

        .frame-score {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 5;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
        }

        .frame-score.my-score { color: #ff6b9d; }
        .frame-score.opp-score { color: #74b9ff; }

        .left-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #ff4444;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            display: none;
            z-index: 10;
            text-align: center;
        }

        .left-overlay.show { display: block; }

        canvas { display: block; width: 100%; height: auto; }

        .info-bar {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .info-pill {
            font-size: 9px;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.06);
            padding: 3px 8px;
            border-radius: 8px;
        }

        .chat-section {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px;
        }

        .chat-header-mini {
            font-size: 10px;
            color: #ff6b9d;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .chat-messages {
            max-height: 60px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 5px;
            padding: 3px;
        }

        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 2px; }

        .chat-msg {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
        }

        .chat-msg .sender { font-weight: bold; }
        .chat-msg.mine .sender { color: #ff6b9d; }
        .chat-msg.theirs .sender { color: #74b9ff; }

        .chat-input-row {
            display: flex;
            gap: 5px;
        }

        .chat-input-row input {
            flex: 1;
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
            font-size: 11px;
        }

        .chat-input-row button {
            padding: 6px 14px;
            border-radius: 16px;
            border: none;
            background: #ff6b9d;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 10px;
        }

        @media (max-width: 800px) {
            .split-layout { grid-template-columns: 1fr; }
            .game-title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Dino Run</h1>
            <div class="scoreboard">
                <div class="score-chip you">💕 <span id="youName">You</span>: <span id="youScore">0</span></div>
                <div class="score-chip opponent">💙 <span id="oppName">Opp</span>: <span id="oppScore">0</span></div>
                <div class="score-chip target">🎯 Target: <span id="targetDisplay">100000</span></div>
                <div class="score-chip status" id="statusChip">Connecting...</div>
            </div>
        </div>

        <div class="split-layout">
            <div class="player-frame my-frame">
                <div class="frame-label my-label" id="myColorLabel">💕 YOU</div>
                <div class="frame-score my-score" id="myFrameScore">0</div>
                <canvas id="myCanvas" width="550" height="340"></canvas>
                <div class="left-overlay" id="myLeftOverlay"></div>
            </div>

            <div class="player-frame opp-frame">
                <div class="frame-label opp-label" id="oppColorLabel">💙 OPPONENT</div>
                <div class="frame-score opp-score" id="oppFrameScore">0</div>
                <canvas id="oppCanvas" width="550" height="340"></canvas>
                <div class="left-overlay" id="oppLeftOverlay"></div>
            </div>
        </div>

        <div class="info-bar">
            <div class="info-pill">⌨️ Space/Click/Tap</div>
            <div class="info-pill">💗 +1000 Points</div>
            <div class="info-pill">⚡ 2s Blink</div>
            <div class="info-pill">🐢 Slow Score</div>
        </div>

        <div class="chat-section">
            <div class="chat-header-mini">💬 Live Chat</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Type message..." maxlength="150">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const W = 550, H = 340;
        const GROUND_Y = 270;
        const GRAVITY = 0.7, JUMP_FORCE = -13;
        const BASE_SPEED = 4, MAX_SPEED = 8;
        const HEART_BONUS = 1000;
        const TARGET_SCORE = 100000;
        const INVINCIBLE_MS = 2000;
        const SCORE_RATE = 0.05; // SLOW score increase

        const myCanvas = document.getElementById('myCanvas');
        const myCtx = myCanvas.getContext('2d');
        const oppCanvas = document.getElementById('oppCanvas');
        const oppCtx = oppCanvas.getContext('2d');
        myCanvas.width = W; myCanvas.height = H;
        oppCanvas.width = W; oppCanvas.height = H;

        document.getElementById('targetDisplay').textContent = TARGET_SCORE;

        const colors = [
            { name: 'Pink', main: '#ff6b9d', light: '#f8bbd0' },
            { name: 'Blue', main: '#74b9ff', light: '#a8d8ff' },
            { name: 'Green', main: '#4CAF50', light: '#a5d6a7' },
            { name: 'Orange', main: '#FF9800', light: '#ffcc80' },
            { name: 'Purple', main: '#9c27b0', light: '#ce93d8' }
        ];

        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let isHost = false, gameStarted = false, gameOver = false;
        let myScore = 0, oppScore = 0;
        let myObstacles = [], myHearts = [];
        let mySpeed = BASE_SPEED, frameCount = 0;
        let myInvincibleUntil = 0, myDead = false;
        let oppLastSeen = Date.now();
        let myColor, oppColor;

        const myDino = { x: 70, y: GROUND_Y - 50, w: 40, h: 50, vy: 0, jumping: false, alive: true };
        const oppDino = { x: 70, y: GROUND_Y - 50, w: 40, h: 50, alive: true };

        function init() {
            const myIdx = Math.floor(Math.random() * colors.length);
            let oppIdx = Math.floor(Math.random() * colors.length);
            while (oppIdx === myIdx) oppIdx = Math.floor(Math.random() * colors.length);
            myColor = colors[myIdx];
            oppColor = colors[oppIdx];

            document.getElementById('myColorLabel').textContent = '💕 YOU - ' + myColor.name.toUpperCase();
            document.getElementById('myColorLabel').style.background = myColor.main;
            document.getElementById('oppColorLabel').textContent = '💙 ' + oppColor.name.toUpperCase();
            document.getElementById('oppColorLabel').style.background = oppColor.main;

            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || user.email.split('@')[0];
                    document.getElementById('youName').textContent = myName;
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                myPlayerId = user.uid;
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val(), 'matchmaking');
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val(), 'teams');
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data, col) {
            if (data.player1 === myPlayerId) {
                isHost = true;
                opponentId = data.player2 || null;
                opponentName = data.player2Name || 'Opponent';
            } else {
                opponentId = data.player1 || null;
                opponentName = data.player1Name || 'Opponent';
            }
            document.getElementById('oppName').textContent = opponentName;
            document.getElementById('oppColorLabel').textContent = '💙 ' + opponentName.toUpperCase();

            if (opponentId) startGame();
            else {
                document.getElementById('statusChip').textContent = '⏳ Waiting...';
                db.ref(col + '/' + roomId).on('value', s => {
                    const d = s.val();
                    if (d && d.player2) {
                        opponentId = d.player2;
                        opponentName = d.player2Name || 'Opponent';
                        document.getElementById('oppName').textContent = opponentName;
                        document.getElementById('oppColorLabel').textContent = '💙 ' + opponentName.toUpperCase();
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            oppLastSeen = Date.now();
            document.getElementById('statusChip').textContent = '🟢 LIVE';
            setupChat();
            setupSync();
            gameLoop();
        }

        function setupSync() {
            setInterval(() => {
                if (gameStarted && !gameOver) {
                    db.ref('gameRooms/' + roomId + '/players/' + myPlayerId).update({
                        y: myDino.y, jumping: myDino.jumping, alive: myDino.alive,
                        score: Math.floor(myScore), speed: mySpeed,
                        invincible: Date.now() < myInvincibleUntil,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            }, 40);

            db.ref('gameRooms/' + roomId + '/players/' + opponentId).on('value', s => {
                const d = s.val();
                if (d && d.lastSeen) {
                    oppLastSeen = Date.now();
                    oppDino.y = d.y || oppDino.y;
                    oppDino.alive = d.alive !== false;
                    oppScore = d.score || 0;
                    document.getElementById('oppScore').textContent = Math.floor(oppScore);
                    document.getElementById('oppFrameScore').textContent = Math.floor(oppScore);
                    document.getElementById('statusChip').textContent = '🟢 LIVE';
                    document.getElementById('myLeftOverlay').classList.remove('show');
                }
            });

            setInterval(() => {
                if (gameStarted && !gameOver && Date.now() - oppLastSeen > 8000) {
                    gameOver = true;
                    document.getElementById('statusChip').textContent = '💔 Left';
                    document.getElementById('myLeftOverlay').textContent = opponentName + ' left!';
                    document.getElementById('myLeftOverlay').classList.add('show');
                    let count = 5;
                    const interval = setInterval(() => {
                        count--;
                        if (count > 0) document.getElementById('myLeftOverlay').textContent = opponentName + ' left! ' + count;
                        else { clearInterval(interval); location.href = 'lobby.html'; }
                    }, 1000);
                }
            }, 3000);
        }

        function jump() {
            if (!gameStarted || gameOver || myDead) return;
            if (!myDino.jumping && myDino.alive) {
                myDino.vy = JUMP_FORCE;
                myDino.jumping = true;
            }
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
        });
        myCanvas.addEventListener('click', jump);
        myCanvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

        function update() {
            if (!gameStarted || gameOver) return;
            frameCount++;
            mySpeed = Math.min(MAX_SPEED, BASE_SPEED + frameCount * 0.0005);

            if (myDino.jumping) {
                myDino.vy += GRAVITY;
                myDino.y += myDino.vy;
                if (myDino.y >= GROUND_Y - myDino.h) {
                    myDino.y = GROUND_Y - myDino.h;
                    myDino.jumping = false;
                    myDino.vy = 0;
                }
            }

            if (frameCount % 100 === 0) {
                const type = Math.random() > 0.5 ? 'cactus' : 'rock';
                const w = type === 'cactus' ? 20 + Math.random() * 8 : 25 + Math.random() * 12;
                const h = type === 'cactus' ? 30 + Math.random() * 20 : 15 + Math.random() * 10;
                myObstacles.push({ x: W + 40, y: GROUND_Y - h, w, h, type });
            }
            if (frameCount % 200 === 0) {
                myHearts.push({ x: W + 40, y: Math.random() * 100 + 60, w: 22, h: 22 });
            }

            for (let i = myObstacles.length - 1; i >= 0; i--) {
                myObstacles[i].x -= mySpeed;
                if (myObstacles[i].x + myObstacles[i].w < 0) myObstacles.splice(i, 1);
            }
            for (let i = myHearts.length - 1; i >= 0; i--) {
                myHearts[i].x -= mySpeed * 0.85;
                if (myHearts[i].x < -30) myHearts.splice(i, 1);
            }

            const invincible = Date.now() < myInvincibleUntil;
            if (myDino.alive && !myDead && !invincible) {
                for (const o of myObstacles) {
                    if (rectHit(myDino, o)) {
                        myInvincibleUntil = Date.now() + INVINCIBLE_MS;
                        myDead = true;
                        setTimeout(() => { myDino.alive = true; myDead = false; myDino.y = GROUND_Y - 50; }, 500);
                        break;
                    }
                }
                for (let i = myHearts.length - 1; i >= 0; i--) {
                    if (rectHit(myDino, myHearts[i])) {
                        myScore += HEART_BONUS;
                        myHearts.splice(i, 1);
                    }
                }
            }

            // SLOW SCORE - increases very slowly
            if (myDino.alive && !myDead) {
                myScore += SCORE_RATE;
            }
            document.getElementById('youScore').textContent = Math.floor(myScore);
            document.getElementById('myFrameScore').textContent = Math.floor(myScore);

            // WIN CHECK
            if (myScore >= TARGET_SCORE || oppScore >= TARGET_SCORE) {
                gameOver = true;
                const winner = myScore >= TARGET_SCORE;
                alert(winner ? '🏆 YOU WIN! Reached 100000!' : '💙 OPPONENT WINS!');
                setTimeout(() => { location.href = 'lobby.html'; }, 1000);
            }
        }

        function rectHit(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function render() {
            myCtx.clearRect(0, 0, W, H);
            drawSky(myCtx);
            drawGround(myCtx);
            for (const o of myObstacles) drawObstacle(myCtx, o);
            for (const h of myHearts) {
                myCtx.font = '20px Arial';
                myCtx.textAlign = 'center';
                myCtx.fillText('💗', h.x + 11, h.y + 11);
            }
            if (myDino.alive) {
                if (Date.now() < myInvincibleUntil && Math.floor(Date.now() / 100) % 2 === 0) myCtx.globalAlpha = 0.3;
                drawDino(myCtx, myDino, myColor.main, '💕');
                myCtx.globalAlpha = 1;
            }

            oppCtx.clearRect(0, 0, W, H);
            drawSky(oppCtx);
            drawGround(oppCtx);
            if (oppDino.alive) {
                drawDino(oppCtx, oppDino, oppColor.main, '💙');
            }
        }

        function drawSky(c) {
            const g = c.createLinearGradient(0, 0, 0, GROUND_Y);
            g.addColorStop(0, '#0a0a1a');
            g.addColorStop(0.4, '#1a1a3e');
            g.addColorStop(0.7, '#4a2d6b');
            g.addColorStop(0.9, '#e8a87c');
            g.addColorStop(1, '#f4c4a8');
            c.fillStyle = g;
            c.fillRect(0, 0, W, GROUND_Y);
        }

        function drawGround(c) {
            c.fillStyle = '#2d3436';
            c.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            c.strokeStyle = '#e8a87c';
            c.lineWidth = 2;
            c.beginPath();
            c.moveTo(0, GROUND_Y);
            c.lineTo(W, GROUND_Y);
            c.stroke();
        }

        function drawObstacle(c, o) {
            if (o.type === 'cactus') {
                c.fillStyle = '#4CAF50';
                c.fillRect(o.x, o.y, o.w, o.h);
                c.fillRect(o.x - 4, o.y + 8, 6, 12);
            } else {
                c.fillStyle = '#795548';
                c.beginPath();
                c.arc(o.x + o.w / 2, o.y + o.h, o.w / 2, Math.PI, 0);
                c.fill();
            }
        }

        function drawDino(c, d, color, emoji) {
            c.fillStyle = color;
            c.fillRect(d.x, d.y, d.w, d.h);
            c.fillStyle = 'rgba(255,255,255,0.25)';
            c.fillRect(d.x + 9, d.y + 18, d.w - 18, d.h - 23);
            c.fillStyle = 'white';
            c.beginPath();
            c.arc(d.x + d.w - 14, d.y + 13, 5, 0, Math.PI * 2);
            c.fill();
            c.fillStyle = '#1a1a1a';
            c.beginPath();
            c.arc(d.x + d.w - 12, d.y + 14, 2.5, 0, Math.PI * 2);
            c.fill();
            c.font = '14px Arial';
            c.textAlign = 'center';
            c.fillText(emoji, d.x + d.w / 2, d.y + d.h / 2 + 5);
        }

        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(30).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message, m.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg, mine) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + (mine ? 'mine' : 'theirs');
            div.innerHTML = '<span class="sender">' + sender + ':</span> ' + msg;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
