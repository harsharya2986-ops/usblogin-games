<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Rock Paper Scissors ✂️ | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 750px;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title { font-size: 18px; font-weight: bold; color: #ff6b9d; }

        .scoreboard {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .score-card {
            border-radius: 12px;
            padding: 8px 18px;
            text-align: center;
            min-width: 80px;
            border: 2px solid;
        }

        .score-card.you { border-color: #ff6b9d; background: rgba(255,107,157,0.15); }
        .score-card.opp { border-color: #74b9ff; background: rgba(116,185,255,0.15); }
        .score-card.round { border-color: #fdcb6e; background: rgba(253,203,110,0.1); }

        .score-label { font-size: 9px; color: rgba(255,255,255,0.7); display: block; }
        .score-value { font-size: 24px; font-weight: 800; }
        .score-card.you .score-value { color: #ff6b9d; }
        .score-card.opp .score-value { color: #74b9ff; }
        .score-card.round .score-value { color: #fdcb6e; font-size: 16px; }

        .status-bar {
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
            background: rgba(255,255,255,0.1);
            color: #fdcb6e;
        }

        .timer-display {
            text-align: center;
            font-size: 40px;
            font-weight: 800;
            color: #fdcb6e;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(253,203,110,0.5);
        }

        .main-layout { display: flex; gap: 8px; }
        .game-area { flex: 1; min-width: 0; }

        .arena {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .arena-hands {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .hand-box { text-align: center; }
        .hand-label { font-size: 9px; color: rgba(255,255,255,0.6); margin-bottom: 3px; }

        .hand-emoji { font-size: 2.5rem; transition: all 0.3s; }

        .hand-emoji.hidden {
            opacity: 0.2;
            filter: blur(4px);
            transform: scale(0.8);
        }

        .hand-emoji.revealed {
            animation: reveal 0.4s ease;
        }

        @keyframes reveal {
            0% { transform: scale(0) rotate(-180deg); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .vs-text { font-size: 1.3rem; font-weight: bold; color: #ff6b9d; }

        .result-display {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 25px;
            margin-bottom: 8px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .choice-card {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-card:hover { border-color: #ff6b9d; transform: translateY(-2px); }
        .choice-card.selected { border-color: #ff6b9d; background: rgba(255,107,157,0.25); }
        .choice-card:disabled { opacity: 0.5; cursor: not-allowed; }

        .hand-emoji-small { font-size: 1.8rem; display: block; }
        .hand-name { font-size: 10px; color: white; font-weight: 600; }

        .chat-sidebar {
            width: 180px;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            max-height: 320px;
        }

        .chat-header {
            padding: 6px;
            background: rgba(255,107,157,0.15);
            text-align: center;
            color: #ff6b9d;
            font-weight: bold;
            font-size: 11px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 6px; min-height: 80px; max-height: 200px; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 2px; }

        .chat-message { margin-bottom: 4px; padding: 4px 7px; border-radius: 7px; font-size: 10px; }
        .chat-message.you { background: rgba(255,107,157,0.15); margin-left: 8px; }
        .chat-message.opponent { background: rgba(116,185,255,0.15); margin-right: 8px; }
        .chat-message .sender { font-weight: bold; font-size: 8px; display: block; }

        .chat-input-area { display: flex; gap: 3px; padding: 5px; }
        .chat-input-area input { flex: 1; padding: 5px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 10px; }
        .chat-input-area button { padding: 5px 10px; border-radius: 12px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; font-size: 9px; }

        @media (max-width: 650px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; max-height: 100px; }
            .chat-messages { max-height: 40px; min-height: 25px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">✂️ RPS 25 Rounds</h1>
        </div>

        <div class="scoreboard">
            <div class="score-card you">
                <span class="score-label">💕 YOU</span>
                <span class="score-value" id="youScore">0</span>
            </div>
            <div class="score-card round">
                <span class="score-label">ROUND</span>
                <span class="score-value" id="roundNum">1/25</span>
            </div>
            <div class="score-card opp">
                <span class="score-label">💙 OPP</span>
                <span class="score-value" id="oppScore">0</span>
            </div>
        </div>

        <div class="status-bar" id="statusBar">🎮 CHOOSE YOUR MOVE</div>
        <div class="timer-display" id="timerDisplay">5</div>

        <div class="main-layout">
            <div class="game-area">
                <div class="arena">
                    <div class="arena-hands">
                        <div class="hand-box">
                            <div class="hand-label">YOU</div>
                            <div class="hand-emoji" id="myHand">❓</div>
                        </div>
                        <div class="vs-text">VS</div>
                        <div class="hand-box">
                            <div class="hand-label">OPPONENT</div>
                            <div class="hand-emoji hidden" id="oppHand">❓</div>
                        </div>
                    </div>
                </div>

                <div class="result-display" id="resultDisplay"></div>

                <div class="choices-grid">
                    <div class="choice-card" id="rockBtn" onclick="makeChoice('rock')">
                        <span class="hand-emoji-small">✊</span>
                        <span class="hand-name">Rock</span>
                    </div>
                    <div class="choice-card" id="paperBtn" onclick="makeChoice('paper')">
                        <span class="hand-emoji-small">✋</span>
                        <span class="hand-name">Paper</span>
                    </div>
                    <div class="choice-card" id="scissorsBtn" onclick="makeChoice('scissors')">
                        <span class="hand-emoji-small">✌️</span>
                        <span class="hand-name">Scissors</span>
                    </div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const TOTAL_ROUNDS = 25;
        const ROUND_TIME = 5;
        const RESULT_TIME = 3;
        const HANDS = { rock: '✊', paper: '✋', scissors: '✌️' };

        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let myScore = 0, oppScore = 0;
        let currentRound = 1;
        let myChoice = null, oppChoice = null;
        let timerInterval = null;
        let timeLeft = ROUND_TIME;
        let phase = 'choosing';
        let gameOver = false;

        function init() {
            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                myPlayerId = user.uid;
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || 'Player';
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val());
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val());
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data) {
            opponentId = data.player1 === myPlayerId ? data.player2 : data.player1;
            opponentName = data.player1 === myPlayerId ? (data.player2Name || 'Opponent') : (data.player1Name || 'Opponent');

            if (opponentId) startGame();
            else {
                db.ref('matchmaking/' + roomId + '/player2').on('value', s => {
                    if (s.val()) { opponentId = s.val(); startGame(); }
                });
            }
        }

        function startGame() {
            setupChat();
            setupListeners();
            startChoosingPhase();
        }

        function startChoosingPhase() {
            phase = 'choosing';
            myChoice = null;
            oppChoice = null;
            
            document.getElementById('statusBar').textContent = '🎮 CHOOSE YOUR MOVE';
            document.getElementById('resultDisplay').textContent = '';
            document.getElementById('myHand').textContent = '❓';
            document.getElementById('myHand').classList.remove('hidden', 'revealed');
            document.getElementById('oppHand').textContent = '❓';
            document.getElementById('oppHand').classList.add('hidden');
            document.getElementById('oppHand').classList.remove('revealed');
            
            document.querySelectorAll('.choice-card').forEach(c => {
                c.disabled = false;
                c.classList.remove('selected');
            });

            timeLeft = ROUND_TIME;
            document.getElementById('timerDisplay').textContent = timeLeft;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').textContent = timeLeft;
                
                if (timeLeft <= 0 && phase === 'choosing') {
                    if (!myChoice) {
                        const auto = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
                        makeChoice(auto, true);
                    }
                }
            }, 1000);
        }

        function setupListeners() {
            db.ref('gameRooms/' + roomId + '/rpsChoices').on('value', s => {
                const data = s.val();
                // ONLY check opponent choice when in choosing phase
                if (data && data[opponentId] && !oppChoice && phase === 'choosing') {
                    oppChoice = data[opponentId];
                    // DON'T show opponent hand yet - keep hidden
                    checkResult();
                }
            });

            db.ref('gameRooms/' + roomId + '/rpsScores').on('value', s => {
                const scores = s.val();
                if (scores) {
                    myScore = scores[myPlayerId] || 0;
                    oppScore = scores[opponentId] || 0;
                    document.getElementById('youScore').textContent = myScore;
                    document.getElementById('oppScore').textContent = oppScore;
                }
            });
        }

        function makeChoice(choice, isAuto = false) {
            if (phase !== 'choosing' || myChoice || gameOver) return;

            myChoice = choice;
            document.getElementById('myHand').textContent = HANDS[choice];
            document.getElementById('myHand').classList.remove('hidden');

            document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(choice + 'Btn').classList.add('selected');
            document.querySelectorAll('.choice-card').forEach(c => c.disabled = true);

            db.ref('gameRooms/' + roomId + '/rpsChoices/' + myPlayerId).set(choice);
            checkResult();
        }

        function checkResult() {
            // Only proceed if BOTH have chosen
            if (!myChoice || !oppChoice || phase !== 'choosing') return;

            clearInterval(timerInterval);
            phase = 'result';

            // NOW reveal opponent's hand
            document.getElementById('oppHand').textContent = HANDS[oppChoice];
            document.getElementById('oppHand').classList.remove('hidden');
            document.getElementById('oppHand').classList.add('revealed');
            document.getElementById('myHand').classList.add('revealed');

            const result = determineWinner(myChoice, oppChoice);
            const display = document.getElementById('resultDisplay');
            const status = document.getElementById('statusBar');

            if (result === 'win') {
                myScore++;
                display.textContent = '🎉 YOU WIN!';
                display.style.color = '#4CAF50';
                status.textContent = '🏆 ROUND WON';
            } else if (result === 'lose') {
                oppScore++;
                display.textContent = '💙 OPPONENT WINS!';
                display.style.color = '#ff4444';
                status.textContent = '💔 ROUND LOST';
            } else {
                display.textContent = '🤝 TIE!';
                display.style.color = '#fdcb6e';
                status.textContent = '🤝 TIE ROUND';
            }

            document.getElementById('youScore').textContent = myScore;
            document.getElementById('oppScore').textContent = oppScore;

            db.ref('gameRooms/' + roomId + '/rpsScores').set({
                [myPlayerId]: myScore,
                [opponentId]: oppScore
            });

            if (currentRound >= TOTAL_ROUNDS) {
                gameOver = true;
                setTimeout(() => {
                    const msg = myScore > oppScore ? '🏆 YOU WIN THE GAME!' : myScore < oppScore ? '💙 OPPONENT WINS!' : '🤝 TIE GAME!';
                    alert(msg);
                    location.href = 'lobby.html';
                }, RESULT_TIME * 1000);
                return;
            }

            setTimeout(() => {
                currentRound++;
                document.getElementById('roundNum').textContent = currentRound + '/25';
                db.ref('gameRooms/' + roomId + '/rpsChoices').remove();
                startChoosingPhase();
            }, RESULT_TIME * 1000);
        }

        function determineWinner(my, opp) {
            if (my === opp) return 'tie';
            if ((my === 'rock' && opp === 'scissors') ||
                (my === 'paper' && opp === 'rock') ||
                (my === 'scissors' && opp === 'paper')) return 'win';
            return 'lose';
        }

        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(50).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message, m.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg, isYou) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message ' + (isYou ? 'you' : 'opponent');
            div.innerHTML = '<span class="sender">' + sender + '</span>' + msg;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
