<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dino Run 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 30%, #9d174d 60%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 1.5rem;
            padding: 1rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .game-title {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9a8d4, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scoreboard {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .score-chip {
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .score-chip.you { background: rgba(255, 107, 157, 0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .score-chip.opponent { background: rgba(116, 185, 255, 0.2); border: 1px solid #74b9ff; color: #74b9ff; }
        .score-chip.status { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: #fdcb6e; font-size: 10px; }

        .main-layout { display: flex; gap: 10px; align-items: flex-start; }
        .game-area { flex: 1; min-width: 0; }

        .canvas-wrap {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            background: #0a0a1a;
            touch-action: manipulation;
        }

        canvas { display: block; width: 100%; height: auto; }

        .info-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; justify-content: center; }
        .info-pill { font-size: 10px; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 12px; }

        .chat-sidebar {
            width: 230px;
            min-width: 230px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 450px;
        }

        .chat-header {
            padding: 8px;
            background: rgba(255, 107, 157, 0.15);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 12px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 120px; max-height: 280px; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message { margin-bottom: 6px; padding: 5px 8px; border-radius: 8px; font-size: 11px; }
        .chat-message.you { background: rgba(255, 107, 157, 0.15); margin-left: 12px; }
        .chat-message.opponent { background: rgba(116, 185, 255, 0.15); margin-right: 12px; }
        .chat-message .sender { font-weight: bold; font-size: 9px; display: block; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }

        .chat-input-area { display: flex; gap: 4px; padding: 6px; }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 11px; }
        .chat-input-area button { padding: 6px 10px; border-radius: 14px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; font-size: 10px; }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 8px; max-height: 180px; }
            .chat-messages { max-height: 100px; min-height: 60px; }
            .game-title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Dino Run</h1>
            <div class="scoreboard">
                <div class="score-chip you" id="youChip">💕 You: 0</div>
                <div class="score-chip opponent" id="opponentChip">💙 Opponent: 0</div>
                <div class="score-chip status" id="statusChip">⏳ Connecting...</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="canvas-wrap" id="canvasWrap">
                    <canvas id="gameCanvas" width="850" height="400"></canvas>
                </div>
                <div class="info-bar">
                    <div class="info-pill">⌨️ Space / Click / Tap to Jump</div>
                    <div class="info-pill">💗 Hearts +100</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Game Constants
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 850, H = 400;
        canvas.width = W; canvas.height = H;
        const GROUND_Y = 320, GRAVITY = 0.65, JUMP_FORCE = -12.5;
        const BASE_SPEED = 5.5, MAX_SPEED = 12, HEART_BONUS = 100;

        // State
        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let isHost = false, gameStarted = false;
        let myScore = 0, opponentScore = 0;
        let obstacles = [], hearts = [], speed = BASE_SPEED, frameCount = 0;
        let myDino = { x: 110, y: GROUND_Y - 50, w: 42, h: 50, vy: 0, jumping: false, alive: true, leg: 0 };
        let opponentDino = { x: 620, y: GROUND_Y - 50, w: 42, h: 50, vy: 0, jumping: false, alive: true, leg: 0 };
        let syncInterval = null, obstacleInterval = null, heartInterval = null;

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) { location.href = 'login.html'; return; }
                db.ref('users/' + user.uid).once('value').then(snap => {
                    myName = snap.val()?.username || user.email.split('@')[0];
                    document.getElementById('youChip').textContent = `💕 ${myName}: 0`;
                });
                const params = new URLSearchParams(location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(snap => {
                if (snap.exists()) setupFromRoom(snap.val(), 'matchmaking');
                else {
                    db.ref('teams/' + roomId).once('value').then(teamSnap => {
                        if (teamSnap.exists()) setupFromRoom(teamSnap.val(), 'teams');
                        else { alert('Room not found!'); location.href = 'lobby.html'; }
                    });
                }
            });
        }

        function setupFromRoom(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true;
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }
            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;

            if (opponentId) startGame();
            else {
                document.getElementById('statusChip').textContent = '⏳ Waiting for opponent...';
                db.ref(collection + '/' + roomId).on('value', snap => {
                    const d = snap.val();
                    if (d && d.player2) {
                        opponentId = d.player2;
                        opponentName = d.player2Name || 'Opponent';
                        document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            document.getElementById('statusChip').textContent = '🟢 Playing';
            setupChat();

            if (isHost) {
                obstacleInterval = setInterval(spawnObstacle, 1800);
                heartInterval = setInterval(spawnHeart, 2500);
                syncInterval = setInterval(() => {
                    if (gameStarted) {
                        db.ref('gameRooms/' + roomId + '/state').set({
                            obstacles: obstacles, hearts: hearts, speed: speed,
                            hostScore: Math.floor(myScore)
                        });
                    }
                }, 100);
            } else {
                db.ref('gameRooms/' + roomId + '/state').on('value', snap => {
                    const d = snap.val();
                    if (d) {
                        obstacles = d.obstacles || [];
                        hearts = d.hearts || [];
                        speed = d.speed || BASE_SPEED;
                        opponentScore = d.hostScore || 0;
                        document.getElementById('opponentChip').textContent = `💙 ${opponentName}: ${Math.floor(opponentScore)}`;
                    }
                });
            }

            // Player position sync
            syncInterval = setInterval(() => {
                if (gameStarted) {
                    db.ref('gameRooms/' + roomId + '/players/' + myPlayerId).set({
                        y: myDino.y, jumping: myDino.jumping, alive: myDino.alive,
                        score: Math.floor(myScore)
                    });
                }
            }, 50);

            // Opponent position listener
            db.ref('gameRooms/' + roomId + '/players/' + opponentId).on('value', snap => {
                const d = snap.val();
                if (d) {
                    opponentDino.y = d.y ?? opponentDino.y;
                    opponentDino.jumping = d.jumping ?? false;
                    opponentDino.alive = d.alive !== false;
                    if (!isHost) {
                        myScore = d.score || 0;
                        document.getElementById('youChip').textContent = `💕 ${myName}: ${Math.floor(myScore)}`;
                    }
                } else {
                    document.getElementById('statusChip').textContent = '⚠️ Opponent left';
                }
            });

            // Opponent disconnect listener
            db.ref('gameRooms/' + roomId + '/players/' + opponentId).on('value', snap => {
                if (!snap.exists()) {
                    document.getElementById('statusChip').textContent = '💔 Opponent disconnected';
                }
            });

            gameLoop();
        }

        function spawnObstacle() {
            const type = Math.random() > 0.55 ? 'cactus' : 'rock';
            const w = type === 'cactus' ? 22 + Math.random() * 10 : 28 + Math.random() * 14;
            const h = type === 'cactus' ? 38 + Math.random() * 25 : 18 + Math.random() * 14;
            obstacles.push({ x: W + 40, y: GROUND_Y - h, w, h, type });
        }

        function spawnHeart() {
            hearts.push({ x: W + 40, y: Math.random() * 130 + 70, w: 24, h: 24 });
        }

        function jump() {
            if (!gameStarted || !myDino.alive) return;
            if (!myDino.jumping) {
                myDino.vy = JUMP_FORCE;
                myDino.jumping = true;
            }
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
        });
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

        function update() {
            if (!gameStarted) return;
            frameCount++;
            if (isHost) speed = Math.min(MAX_SPEED, BASE_SPEED + frameCount * 0.0015);

            // My dino physics
            if (myDino.jumping) {
                myDino.vy += GRAVITY;
                myDino.y += myDino.vy;
                if (myDino.y >= GROUND_Y - myDino.h) {
                    myDino.y = GROUND_Y - myDino.h;
                    myDino.jumping = false;
                    myDino.vy = 0;
                }
            }
            if (frameCount % 8 === 0) {
                myDino.leg = (myDino.leg + 1) % 2;
                opponentDino.leg = (opponentDino.leg + 1) % 2;
            }

            // Move obstacles (host only)
            if (isHost) {
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= speed;
                    if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
                }
                for (let i = hearts.length - 1; i >= 0; i--) {
                    hearts[i].x -= speed * 0.85;
                    if (hearts[i].x < -30) hearts.splice(i, 1);
                }
            }

            // Collisions
            if (myDino.alive) {
                for (const obs of obstacles) {
                    if (rectCollide(myDino, obs)) {
                        myDino.alive = false;
                        setTimeout(() => { myDino.alive = true; myDino.y = GROUND_Y - 50; }, 2000);
                        break;
                    }
                }
                for (let i = hearts.length - 1; i >= 0; i--) {
                    if (rectCollide(myDino, hearts[i])) {
                        myScore += HEART_BONUS;
                        if (isHost) hearts.splice(i, 1);
                    }
                }
            }

            if (myDino.alive) myScore += speed * 0.1;
            document.getElementById('youChip').textContent = `💕 ${myName}: ${Math.floor(myScore)}`;
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Sky
            const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            sky.addColorStop(0, '#0a0a1a');
            sky.addColorStop(0.4, '#1a1a3e');
            sky.addColorStop(0.7, '#4a2d6b');
            sky.addColorStop(0.9, '#e8a87c');
            sky.addColorStop(1, '#f4c4a8');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let i = 0; i < 25; i++) {
                ctx.beginPath();
                ctx.arc((i * 35 + frameCount * 0.1) % W, (i * 27) % 150, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Ground
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.strokeStyle = '#e8a87c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();

            // Obstacles
            for (const obs of obstacles) {
                if (obs.type === 'cactus') {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillRect(obs.x - 5, obs.y + 10, 7, 14);
                    ctx.fillRect(obs.x + obs.w - 2, obs.y + 14, 7, 12);
                } else {
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w / 2, obs.y + obs.h, obs.w / 2, Math.PI, 0);
                    ctx.fill();
                }
            }

            // Hearts
            for (const h of hearts) {
                ctx.font = '22px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('💗', h.x + 12, h.y + 12);
            }

            // Connection line
            if (myDino.alive && opponentDino.alive) {
                ctx.save();
                ctx.strokeStyle = 'rgba(244,114,182,0.2)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(myDino.x + myDino.w / 2, myDino.y + myDino.h / 2);
                ctx.lineTo(opponentDino.x + opponentDino.w / 2, opponentDino.y + opponentDino.h / 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            // Dinos
            if (myDino.alive) drawDino(myDino, '#f472b6', '💕');
            if (opponentDino.alive) drawDino(opponentDino, '#60a5fa', '💙');
        }

        function drawDino(d, color, emoji) {
            ctx.fillStyle = color;
            ctx.fillRect(d.x, d.y, d.w, d.h);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(d.x + 10, d.y + 20, d.w - 20, d.h - 25);
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(d.x + d.w - 15, d.y + 14, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(d.x + d.w - 13, d.y + 15, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = color;
            const lo = d.leg === 0 ? 0 : 6;
            ctx.fillRect(d.x + 10, d.y + d.h - 4, 10, 18 + lo);
            ctx.fillRect(d.x + d.w - 20, d.y + d.h - 4, 10, 18 - lo);
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(emoji, d.x + d.w / 2, d.y + d.h / 2 + 6);
        }

        // Chat
        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(50).on('child_added', snap => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMessage(sender, msg, isYou) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${msg}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
