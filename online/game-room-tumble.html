<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Tic Tac Tumble 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --lavender: #a29bfe;
            --gold: #ffd700;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b69 40%, #4a2d6b 70%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            color: #ff6b9d;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 157, 0.3);
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
        }

        .players-info { display: flex; gap: 8px; flex-wrap: wrap; }
        .player-chip { padding: 6px 14px; border-radius: 15px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .player-chip.you { background: rgba(255, 107, 157, 0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .player-chip.opponent { background: rgba(162, 155, 254, 0.2); border: 1px solid #a29bfe; color: #a29bfe; }

        .main-layout { display: flex; gap: 15px; align-items: flex-start; }
        .game-area { flex: 1; min-width: 0; }

        .turn-indicator {
            text-align: center;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .turn-indicator.your-turn { background: rgba(255, 107, 157, 0.2); color: #ff6b9d; border: 1px solid #ff6b9d; }
        .turn-indicator.opponent-turn { background: rgba(162, 155, 254, 0.2); color: #a29bfe; border: 1px solid #a29bfe; }

        .board-wrap {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1.25rem;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.12);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            aspect-ratio: 1;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 107, 157, 0.5);
            transform: scale(1.05);
        }

        .cell.pink { animation: popIn 0.4s ease; text-shadow: 0 0 25px rgba(255, 107, 157, 0.9); }
        .cell.lavender { animation: popIn 0.4s ease; text-shadow: 0 0 25px rgba(162, 155, 254, 0.9); }
        .cell.win { animation: winPulse 0.7s ease infinite; border-color: #ffd700; box-shadow: 0 0 35px rgba(255, 215, 0, 0.9); }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.25) rotate(10deg); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes winPulse {
            0%, 100% { border-color: #ffd700; box-shadow: 0 0 35px rgba(255, 215, 0, 0.9); }
            50% { border-color: #fff; box-shadow: 0 0 55px rgba(255, 255, 255, 1); }
        }

        .info-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; justify-content: center; }
        .info-pill { font-size: 11px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 15px; }

        .chat-sidebar {
            width: 240px;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 480px;
        }

        .chat-header {
            padding: 10px;
            background: rgba(255, 107, 157, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 13px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 150px; max-height: 300px; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message { margin-bottom: 8px; padding: 6px 10px; border-radius: 10px; font-size: 11px; }
        .chat-message.you { background: rgba(255, 107, 157, 0.15); border: 1px solid rgba(255, 107, 157, 0.3); margin-left: 15px; }
        .chat-message.opponent { background: rgba(162, 155, 254, 0.15); border: 1px solid rgba(162, 155, 254, 0.3); margin-right: 15px; }
        .chat-message .sender { font-weight: bold; font-size: 9px; display: block; margin-bottom: 2px; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #a29bfe; }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); }

        .chat-input-area { display: flex; gap: 5px; padding: 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 11px; }
        .chat-input-area button { padding: 6px 12px; border-radius: 15px; border: none; background: linear-gradient(135deg, #ff6b9d, #e84393); color: white; font-weight: bold; cursor: pointer; font-size: 11px; }

        .win-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }

        .win-content {
            text-align: center;
            background: rgba(26,26,46,0.95);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 2px solid #ff6b9d;
        }

        .win-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
        .win-title { font-size: 1.5rem; font-weight: bold; color: #ff6b9d; margin-bottom: 0.5rem; }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 10px; max-height: 200px; }
            .chat-messages { max-height: 100px; min-height: 80px; }
            .game-title { font-size: 16px; }
            .cell { font-size: 2.2rem; }
        }

        @media (max-width: 400px) {
            .cell { font-size: 1.8rem; border-radius: 0.6rem; }
            .board { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Online Tic Tac Tumble</h1>
            <div class="players-info">
                <div class="player-chip you" id="youChip">💕 You: 0</div>
                <div class="player-chip opponent" id="opponentChip">💍 Opponent: 0</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="turn-indicator" id="turnIndicator">Loading...</div>
                <div class="board-wrap">
                    <div class="board" id="board"></div>
                </div>
                <div class="info-bar">
                    <div class="info-pill">💕 You are Heart</div>
                    <div class="info-pill">💍 Opponent is Ring</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 11px; padding: 15px 0;">💕 Start chatting!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const WIN_PATTERNS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let isHost = false, gameStarted = false, mySymbol = 'pink', currentTurn = 'pink';
        let myScore = 0, opponentScore = 0;
        let board = Array(9).fill(null);
        let winningCells = [];
        let gameOver = false;
        let listenersAttached = false;

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) { window.location.href = 'login.html'; return; }
                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    myName = data ? data.username : user.email.split('@')[0];
                    document.getElementById('youChip').textContent = `💕 ${myName}: 0`;
                });
                const params = new URLSearchParams(window.location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;
                if (!roomId) { window.location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            database.ref('matchmaking/' + roomId).once('value').then((snapshot) => {
                if (snapshot.exists()) setupFromRoomData(snapshot.val(), 'matchmaking');
                else {
                    database.ref('teams/' + roomId).once('value').then((teamSnap) => {
                        if (teamSnap.exists()) setupFromRoomData(teamSnap.val(), 'teams');
                        else { alert('Room not found!'); window.location.href = 'lobby.html'; }
                    });
                }
            });
        }

        function setupFromRoomData(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true; mySymbol = 'pink';
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                isHost = false; mySymbol = 'lavender';
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }
            document.getElementById('opponentChip').textContent = `💍 ${opponentName}: 0`;
            if (opponentId) startGame();
            else {
                database.ref(collection + '/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.player2) {
                        opponentId = data.player2;
                        opponentName = data.player2Name || 'Opponent';
                        document.getElementById('opponentChip').textContent = `💍 ${opponentName}: 0`;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            renderBoard();
            updateTurnIndicator();

            if (!listenersAttached) {
                listenersAttached = true;
                database.ref('gameRooms/' + roomId + '/tttBoard').on('value', (snap) => {
                    const data = snap.val();
                    if (data && !isHost) { board = data; renderBoard(); }
                });
                database.ref('gameRooms/' + roomId + '/tttTurn').on('value', (snap) => {
                    const turn = snap.val();
                    if (turn) { currentTurn = turn; updateTurnIndicator(); }
                });
                database.ref('gameRooms/' + roomId + '/tttGameOver').on('value', (snap) => {
                    const data = snap.val();
                    if (data) { gameOver = true; winningCells = data.winningCells || []; renderBoard(); showWin(data.winner); }
                });
                setupChat();
            }

            if (isHost) {
                database.ref('gameRooms/' + roomId + '/tttBoard').set(board);
                database.ref('gameRooms/' + roomId + '/tttTurn').set('pink');
            }
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turnIndicator');
            if (gameOver) return;
            if (currentTurn === mySymbol) {
                indicator.textContent = '💕 Your Turn!';
                indicator.className = 'turn-indicator your-turn';
            } else {
                indicator.textContent = '💍 Opponent\'s Turn...';
                indicator.className = 'turn-indicator opponent-turn';
            }
        }

        function makeMove(index) {
            if (!gameStarted || gameOver) return;
            if (currentTurn !== mySymbol) return;
            if (board[index] !== null) return;

            board[index] = mySymbol;
            const winCells = checkWin(mySymbol);
            
            if (winCells) {
                gameOver = true;
                winningCells = winCells;
                database.ref('gameRooms/' + roomId + '/tttBoard').set(board);
                database.ref('gameRooms/' + roomId + '/tttGameOver').set({ winner: mySymbol, winningCells: winCells });
                renderBoard();
                showWin(mySymbol);
                return;
            }
            
            if (board.every(cell => cell !== null)) {
                gameOver = true;
                database.ref('gameRooms/' + roomId + '/tttBoard').set(board);
                database.ref('gameRooms/' + roomId + '/tttGameOver').set({ winner: 'tie', winningCells: [] });
                renderBoard();
                showWin('tie');
                return;
            }

            currentTurn = currentTurn === 'pink' ? 'lavender' : 'pink';
            database.ref('gameRooms/' + roomId + '/tttBoard').set(board);
            database.ref('gameRooms/' + roomId + '/tttTurn').set(currentTurn);
            renderBoard();
            updateTurnIndicator();
        }

        function checkWin(symbol) {
            for (const pattern of WIN_PATTERNS) {
                const [a, b, c] = pattern;
                if (board[a] === symbol && board[b] === symbol && board[c] === symbol) return pattern;
            }
            return null;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                if (board[i] === 'pink') { cell.textContent = '💕'; cell.classList.add('pink'); }
                else if (board[i] === 'lavender') { cell.textContent = '💍'; cell.classList.add('lavender'); }
                if (winningCells.includes(i)) cell.classList.add('win');
                cell.addEventListener('click', () => makeMove(i));
                boardEl.appendChild(cell);
            }
        }

        function showWin(winner) {
            const overlay = document.createElement('div');
            overlay.className = 'win-overlay';
            let emoji, title;
            if (winner === 'tie') { emoji = '🤝'; title = 'It\'s a Tie!'; }
            else if (winner === mySymbol) { emoji = '🎉'; title = 'You Win!'; }
            else { emoji = '💍'; title = 'Opponent Wins!'; }
            overlay.innerHTML = `
                <div class="win-content">
                    <div class="win-emoji">${emoji}</div>
                    <div class="win-title">${title}</div>
                    <button onclick="location.href='lobby.html'" style="padding: 10px 20px; border-radius: 20px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; margin-top: 1rem;">Back to Lobby</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function setupChat() {
            const chatRef = database.ref('gameRooms/' + roomId + '/chat');
            chatRef.off();
            chatRef.limitToLast(50).on('child_added', (snap) => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message && roomId) {
                database.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: message,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMessage(sender, message, isYou) {
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages.querySelector('div[style*="padding: 15px"]')) chatMessages.innerHTML = '';
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
