<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Tic Tac Toe 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title { font-size: 18px; font-weight: bold; color: #ff6b9d; }

        .players-info { display: flex; gap: 6px; flex-wrap: wrap; }
        .player-chip { padding: 5px 12px; border-radius: 14px; font-size: 11px; font-weight: 600; }
        .player-chip.you { background: rgba(255,107,157,0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .player-chip.opponent { background: rgba(116,185,255,0.2); border: 1px solid #74b9ff; color: #74b9ff; }
        .player-chip.status { background: rgba(255,255,255,0.1); color: #fdcb6e; font-size: 10px; }

        .main-layout { display: flex; gap: 10px; }
        .game-area { flex: 1; min-width: 0; }

        .turn-indicator {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .board-wrap {
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            padding: 8px;
        }

        .simple-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            aspect-ratio: 1;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .simple-cell {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            aspect-ratio: 1;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .simple-cell:hover { background: rgba(255,255,255,0.15); }
        .simple-cell.pink { color: #ff6b9d; text-shadow: 0 0 15px rgba(255,107,157,0.7); }
        .simple-cell.blue { color: #74b9ff; text-shadow: 0 0 15px rgba(116,185,255,0.7); }
        .simple-cell.win { border-color: #fdcb6e; background: rgba(253,203,110,0.2); }

        .chat-sidebar {
            width: 180px;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            overflow: hidden;
            max-height: 300px;
        }

        .chat-header {
            padding: 8px;
            background: rgba(255,107,157,0.2);
            text-align: center;
            color: #ff6b9d;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 100px; max-height: 200px; display: flex; flex-direction: column; gap: 4px; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 2px; }

        .chat-message { padding: 5px 8px; border-radius: 8px; font-size: 10px; max-width: 90%; }
        .chat-message.you { background: rgba(255,107,157,0.2); align-self: flex-end; }
        .chat-message.opponent { background: rgba(116,185,255,0.15); align-self: flex-start; }
        .chat-message .sender { font-weight: bold; font-size: 8px; display: block; }

        .chat-input-area { display: flex; gap: 4px; padding: 6px; }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 10px; }
        .chat-input-area button { padding: 6px 10px; border-radius: 14px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; font-size: 9px; }

        @media (max-width: 700px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; max-height: 100px; }
            .chat-messages { max-height: 40px; min-height: 25px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Tic Tac Toe</h1>
            <div class="players-info">
                <div class="player-chip you">💕 <span id="youName">You</span></div>
                <div class="player-chip opponent">💙 <span id="oppName">Opp</span></div>
                <div class="player-chip status" id="statusChip">Connecting...</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="turn-indicator" id="turnIndicator">Loading...</div>
                <div class="board-wrap">
                    <div class="simple-board" id="board"></div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let mySymbol = 'pink', currentTurn = 'pink';
        let board = Array(9).fill(null);
        let gameStarted = false, gameOver = false;

        window.makeMove = function(index) {
            if (!gameStarted || gameOver) return;
            if (currentTurn !== mySymbol) return;
            if (board[index] !== null) return;

            board[index] = mySymbol;
            
            const winPattern = checkWin(mySymbol);
            
            currentTurn = currentTurn === 'pink' ? 'blue' : 'pink';

            // Save to Firebase
            db.ref('gameRooms/' + roomId + '/tttBoard').set(board);
            db.ref('gameRooms/' + roomId + '/tttTurn').set(currentTurn);

            if (winPattern) {
                gameOver = true;
                db.ref('gameRooms/' + roomId + '/tttWinner').set(mySymbol);
                renderBoard();
                showWin(mySymbol, winPattern);
                return;
            }

            if (board.every(c => c !== null)) {
                gameOver = true;
                db.ref('gameRooms/' + roomId + '/tttWinner').set('tie');
                renderBoard();
                showWin('tie');
                return;
            }

            renderBoard();
            updateTurnIndicator();
        };

        function init() {
            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                myPlayerId = user.uid;
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || 'Player';
                    document.getElementById('youName').textContent = myName;
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val());
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val());
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data) {
            if (data.player1 === myPlayerId) {
                mySymbol = 'pink';
                opponentId = data.player2 || null;
                opponentName = data.player2Name || 'Opponent';
            } else {
                mySymbol = 'blue';
                opponentId = data.player1 || null;
                opponentName = data.player1Name || 'Opponent';
            }

            if (opponentId) {
                db.ref('users/' + opponentId).once('value').then(us => {
                    if (us.exists()) opponentName = us.val().username || opponentName;
                    document.getElementById('oppName').textContent = opponentName;
                });
                startGame();
            } else {
                document.getElementById('statusChip').textContent = '⏳ Waiting...';
                db.ref('matchmaking/' + roomId + '/player2').on('value', s => {
                    if (s.val()) {
                        opponentId = s.val();
                        db.ref('users/' + opponentId).once('value').then(us => {
                            if (us.exists()) opponentName = us.val().username || 'Opponent';
                            document.getElementById('oppName').textContent = opponentName;
                            startGame();
                        });
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            document.getElementById('statusChip').textContent = '🟢 LIVE';
            board = Array(9).fill(null);
            currentTurn = 'pink';
            
            renderBoard();
            updateTurnIndicator();
            setupChat();

            // Listen for board changes
            db.ref('gameRooms/' + roomId + '/tttBoard').on('value', snap => {
                const data = snap.val();
                if (data) {
                    board = data;
                    renderBoard();
                }
            });

            db.ref('gameRooms/' + roomId + '/tttTurn').on('value', snap => {
                const turn = snap.val();
                if (turn) {
                    currentTurn = turn;
                    updateTurnIndicator();
                }
            });

            db.ref('gameRooms/' + roomId + '/tttWinner').on('value', snap => {
                const winner = snap.val();
                if (winner && !gameOver) {
                    gameOver = true;
                    renderBoard();
                    const winPattern = winner === 'tie' ? null : findWinPattern(winner);
                    showWin(winner, winPattern);
                }
            });

            // Host initializes
            if (mySymbol === 'pink') {
                db.ref('gameRooms/' + roomId + '/tttBoard').set(board);
                db.ref('gameRooms/' + roomId + '/tttTurn').set('pink');
            }
        }

        function updateTurnIndicator() {
            const ind = document.getElementById('turnIndicator');
            if (gameOver) return;
            if (currentTurn === mySymbol) {
                ind.textContent = '💕 YOUR TURN - CLICK!';
                ind.style.color = '#ff6b9d';
                ind.style.border = '2px solid #ff6b9d';
            } else {
                ind.textContent = '💙 ' + opponentName + ' IS THINKING...';
                ind.style.color = '#74b9ff';
                ind.style.border = '2px solid #74b9ff';
            }
        }

        function checkWin(symbol) {
            const patterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (const p of patterns) {
                if (board[p[0]] === symbol && board[p[1]] === symbol && board[p[2]] === symbol) return p;
            }
            return null;
        }

        function findWinPattern(symbol) {
            const patterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (const p of patterns) {
                if (board[p[0]] === symbol && board[p[1]] === symbol && board[p[2]] === symbol) return p;
            }
            return null;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            if (!boardEl) return;
            boardEl.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'simple-cell';
                cell.setAttribute('onclick', 'makeMove(' + i + ')');
                
                if (board[i] === 'pink') {
                    cell.textContent = '💕';
                    cell.classList.add('pink');
                } else if (board[i] === 'blue') {
                    cell.textContent = '💙';
                    cell.classList.add('blue');
                }
                
                boardEl.appendChild(cell);
            }
        }

        function showWin(winner, winPattern) {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:100;';
            
            let emoji, title;
            if (winner === 'tie') {
                emoji = '🤝';
                title = 'IT\'S A TIE!';
            } else if (winner === mySymbol) {
                emoji = '🎉';
                title = 'YOU WIN!';
            } else {
                emoji = '💙';
                title = opponentName + ' WINS!';
            }
            
            overlay.innerHTML = `
                <div style="text-align:center;background:rgba(26,26,46,0.95);padding:2rem;border-radius:1rem;border:2px solid #ff6b9d;">
                    <div style="font-size:3rem;">${emoji}</div>
                    <div style="font-size:1.5rem;font-weight:bold;color:#ff6b9d;margin:10px 0;">${title}</div>
                    <button onclick="location.href='lobby.html'" style="padding:10px 20px;border:none;background:#ff6b9d;color:white;font-weight:bold;cursor:pointer;border-radius:20px;">Back to Lobby</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(50).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message, m.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg, isYou) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message ' + (isYou ? 'you' : 'opponent');
            div.innerHTML = '<span class="sender">' + sender + '</span>' + msg;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
