<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Super Tic Tac Toe 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4c1d95, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.95);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            font-size: 12px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b9d;
        }

        .players-info { display: flex; gap: 6px; flex-wrap: wrap; }
        .player-chip { padding: 5px 12px; border-radius: 14px; font-size: 11px; font-weight: 600; }
        .player-chip.you { background: rgba(255,107,157,0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .player-chip.opponent { background: rgba(116,185,255,0.2); border: 1px solid #74b9ff; color: #74b9ff; }
        .player-chip.status { background: rgba(255,255,255,0.1); color: #fdcb6e; font-size: 10px; }

        .main-layout { display: flex; gap: 10px; }
        .game-area { flex: 1; min-width: 0; }

        .turn-indicator {
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
        }
        .turn-indicator.your-turn { background: rgba(255,107,157,0.2); color: #ff6b9d; border: 1px solid #ff6b9d; }
        .turn-indicator.opponent-turn { background: rgba(116,185,255,0.2); color: #74b9ff; border: 1px solid #74b9ff; }

        .board-wrap {
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            padding: 8px;
        }

        .macro-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            aspect-ratio: 1;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .macro-cell {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 3px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .macro-cell.won-pink {
            background: rgba(255,107,157,0.2);
            border-color: #ff6b9d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .macro-cell.won-blue {
            background: rgba(116,185,255,0.2);
            border-color: #74b9ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .macro-overlay { font-size: 30px; }

        .mini-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .mini-cell {
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .mini-cell:hover { background: rgba(255,255,255,0.12); }
        .mini-cell.pink { color: #ff6b9d; text-shadow: 0 0 8px rgba(255,107,157,0.7); }
        .mini-cell.blue { color: #74b9ff; text-shadow: 0 0 8px rgba(116,185,255,0.7); }

        .chat-sidebar {
            width: 220px;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            max-height: 400px;
        }

        .chat-header {
            padding: 8px;
            background: rgba(255,107,157,0.15);
            text-align: center;
            color: #ff6b9d;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 120px; max-height: 250px; }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 2px; }

        .chat-message { margin-bottom: 5px; padding: 5px 8px; border-radius: 8px; font-size: 11px; }
        .chat-message.you { background: rgba(255,107,157,0.15); margin-left: 10px; }
        .chat-message.opponent { background: rgba(116,185,255,0.15); margin-right: 10px; }
        .chat-message .sender { font-weight: bold; font-size: 9px; display: block; }

        .chat-input-area { display: flex; gap: 4px; padding: 6px; }
        .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 11px; }
        .chat-input-area button { padding: 6px 12px; border-radius: 14px; border: none; background: #ff6b9d; color: white; font-weight: bold; cursor: pointer; font-size: 10px; }

        .win-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .win-content {
            text-align: center;
            background: rgba(26,26,46,0.95);
            padding: 2rem;
            border-radius: 1rem;
            border: 2px solid #ff6b9d;
        }
        .win-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
        .win-title { font-size: 1.5rem; font-weight: bold; color: #ff6b9d; margin-bottom: 0.5rem; }

        @media (max-width: 800px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; max-height: 150px; }
            .chat-messages { max-height: 70px; min-height: 40px; }
            .game-title { font-size: 14px; }
            .mini-cell { font-size: 11px; }
            .macro-overlay { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">💕 Super Tic Tac Toe</h1>
            <div class="players-info">
                <div class="player-chip you">💕 <span id="youName">You</span>: <span id="youScore">0</span></div>
                <div class="player-chip opponent">💙 <span id="oppName">Opp</span>: <span id="oppScore">0</span></div>
                <div class="player-chip status" id="statusChip">Connecting...</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="turn-indicator" id="turnIndicator">Loading...</div>
                <div class="board-wrap">
                    <div class="macro-board" id="macroBoard"></div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let roomId, myPlayerId, opponentId, myName = '', opponentName = '';
        let myColor = 'pink', currentTurn = 'pink';
        let gameStarted = false, gameOver = false;
        let macroBoard = Array(9).fill(null);
        let miniBoards = Array(9).fill(null).map(() => Array(9).fill(null));
        let oppLastSeen = Date.now();

        function init() {
            auth.onAuthStateChanged(user => {
                if (!user) { location.href = 'login.html'; return; }
                myPlayerId = user.uid;
                db.ref('users/' + user.uid).once('value').then(s => {
                    myName = s.val()?.username || 'Player';
                    document.getElementById('youName').textContent = myName;
                });
                const p = new URLSearchParams(location.search);
                roomId = p.get('match') || p.get('team');
                if (!roomId) { location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            db.ref('matchmaking/' + roomId).once('value').then(s => {
                if (s.exists()) setupPlayers(s.val());
                else db.ref('teams/' + roomId).once('value').then(ts => {
                    if (ts.exists()) setupPlayers(ts.val());
                    else { location.href = 'lobby.html'; }
                });
            });
        }

        function setupPlayers(data) {
            if (data.player1 === myPlayerId) {
                myColor = 'pink';
                opponentId = data.player2 || null;
                opponentName = data.player2Name || 'Opponent';
            } else {
                myColor = 'blue';
                opponentId = data.player1 || null;
                opponentName = data.player1Name || 'Opponent';
            }

            if (opponentId) {
                db.ref('users/' + opponentId).once('value').then(us => {
                    if (us.exists()) opponentName = us.val().username || opponentName;
                    document.getElementById('oppName').textContent = opponentName;
                });
                startGame();
            } else {
                document.getElementById('statusChip').textContent = '⏳ Waiting...';
                db.ref('matchmaking/' + roomId + '/player2').on('value', s => {
                    if (s.val()) {
                        opponentId = s.val();
                        db.ref('users/' + opponentId).once('value').then(us => {
                            if (us.exists()) opponentName = us.val().username || 'Opponent';
                            document.getElementById('oppName').textContent = opponentName;
                            startGame();
                        });
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;
            oppLastSeen = Date.now();
            document.getElementById('statusChip').textContent = '🟢 LIVE';
            
            // Initialize board
            macroBoard = Array(9).fill(null);
            miniBoards = Array(9).fill(null).map(() => Array(9).fill(null));
            currentTurn = 'pink';
            
            renderBoard();
            updateTurnIndicator();
            setupChat();

            // REAL-TIME LISTENERS - Always render on data change
            db.ref('gameRooms/' + roomId + '/sttMacro').on('value', snap => {
                const data = snap.val();
                if (data) {
                    macroBoard = data;
                    renderBoard();
                }
            });

            db.ref('gameRooms/' + roomId + '/sttMini').on('value', snap => {
                const data = snap.val();
                if (data) {
                    miniBoards = data;
                    renderBoard();
                }
            });

            db.ref('gameRooms/' + roomId + '/sttTurn').on('value', snap => {
                const turn = snap.val();
                if (turn) {
                    currentTurn = turn;
                    updateTurnIndicator();
                }
            });

            // Disconnect check
            setInterval(() => {
                if (gameStarted && !gameOver && Date.now() - oppLastSeen > 15000) {
                    gameOver = true;
                    document.getElementById('statusChip').textContent = '💔 Left';
                    alert(opponentName + ' has left!');
                    setTimeout(() => location.href = 'lobby.html', 1500);
                }
            }, 5000);
        }

        function updateTurnIndicator() {
            const ind = document.getElementById('turnIndicator');
            if (gameOver) return;
            if (currentTurn === myColor) {
                ind.textContent = '💕 YOUR TURN!';
                ind.className = 'turn-indicator your-turn';
            } else {
                ind.textContent = '💙 OPPONENT\'S TURN...';
                ind.className = 'turn-indicator opponent-turn';
            }
        }

        function checkMiniWin(idx) {
            const b = miniBoards[idx];
            const p = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (const [a,b2,c] of p) {
                if (b[a] && b[a] === b[b2] && b[a] === b[c]) return b[a];
            }
            return null;
        }

        function checkMacroWin() {
            const p = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (const [a,b,c] of p) {
                if (macroBoard[a] && macroBoard[a] === macroBoard[b] && macroBoard[a] === macroBoard[c] && macroBoard[a] !== 'tie') return macroBoard[a];
            }
            return null;
        }

        function isMiniFull(idx) {
            return miniBoards[idx].every(c => c !== null);
        }

        function makeMove(macroIdx, miniIdx) {
            if (!gameStarted || gameOver) return;
            if (currentTurn !== myColor) return;
            if (miniBoards[macroIdx][miniIdx] !== null) return;
            if (macroBoard[macroIdx] !== null) return;

            miniBoards[macroIdx][miniIdx] = myColor;
            
            const mw = checkMiniWin(macroIdx);
            if (mw) macroBoard[macroIdx] = mw;
            else if (isMiniFull(macroIdx)) macroBoard[macroIdx] = 'tie';

            const gw = checkMacroWin();
            if (gw) {
                gameOver = true;
                db.ref('gameRooms/' + roomId + '/sttMacro').set(macroBoard);
                db.ref('gameRooms/' + roomId + '/sttMini').set(miniBoards);
                renderBoard();
                showWin(gw);
                return;
            }

            currentTurn = currentTurn === 'pink' ? 'blue' : 'pink';
            
            // SYNC TO FIREBASE - This prevents black screen
            db.ref('gameRooms/' + roomId + '/sttMacro').set(macroBoard);
            db.ref('gameRooms/' + roomId + '/sttMini').set(miniBoards);
            db.ref('gameRooms/' + roomId + '/sttTurn').set(currentTurn);
            
            renderBoard();
            updateTurnIndicator();
        }

        function renderBoard() {
            const boardEl = document.getElementById('macroBoard');
            if (!boardEl) return;
            boardEl.innerHTML = '';

            for (let mi = 0; mi < 9; mi++) {
                const mc = document.createElement('div');
                mc.className = 'macro-cell';

                if (macroBoard[mi] === 'pink') {
                    mc.classList.add('won-pink');
                    mc.innerHTML = '<div class="macro-overlay">💕</div>';
                } else if (macroBoard[mi] === 'blue') {
                    mc.classList.add('won-blue');
                    mc.innerHTML = '<div class="macro-overlay">💙</div>';
                } else if (macroBoard[mi] === 'tie') {
                    mc.innerHTML = '<div class="macro-overlay">🤝</div>';
                    mc.style.opacity = '0.5';
                } else {
                    const mb = document.createElement('div');
                    mb.className = 'mini-board';
                    for (let si = 0; si < 9; si++) {
                        const sc = document.createElement('div');
                        sc.className = 'mini-cell';
                        sc.dataset.macro = mi;
                        sc.dataset.mini = si;
                        const val = miniBoards[mi][si];
                        if (val === 'pink') { sc.textContent = '💕'; sc.classList.add('pink'); }
                        else if (val === 'blue') { sc.textContent = '💙'; sc.classList.add('blue'); }
                        sc.addEventListener('click', () => makeMove(mi, si));
                        mb.appendChild(sc);
                    }
                    mc.appendChild(mb);
                }
                boardEl.appendChild(mc);
            }
        }

        function showWin(winner) {
            const overlay = document.createElement('div');
            overlay.className = 'win-overlay';
            const win = winner === myColor;
            overlay.innerHTML = `
                <div class="win-content">
                    <div class="win-emoji">${win ? '🎉' : '💙'}</div>
                    <div class="win-title">${win ? 'YOU WIN!' : 'OPPONENT WINS!'}</div>
                    <button onclick="location.href='lobby.html'" style="padding:8px 16px;border-radius:16px;border:none;background:#ff6b9d;color:white;font-weight:bold;cursor:pointer;margin-top:10px;">Back to Lobby</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function setupChat() {
            const ref = db.ref('gameRooms/' + roomId + '/chat');
            ref.off();
            ref.limitToLast(50).on('child_added', s => {
                const m = s.val();
                displayMsg(m.sender, m.message, m.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg && roomId) {
                db.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName, message: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMsg(sender, msg, isYou) {
            const c = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message ' + (isYou ? 'you' : 'opponent');
            div.innerHTML = '<span class="sender">' + sender + '</span>' + msg;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
