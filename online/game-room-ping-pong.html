<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Ping Pong 🏓 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --blue: #74b9ff;
            --gold: #fdcb6e;
            --dark: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 30%, #9d174d 60%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-shell {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 2rem;
            padding: 1.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 1100px;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .game-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9a8d4, #f472b6, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .players-info { display: flex; gap: 8px; flex-wrap: wrap; }
        .player-chip { padding: 6px 14px; border-radius: 18px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .player-chip.you { background: rgba(255, 107, 157, 0.2); border: 1px solid #ff6b9d; color: #ff6b9d; }
        .player-chip.opponent { background: rgba(116, 185, 255, 0.2); border: 1px solid #74b9ff; color: #74b9ff; }

        .main-layout { display: flex; gap: 15px; align-items: flex-start; }
        .game-area { flex: 1; min-width: 0; }

        .canvas-wrap {
            position: relative;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            background: #0a0a1a;
        }

        canvas { display: block; width: 100%; height: auto; }

        .info-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; justify-content: center; }
        .info-pill { font-size: 11px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 15px; }

        .chat-sidebar {
            width: 260px;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 500px;
        }

        .chat-header {
            padding: 12px 15px;
            background: rgba(255, 107, 157, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            color: #ff6b9d;
            font-size: 14px;
        }

        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; min-height: 150px; max-height: 300px; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.5); border-radius: 2px; }

        .chat-message { margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; font-size: 12px; }
        .chat-message.you { background: rgba(255, 107, 157, 0.15); border: 1px solid rgba(255, 107, 157, 0.3); margin-left: 20px; }
        .chat-message.opponent { background: rgba(116, 185, 255, 0.15); border: 1px solid rgba(116, 185, 255, 0.3); margin-right: 20px; }
        .chat-message .sender { font-weight: bold; font-size: 10px; display: block; margin-bottom: 3px; }
        .chat-message.you .sender { color: #ff6b9d; }
        .chat-message.opponent .sender { color: #74b9ff; }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); }

        .chat-input-area { display: flex; gap: 6px; padding: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-input-area input { flex: 1; padding: 8px 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 12px; }
        .chat-input-area button { padding: 8px 14px; border-radius: 18px; border: none; background: linear-gradient(135deg, #ff6b9d, #e84393); color: white; font-weight: bold; cursor: pointer; font-size: 12px; }

        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; margin-top: 15px; max-height: 250px; }
            .chat-messages { max-height: 150px; }
            .game-title { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-header">
            <a href="lobby.html" class="back-btn">← Lobby</a>
            <h1 class="game-title">🏓 Online Ping Pong</h1>
            <div class="players-info">
                <div class="player-chip you" id="youChip">💕 You: 0</div>
                <div class="player-chip opponent" id="opponentChip">💙 Opponent: 0</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="canvas-wrap" id="canvasWrap">
                    <canvas id="gameCanvas" width="800" height="500"></canvas>
                </div>
                <div class="info-bar">
                    <div class="info-pill">🖱️ Mouse / W-S to Move</div>
                    <div class="info-pill">🎯 First to 11 Wins</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; padding: 20px 0;">💕 Start chatting!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 800;
        const H = 500;
        canvas.width = W;
        canvas.height = H;

        let roomId = null;
        let myPlayerId = null;
        let opponentId = null;
        let myName = '';
        let opponentName = '';
        let isHost = false;
        let gameStarted = false;
        let myScore = 0;
        let opponentScore = 0;
        let myPaddleY = H / 2 - 60;
        let opponentPaddleY = H / 2 - 60;
        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 100;
        const PADDLE_SPEED = 10;

        let ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, radius: 10, speed: 6 };

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) { window.location.href = 'login.html'; return; }

                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    myName = data ? data.username : user.email.split('@')[0];
                    document.getElementById('youChip').textContent = `💕 ${myName}: 0`;
                });

                const params = new URLSearchParams(window.location.search);
                roomId = params.get('match') || params.get('team');
                myPlayerId = user.uid;

                if (!roomId) { window.location.href = 'lobby.html'; return; }
                setupRoom();
            });
        }

        function setupRoom() {
            database.ref('matchmaking/' + roomId).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    setupFromRoomData(snapshot.val(), 'matchmaking');
                } else {
                    database.ref('teams/' + roomId).once('value').then((teamSnap) => {
                        if (teamSnap.exists()) {
                            setupFromRoomData(teamSnap.val(), 'teams');
                        } else {
                            alert('Room not found!');
                            window.location.href = 'lobby.html';
                        }
                    });
                }
            });
        }

        function setupFromRoomData(roomData, collection) {
            if (roomData.player1 === myPlayerId) {
                isHost = true;
                opponentId = roomData.player2 || null;
                opponentName = roomData.player2Name || 'Opponent';
            } else {
                isHost = false;
                opponentId = roomData.player1 || null;
                opponentName = roomData.player1Name || 'Opponent';
            }

            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;

            if (opponentId) {
                startGame();
            } else {
                database.ref(collection + '/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.player2) {
                        opponentId = data.player2;
                        opponentName = data.player2Name || 'Opponent';
                        document.getElementById('opponentChip').textContent = `💙 ${opponentName}: 0`;
                        startGame();
                    }
                });
            }
        }

        function startGame() {
            gameStarted = true;

            if (isHost) {
                resetBall();
                // Host syncs ball
                setInterval(() => {
                    if (gameStarted) {
                        updateBall();
                        database.ref('gameRooms/' + roomId + '/ball').set({
                            x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy
                        });
                        database.ref('gameRooms/' + roomId + '/scores').set({
                            host: myScore, guest: opponentScore
                        });
                    }
                }, 16);
            } else {
                // Non-host listens
                database.ref('gameRooms/' + roomId + '/ball').on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        ball.x = data.x; ball.y = data.y;
                        ball.vx = data.vx; ball.vy = data.vy;
                    }
                });
                database.ref('gameRooms/' + roomId + '/scores').on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        myScore = data.guest || 0;
                        opponentScore = data.host || 0;
                        updateScoreDisplay();
                    }
                });
            }

            // Sync paddle positions
            setInterval(() => {
                if (gameStarted) {
                    database.ref('gameRooms/' + roomId + '/paddles/' + myPlayerId).set({ y: myPaddleY });
                }
            }, 30);

            database.ref('gameRooms/' + roomId + '/paddles/' + opponentId).on('value', (snap) => {
                const data = snap.val();
                if (data) opponentPaddleY = data.y;
            });

            setupChat();
            gameLoop();
        }

        function resetBall() {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.speed = 6;
            const angle = (Math.random() * 60 - 30) * Math.PI / 180;
            const dir = Math.random() > 0.5 ? 1 : -1;
            ball.vx = dir * ball.speed * Math.cos(angle);
            ball.vy = ball.speed * Math.sin(angle);
        }

        function updateBall() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= H) {
                ball.vy = -ball.vy;
            }

            // Host paddle (left)
            if (ball.vx < 0 && ball.x - ball.radius <= PADDLE_WIDTH + 20 && 
                ball.y >= myPaddleY && ball.y <= myPaddleY + PADDLE_HEIGHT) {
                const rel = (myPaddleY + PADDLE_HEIGHT / 2) - ball.y;
                const norm = rel / (PADDLE_HEIGHT / 2);
                const angle = norm * (Math.PI / 3);
                ball.speed = Math.min(15, ball.speed * 1.05);
                ball.vx = Math.abs(ball.speed * Math.cos(angle));
                ball.vy = -ball.speed * Math.sin(angle);
                ball.x = PADDLE_WIDTH + 20 + ball.radius;
            }

            // Guest paddle (right)
            if (ball.vx > 0 && ball.x + ball.radius >= W - PADDLE_WIDTH - 20 &&
                ball.y >= opponentPaddleY && ball.y <= opponentPaddleY + PADDLE_HEIGHT) {
                const rel = (opponentPaddleY + PADDLE_HEIGHT / 2) - ball.y;
                const norm = rel / (PADDLE_HEIGHT / 2);
                const angle = norm * (Math.PI / 3);
                ball.speed = Math.min(15, ball.speed * 1.05);
                ball.vx = -Math.abs(ball.speed * Math.cos(angle));
                ball.vy = -ball.speed * Math.sin(angle);
                ball.x = W - PADDLE_WIDTH - 20 - ball.radius;
            }

            // Scoring
            if (ball.x < -20) {
                opponentScore++;
                updateScoreDisplay();
                resetBall();
            }
            if (ball.x > W + 20) {
                myScore++;
                updateScoreDisplay();
                resetBall();
            }
        }

        function updateScoreDisplay() {
            document.getElementById('youChip').textContent = `💕 ${myName}: ${myScore}`;
            document.getElementById('opponentChip').textContent = `💙 ${opponentName}: ${opponentScore}`;
            if (myScore >= 11 || opponentScore >= 11) {
                alert(`🏆 ${myScore >= 11 ? myName : opponentName} wins!`);
                location.href = 'lobby.html';
            }
        }

        // Controls
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleY = H / rect.height;
            myPaddleY = (e.clientY - rect.top) * scaleY - PADDLE_HEIGHT / 2;
            clampPaddle();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
                myPaddleY -= PADDLE_SPEED;
                clampPaddle();
            }
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
                myPaddleY += PADDLE_SPEED;
                clampPaddle();
            }
        });

        function clampPaddle() {
            if (myPaddleY < 0) myPaddleY = 0;
            if (myPaddleY > H - PADDLE_HEIGHT) myPaddleY = H - PADDLE_HEIGHT;
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            
            const grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#0f3460');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(W / 2, 0);
            ctx.lineTo(W / 2, H);
            ctx.stroke();
            ctx.setLineDash([]);

            // My paddle
            ctx.fillStyle = '#ff6b9d';
            ctx.shadowColor = '#ff6b9d';
            ctx.shadowBlur = 15;
            ctx.fillRect(20, myPaddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.shadowBlur = 0;
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('💕', 26, myPaddleY + PADDLE_HEIGHT / 2 + 7);

            // Opponent paddle
            ctx.fillStyle = '#74b9ff';
            ctx.shadowColor = '#74b9ff';
            ctx.shadowBlur = 15;
            ctx.fillRect(W - PADDLE_WIDTH - 20, opponentPaddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.shadowBlur = 0;
            ctx.fillText('💙', W - 26, opponentPaddleY + PADDLE_HEIGHT / 2 + 7);

            // Ball
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function setupChat() {
            const chatRef = database.ref('gameRooms/' + roomId + '/chat');
            chatRef.off();
            chatRef.limitToLast(50).on('child_added', (snap) => {
                const msg = snap.val();
                displayMessage(msg.sender, msg.message, msg.sender === myName);
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message && roomId) {
                database.ref('gameRooms/' + roomId + '/chat').push({
                    sender: myName,
                    message: message,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function displayMessage(sender, message, isYou) {
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages.querySelector('div[style*="padding: 20px"]')) {
                chatMessages.innerHTML = '';
            }
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
