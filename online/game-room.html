<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dino Run 💕 | UsBlog Games</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-light: #f8bbd0;
            --pink-dark: #e84393;
            --blue: #74b9ff;
            --blue-light: #a8d8ff;
            --blue-dark: #4a90e2;
            --gold: #fdcb6e;
            --gold-light: #ffeaa7;
            --dark: #1a1a2e;
            --darker: #0a0a1a;
            --purple: #2d1b69;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --white: #ffffff;
            --green: #4CAF50;
            --red: #ff4444;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.15);
            --shadow-md: 0 8px 25px rgba(0,0,0,0.25);
            --shadow-lg: 0 25px 60px rgba(0,0,0,0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 30%, #9d174d 60%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Background Hearts Animation */
        .bg-hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart-particle {
            position: absolute;
            bottom: -40px;
            animation: floatHeartUp linear infinite;
            opacity: 0;
        }

        @keyframes floatHeartUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.15; }
            50% { opacity: 0.1; }
            90% { opacity: 0.08; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Main Game Shell */
        .game-shell {
            position: relative;
            z-index: 10;
            background: rgba(30, 27, 75, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 15px;
            box-shadow: var(--shadow-lg), 0 0 40px rgba(255, 107, 157, 0.15);
            width: 100%;
            max-width: 1150px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Header Section */
        .game-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            color: var(--white);
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: rgba(255, 107, 157, 0.2);
            border-color: var(--pink);
            transform: translateX(-3px);
        }

        .game-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9a8d4, #f472b6, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .score-chip {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }

        .score-chip.you {
            background: rgba(255, 107, 157, 0.2);
            border: 1px solid var(--pink);
            color: var(--pink);
        }

        .score-chip.opponent {
            background: rgba(116, 185, 255, 0.2);
            border: 1px solid var(--blue);
            color: var(--blue);
        }

        .score-chip.status {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--gold);
            font-size: 10px;
            animation: statusBlink 2s infinite;
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .game-area {
            flex: 1;
            min-width: 0;
        }

        /* Canvas */
        .canvas-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            background: var(--darker);
            touch-action: manipulation;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Game Over Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .overlay.show { display: flex; }

        .overlay-content {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .overlay-emoji { font-size: 4rem; margin-bottom: 10px; animation: bounce 1s infinite; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .overlay-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--pink);
            margin-bottom: 10px;
        }

        .overlay-score { font-size: 1.1rem; color: var(--gold); }

        /* Info Bar */
        .info-bar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .info-pill {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Chat Sidebar */
        .chat-sidebar {
            width: 230px;
            min-width: 230px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-height: 420px;
        }

        .chat-header {
            padding: 10px;
            background: rgba(255, 107, 157, 0.15);
            text-align: center;
            color: var(--pink);
            font-weight: bold;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 150px;
            max-height: 270px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 2px; }

        .chat-message {
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 11px;
            max-width: 85%;
            word-wrap: break-word;
            animation: msgSlideIn 0.3s ease;
        }

        @keyframes msgSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.you {
            background: rgba(255, 107, 157, 0.15);
            border: 1px solid rgba(255, 107, 157, 0.3);
            align-self: flex-end;
        }

        .chat-message.opponent {
            background: rgba(116, 185, 255, 0.15);
            border: 1px solid rgba(116, 185, 255, 0.3);
            align-self: flex-start;
        }

        .chat-message .sender {
            font-weight: bold;
            font-size: 9px;
            display: block;
            margin-bottom: 2px;
        }

        .chat-message.you .sender { color: var(--pink); }
        .chat-message.opponent .sender { color: var(--blue); }
        .chat-message .text { color: rgba(255, 255, 255, 0.9); }

        .chat-input-area {
            display: flex;
            gap: 5px;
            padding: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area input {
            flex: 1;
            padding: 7px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 11px;
            transition: var(--transition);
        }

        .chat-input-area input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.3);
        }

        .chat-input-area button {
            padding: 7px 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 10px;
            transition: var(--transition);
        }

        .chat-input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
        }

        /* Responsive */
        @media (max-width: 950px) {
            .main-layout { flex-direction: column; }
            .chat-sidebar { width: 100%; min-width: auto; max-height: 160px; }
            .chat-messages { max-height: 80px; min-height: 50px; }
            .game-title { font-size: 15px; }
            .score-chip { font-size: 9px; padding: 4px 10px; }
        }
    </style>
</head>
<body>
    <div class="bg-hearts-container" id="bgHeartsContainer"></div>

    <div class="game-shell">
        <div class="game-header">
            <div class="header-left">
                <a href="lobby.html" class="back-btn">← Lobby</a>
                <h1 class="game-title">💕 Online Dino Run</h1>
            </div>
            <div class="scoreboard">
                <div class="score-chip you">💕 <span id="youNameDisplay">You</span>: <span id="youScoreDisplay">0</span></div>
                <div class="score-chip opponent">💙 <span id="oppNameDisplay">Opp</span>: <span id="oppScoreDisplay">0</span></div>
                <div class="score-chip status" id="statusChip">🔗 Connecting...</div>
            </div>
        </div>

        <div class="main-layout">
            <div class="game-area">
                <div class="canvas-wrap" id="canvasWrap">
                    <canvas id="gameCanvas" width="850" height="400"></canvas>
                    <div class="overlay" id="gameOverOverlay">
                        <div class="overlay-content">
                            <div class="overlay-emoji" id="overlayEmoji">🏆</div>
                            <div class="overlay-title" id="overlayTitle">Game Over!</div>
                            <div class="overlay-score" id="overlayScore"></div>
                        </div>
                    </div>
                </div>
                <div class="info-bar">
                    <div class="info-pill">⌨️ Space/Click/Tap</div>
                    <div class="info-pill">💗 +100 Points</div>
                    <div class="info-pill">🌐 Real-Time 1vs1</div>
                    <div class="info-pill">⚡ Speed Increases</div>
                </div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">💬 Live Chat</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message..." maxlength="200">
                    <button onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        // =====================================================
        // SECTION 1: FIREBASE CONFIGURATION & INITIALIZATION
        // =====================================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const auth = firebase.auth();
        const database = firebase.database();

        // =====================================================
        // SECTION 2: GAME CONSTANTS & CONFIGURATION
        // =====================================================
        const CONFIG = {
            WIDTH: 850,
            HEIGHT: 400,
            GROUND_Y: 320,
            GRAVITY: 0.7,
            JUMP_FORCE: -13,
            BASE_SPEED: 6,
            MAX_SPEED: 14,
            HEART_BONUS: 100,
            WIN_SCORE: 5000,
            OBSTACLE_INTERVAL_MIN: 1200,
            OBSTACLE_INTERVAL_MAX: 2200,
            HEART_INTERVAL: 2200,
            SYNC_INTERVAL: 80,
            PLAYER_SYNC_INTERVAL: 40,
            RESPAWN_DELAY: 1500
        };

        // =====================================================
        // SECTION 3: DOM ELEMENTS
        // =====================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CONFIG.WIDTH;
        canvas.height = CONFIG.HEIGHT;

        const youNameDisplay = document.getElementById('youNameDisplay');
        const youScoreDisplay = document.getElementById('youScoreDisplay');
        const oppNameDisplay = document.getElementById('oppNameDisplay');
        const oppScoreDisplay = document.getElementById('oppScoreDisplay');
        const statusChip = document.getElementById('statusChip');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const overlayEmoji = document.getElementById('overlayEmoji');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayScore = document.getElementById('overlayScore');
        const bgHeartsContainer = document.getElementById('bgHeartsContainer');

        // =====================================================
        // SECTION 4: GAME STATE
        // =====================================================
        const state = {
            roomId: null,
            myPlayerId: null,
            opponentId: null,
            myName: '',
            opponentName: '',
            isHost: false,
            gameStarted: false,
            gameOver: false,
            myScore: 0,
            opponentScore: 0,
            speed: CONFIG.BASE_SPEED,
            frameCount: 0,
            distance: 0
        };

        // =====================================================
        // SECTION 5: GAME OBJECTS
        // =====================================================
        const myDino = {
            x: 100,
            y: CONFIG.GROUND_Y - 50,
            width: 42,
            height: 50,
            velocityY: 0,
            isJumping: false,
            isAlive: true,
            legFrame: 0,
            color: '#f472b6',
            emoji: '💕'
        };

        const oppDino = {
            x: 620,
            y: CONFIG.GROUND_Y - 50,
            width: 42,
            height: 50,
            velocityY: 0,
            isJumping: false,
            isAlive: true,
            legFrame: 0,
            color: '#60a5fa',
            emoji: '💙'
        };

        let obstacles = [];
        let hearts = [];
        let particles = [];
        let clouds = [];
        let stars = [];

        // =====================================================
        // SECTION 6: BACKGROUND CREATION
        // =====================================================
        function createStars() {
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * CONFIG.WIDTH,
                    y: Math.random() * 200,
                    size: Math.random() * 2 + 0.5,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function createClouds() {
            for (let i = 0; i < 6; i++) {
                clouds.push({
                    x: Math.random() * CONFIG.WIDTH,
                    y: Math.random() * 100 + 20,
                    width: Math.random() * 70 + 50,
                    speed: Math.random() * 0.3 + 0.1,
                    opacity: Math.random() * 0.2 + 0.1
                });
            }
        }

        function createBackgroundHearts() {
            const heartEmojis = ['💕', '💗', '💖', '💘', '💝'];
            for (let i = 0; i < 10; i++) {
                const span = document.createElement('span');
                span.className = 'bg-heart-particle';
                span.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                span.style.left = Math.random() * 100 + '%';
                span.style.fontSize = Math.random() * 18 + 12 + 'px';
                span.style.animationDuration = Math.random() * 12 + 8 + 's';
                span.style.animationDelay = Math.random() * 10 + 's';
                bgHeartsContainer.appendChild(span);
            }
        }

        // =====================================================
        // SECTION 7: INITIALIZATION
        // =====================================================
        function initialize() {
            createStars();
            createClouds();
            createBackgroundHearts();
            setupAuth();
            setupEventListeners();
        }

        function setupAuth() {
            auth.onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    state.myName = data ? data.username : user.email.split('@')[0];
                    youNameDisplay.textContent = state.myName;
                });

                const params = new URLSearchParams(window.location.search);
                state.roomId = params.get('match') || params.get('team');
                state.myPlayerId = user.uid;

                if (!state.roomId) {
                    window.location.href = 'lobby.html';
                    return;
                }

                setupRoomConnection();
            });
        }

        // =====================================================
        // SECTION 8: ROOM SETUP
        // =====================================================
        function setupRoomConnection() {
            database.ref('matchmaking/' + state.roomId).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    setupPlayersFromRoom(snapshot.val(), 'matchmaking');
                } else {
                    database.ref('teams/' + state.roomId).once('value').then((teamSnapshot) => {
                        if (teamSnapshot.exists()) {
                            setupPlayersFromRoom(teamSnapshot.val(), 'teams');
                        } else {
                            alert('Room not found!');
                            window.location.href = 'lobby.html';
                        }
                    });
                }
            });
        }

        function setupPlayersFromRoom(roomData, collection) {
            if (roomData.player1 === state.myPlayerId) {
                state.isHost = true;
                state.opponentId = roomData.player2 || null;
                state.opponentName = roomData.player2Name || 'Opponent';
            } else {
                state.isHost = false;
                state.opponentId = roomData.player1 || null;
                state.opponentName = roomData.player1Name || 'Opponent';
            }

            oppNameDisplay.textContent = state.opponentName;

            if (state.opponentId) {
                startGame();
            } else {
                statusChip.textContent = '⏳ Waiting for opponent...';
                database.ref(collection + '/' + state.roomId).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.player2) {
                        state.opponentId = data.player2;
                        state.opponentName = data.player2Name || 'Opponent';
                        oppNameDisplay.textContent = state.opponentName;
                        startGame();
                    }
                });
            }
        }

        // =====================================================
        // SECTION 9: GAME START & SYNC
        // =====================================================
        function startGame() {
            state.gameStarted = true;
            statusChip.textContent = '🟢 LIVE';
            setupChat();
            setupGameSync();
            startGameLoop();
        }

        function setupGameSync() {
            if (state.isHost) {
                // Host spawns obstacles at random intervals
                scheduleObstacleSpawn();
                // Host spawns hearts
                setInterval(() => {
                    if (state.gameStarted && !state.gameOver) spawnHeart();
                }, CONFIG.HEART_INTERVAL);
                // Host syncs game state
                setInterval(() => {
                    if (state.gameStarted) {
                        database.ref('gameRooms/' + state.roomId + '/state').set({
                            obstacles: obstacles,
                            hearts: hearts,
                            speed: state.speed,
                            hostScore: Math.floor(state.myScore),
                            hostAlive: myDino.isAlive
                        });
                    }
                }, CONFIG.SYNC_INTERVAL);
            } else {
                // Non-host listens to state
                database.ref('gameRooms/' + state.roomId + '/state').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        obstacles = data.obstacles || [];
                        hearts = data.hearts || [];
                        state.speed = data.speed || CONFIG.BASE_SPEED;
                        state.opponentScore = data.hostScore || 0;
                        oppDino.isAlive = data.hostAlive !== false;
                        oppScoreDisplay.textContent = Math.floor(state.opponentScore);
                    }
                });
            }

            // Sync my position to Firebase
            setInterval(() => {
                if (state.gameStarted) {
                    database.ref('gameRooms/' + state.roomId + '/players/' + state.myPlayerId).set({
                        y: myDino.y,
                        jumping: myDino.isJumping,
                        alive: myDino.isAlive,
                        score: Math.floor(state.myScore)
                    });
                }
            }, CONFIG.PLAYER_SYNC_INTERVAL);

            // Listen to opponent position
            database.ref('gameRooms/' + state.roomId + '/players/' + state.opponentId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    oppDino.y = data.y !== undefined ? data.y : oppDino.y;
                    oppDino.isJumping = data.jumping || false;
                    oppDino.isAlive = data.alive !== false;
                    statusChip.textContent = '🟢 LIVE';
                } else {
                    statusChip.textContent = '💔 Opponent left';
                }
            });
        }

        function scheduleObstacleSpawn() {
            const interval = CONFIG.OBSTACLE_INTERVAL_MIN + Math.random() * 
                            (CONFIG.OBSTACLE_INTERVAL_MAX - CONFIG.OBSTACLE_INTERVAL_MIN);
            setTimeout(() => {
                if (state.gameStarted && !state.gameOver) {
                    spawnObstacle();
                    scheduleObstacleSpawn();
                }
            }, interval);
        }

        // =====================================================
        // SECTION 10: GAME OBJECT SPAWNING
        // =====================================================
        function spawnObstacle() {
            const type = Math.random() > 0.5 ? 'cactus' : 'rock';
            const width = type === 'cactus' ? 22 + Math.random() * 10 : 28 + Math.random() * 14;
            const height = type === 'cactus' ? 35 + Math.random() * 30 : 18 + Math.random() * 15;
            obstacles.push({
                x: CONFIG.WIDTH + 50,
                y: CONFIG.GROUND_Y - height,
                width: width,
                height: height,
                type: type
            });
        }

        function spawnHeart() {
            hearts.push({
                x: CONFIG.WIDTH + 50,
                y: Math.random() * 130 + 70,
                width: 24,
                height: 24
            });
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: Math.random() * -4 - 1,
                    life: 25,
                    maxLife: 25,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        // =====================================================
        // SECTION 11: PLAYER CONTROLS
        // =====================================================
        function playerJump() {
            if (!state.gameStarted || state.gameOver || !myDino.isAlive) return;
            if (!myDino.isJumping) {
                myDino.velocityY = CONFIG.JUMP_FORCE;
                myDino.isJumping = true;
                spawnParticles(myDino.x + myDino.width / 2, myDino.y + myDino.height, myDino.color, 5);
            }
        }

        function setupEventListeners() {
            // Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                    e.preventDefault();
                    playerJump();
                }
            });

            // Mouse
            canvas.addEventListener('click', playerJump);

            // Touch
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                playerJump();
            });

            // Chat
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });
        }

        // =====================================================
        // SECTION 12: GAME UPDATE LOGIC
        // =====================================================
        function updateGame() {
            if (!state.gameStarted) return;

            state.frameCount++;
            state.distance += state.speed;

            // Update speed (host only)
            if (state.isHost) {
                state.speed = Math.min(CONFIG.MAX_SPEED, CONFIG.BASE_SPEED + state.frameCount * 0.002);
            }

            // Update my dino physics
            updateDinoPhysics(myDino);

            // Leg animation
            if (state.frameCount % 8 === 0) {
                myDino.legFrame = (myDino.legFrame + 1) % 2;
                oppDino.legFrame = (oppDino.legFrame + 1) % 2;
            }

            // Update clouds
            for (const cloud of clouds) {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.width < 0) {
                    cloud.x = CONFIG.WIDTH + 100;
                    cloud.y = Math.random() * 100 + 20;
                }
            }

            // Move obstacles (host only)
            if (state.isHost) {
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= state.speed;
                    if (obstacles[i].x + obstacles[i].width < 0) {
                        obstacles.splice(i, 1);
                    }
                }
                for (let i = hearts.length - 1; i >= 0; i--) {
                    hearts[i].x -= state.speed * 0.85;
                    if (hearts[i].x < -30) {
                        hearts.splice(i, 1);
                    }
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Check collisions
            checkCollisions();

            // Update score
            if (myDino.isAlive) {
                state.myScore += state.speed * 0.1;
            }
            youScoreDisplay.textContent = Math.floor(state.myScore);

            // Check win condition
            if (state.myScore >= CONFIG.WIN_SCORE || state.opponentScore >= CONFIG.WIN_SCORE) {
                endGame();
            }
        }

        function updateDinoPhysics(dino) {
            if (dino.isJumping) {
                dino.velocityY += CONFIG.GRAVITY;
                dino.y += dino.velocityY;
                if (dino.y >= CONFIG.GROUND_Y - dino.height) {
                    dino.y = CONFIG.GROUND_Y - dino.height;
                    dino.isJumping = false;
                    dino.velocityY = 0;
                    spawnParticles(dino.x + dino.width / 2, dino.y + dino.height, dino.color, 3);
                }
            }
        }

        function checkCollisions() {
            if (myDino.isAlive) {
                // Obstacle collision
                for (const obstacle of obstacles) {
                    if (rectCollide(myDino, obstacle)) {
                        myDino.isAlive = false;
                        spawnParticles(myDino.x + myDino.width / 2, myDino.y + myDino.height / 2, myDino.color, 20);
                        setTimeout(() => {
                            myDino.isAlive = true;
                            myDino.y = CONFIG.GROUND_Y - 50;
                        }, CONFIG.RESPAWN_DELAY);
                        break;
                    }
                }
                // Heart collection
                for (let i = hearts.length - 1; i >= 0; i--) {
                    if (rectCollide(myDino, hearts[i])) {
                        state.myScore += CONFIG.HEART_BONUS;
                        spawnParticles(hearts[i].x, hearts[i].y, '#ff6b9d', 10);
                        if (state.isHost) hearts.splice(i, 1);
                    }
                }
            }
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.width && 
                   a.x + a.width > b.x && 
                   a.y < b.y + b.height && 
                   a.y + a.height > b.y;
        }

        function endGame() {
            state.gameOver = true;
            const isWinner = state.myScore > state.opponentScore;
            overlayEmoji.textContent = isWinner ? '🏆' : '💙';
            overlayTitle.textContent = isWinner ? 'You Win!' : 'Opponent Wins!';
            overlayScore.textContent = `💕 ${Math.floor(state.myScore)} - ${Math.floor(state.opponentScore)} 💙`;
            gameOverOverlay.classList.add('show');
            setTimeout(() => {
                gameOverOverlay.classList.remove('show');
                window.location.href = 'lobby.html';
            }, 3000);
        }

        // =====================================================
        // SECTION 13: RENDERING
        // =====================================================
        function renderGame() {
            ctx.clearRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

            // Sky
            renderSky();
            // Stars
            renderStars();
            // Clouds
            renderClouds();
            // Ground
            renderGround();
            // Obstacles
            renderObstacles();
            // Hearts
            renderHearts();
            // Particles
            renderParticles();
            // Connection line
            renderConnectionLine();
            // Dinos
            renderDino(myDino);
            renderDino(oppDino);
        }

        function renderSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.GROUND_Y);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(0.35, '#1a1a3e');
            gradient.addColorStop(0.65, '#4a2d6b');
            gradient.addColorStop(0.85, '#e8a87c');
            gradient.addColorStop(1, '#f4c4a8');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.GROUND_Y);
        }

        function renderStars() {
            for (const star of stars) {
                const twinkle = Math.sin(Date.now() * 0.002 + star.phase) * 0.3 + 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function renderClouds() {
            for (const cloud of clouds) {
                ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.width / 2, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width / 3, cloud.y - 10, cloud.width / 3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width / 2, cloud.y, cloud.width / 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function renderGround() {
            const gradient = ctx.createLinearGradient(0, CONFIG.GROUND_Y, 0, CONFIG.HEIGHT);
            gradient.addColorStop(0, '#2d3436');
            gradient.addColorStop(1, '#1e272e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, CONFIG.GROUND_Y, CONFIG.WIDTH, CONFIG.HEIGHT - CONFIG.GROUND_Y);

            ctx.strokeStyle = '#e8a87c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, CONFIG.GROUND_Y);
            ctx.lineTo(CONFIG.WIDTH, CONFIG.GROUND_Y);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            for (let i = 0; i < 15; i++) {
                const gx = (i * 60 + state.frameCount * 0.5) % CONFIG.WIDTH;
                ctx.fillRect(gx, CONFIG.GROUND_Y + 10, 3, 6);
            }
        }

        function renderObstacles() {
            for (const obstacle of obstacles) {
                if (obstacle.type === 'cactus') {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    ctx.fillRect(obstacle.x - 6, obstacle.y + 12, 8, 16);
                    ctx.fillRect(obstacle.x + obstacle.width - 2, obstacle.y + 15, 8, 14);
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🌸', obstacle.x + obstacle.width / 2, obstacle.y - 3);
                } else {
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.arc(obstacle.x + obstacle.width / 2, obstacle.y + obstacle.height, obstacle.width / 2, Math.PI, 0);
                    ctx.fill();
                    ctx.fillStyle = '#8d6e63';
                    ctx.beginPath();
                    ctx.arc(obstacle.x + obstacle.width / 2, obstacle.y + 5, obstacle.width * 0.3, Math.PI, 2 * Math.PI);
                    ctx.fill();
                }
            }
        }

        function renderHearts() {
            for (const heart of hearts) {
                const bob = Math.sin(state.frameCount * 0.05 + heart.x) * 3;
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('💗', heart.x + 12, heart.y + 12 + bob);
            }
        }

        function renderParticles() {
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function renderConnectionLine() {
            if (myDino.isAlive && oppDino.isAlive) {
                ctx.save();
                ctx.strokeStyle = 'rgba(244, 114, 182, 0.3)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(myDino.x + myDino.width / 2, myDino.y + myDino.height / 2);
                ctx.lineTo(oppDino.x + oppDino.width / 2, oppDino.y + oppDino.height / 2);
                ctx.stroke();
                ctx.setLineDash([]);

                for (let i = 0; i < 3; i++) {
                    const t = (state.frameCount * 0.02 + i * 0.33) % 1;
                    const hx = myDino.x + myDino.width / 2 + (oppDino.x + oppDino.width / 2 - myDino.x - myDino.width / 2) * t;
                    const hy = myDino.y + myDino.height / 2 + (oppDino.y + oppDino.height / 2 - myDino.y - myDino.height / 2) * t - 10;
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('💗', hx, hy);
                }
                ctx.restore();
            }
        }

        function renderDino(dino) {
            // Body
            ctx.fillStyle = dino.color;
            ctx.beginPath();
            roundRect(ctx, dino.x, dino.y, dino.width, dino.height, 8);
            ctx.fill();

            // Belly
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            roundRect(ctx, dino.x + 10, dino.y + 20, dino.width - 20, dino.height - 25, 5);
            ctx.fill();

            // Eye
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(dino.x + dino.width - 15, dino.y + 14, 6, 0, Math.PI * 2);
            ctx.fill();

            // Pupil
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(dino.x + dino.width - 13, dino.y + 15, 3, 0, Math.PI * 2);
            ctx.fill();

            // Legs
            ctx.fillStyle = dino.color;
            const legOffset = dino.legFrame === 0 ? 0 : 5;
            ctx.fillRect(dino.x + 10, dino.y + dino.height - 4, 9, 16 + legOffset);
            ctx.fillRect(dino.x + dino.width - 19, dino.y + dino.height - 4, 9, 16 - legOffset);

            // Tail
            ctx.fillStyle = dino.color;
            ctx.beginPath();
            ctx.moveTo(dino.x, dino.y + 30);
            ctx.lineTo(dino.x - 15, dino.y + 20);
            ctx.lineTo(dino.x, dino.y + 20);
            ctx.fill();

            // Emoji
            ctx.font = '15px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(dino.emoji, dino.x + dino.width / 2, dino.y + dino.height / 2 + 5);
        }

        function roundRect(ctx, x, y, width, height, radius) {
            if (width < 2 * radius) radius = width / 2;
            if (height < 2 * radius) radius = height / 2;
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
        }

        // =====================================================
        // SECTION 14: CHAT SYSTEM
        // =====================================================
        function setupChat() {
            const chatRef = database.ref('gameRooms/' + state.roomId + '/chat');
            chatRef.off();
            chatRef.limitToLast(50).on('child_added', (snapshot) => {
                const message = snapshot.val();
                displayChatMessage(message.sender, message.message, message.sender === state.myName);
            });
        }

        function sendChatMessage() {
            const message = chatInput.value.trim();
            if (message && state.roomId) {
                database.ref('gameRooms/' + state.roomId + '/chat').push({
                    sender: state.myName,
                    message: message,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                chatInput.value = '';
            }
        }

        function displayChatMessage(sender, message, isYou) {
            const div = document.createElement('div');
            div.className = `chat-message ${isYou ? 'you' : 'opponent'}`;
            div.innerHTML = `<span class="sender">${sender}</span><span class="text">${message}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // =====================================================
        // SECTION 15: GAME LOOP
        // =====================================================
        function startGameLoop() {
            function loop() {
                updateGame();
                renderGame();
                requestAnimationFrame(loop);
            }
            loop();
        }

        // =====================================================
        // SECTION 16: START
        // =====================================================
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
