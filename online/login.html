<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --secondary: #c44569;
            --accent: #f8b500;
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .auth-title {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .auth-tab {
            flex: 1;
            padding: 0.7rem;
            border: 2px solid var(--glass-border);
            border-radius: 1.5rem;
            background: transparent;
            color: var(--white);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .auth-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            color: var(--white);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-group input {
            padding: 0.7rem 1rem;
            border-radius: 1.5rem;
            border: 2px solid var(--glass-border);
            background: var(--glass);
            color: var(--white);
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-auth {
            padding: 0.8rem;
            border-radius: 2rem;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: var(--white);
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-google {
            padding: 0.8rem;
            border-radius: 2rem;
            border: 2px solid var(--glass-border);
            background: var(--white);
            color: #333;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
        }

        .btn-google:hover {
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .error-message {
            color: #ff4444;
            font-size: 0.8rem;
            text-align: center;
            display: none;
            padding: 0.5rem;
            border-radius: 0.5rem;
            background: rgba(255, 68, 68, 0.1);
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #00cc66;
            font-size: 0.8rem;
            text-align: center;
            display: none;
            padding: 0.5rem;
            border-radius: 0.5rem;
            background: rgba(0, 204, 102, 0.1);
        }

        .success-message.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">💕</div>
            <h1 class="auth-title">UsBlog Games</h1>
            <p class="auth-subtitle">Login or Register to Play Online</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTabBtn" onclick="showLoginForm()">Login</button>
            <button class="auth-tab" id="registerTabBtn" onclick="showRegisterForm()">Register</button>
        </div>

        <!-- Login Form -->
        <div class="form-container" id="loginFormContainer">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <div class="error-message" id="loginError"></div>
            <button class="btn-auth" id="loginBtn" onclick="handleLogin()">💕 Login</button>
            
            <div class="divider">OR</div>
            
            <button class="btn-google" onclick="handleGoogleLogin()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <!-- Register Form -->
        <div class="form-container" id="registerFormContainer" style="display: none;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="registerUsername" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Min 6 characters">
            </div>
            <div class="error-message" id="registerError"></div>
            <div class="success-message" id="registerSuccess"></div>
            <button class="btn-auth" id="registerBtn" onclick="handleRegister()">✨ Register</button>
            
            <div class="divider">OR</div>
            
            <button class="btn-google" onclick="handleGoogleLogin()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Register with Google
            </button>
        </div>

        <div class="back-link">
            <a href="../index.html">← Back to Home</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        
        // Show/Hide Forms
        function showLoginForm() {
            document.getElementById('loginTabBtn').classList.add('active');
            document.getElementById('registerTabBtn').classList.remove('active');
            document.getElementById('loginFormContainer').style.display = 'flex';
            document.getElementById('registerFormContainer').style.display = 'none';
            hideMessages();
        }
        
        function showRegisterForm() {
            document.getElementById('registerTabBtn').classList.add('active');
            document.getElementById('loginTabBtn').classList.remove('active');
            document.getElementById('registerFormContainer').style.display = 'flex';
            document.getElementById('loginFormContainer').style.display = 'none';
            hideMessages();
        }
        
        function hideMessages() {
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('registerError').classList.remove('show');
            document.getElementById('registerSuccess').classList.remove('show');
        }
        
        function showLoginError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }
        
        function showRegisterError(msg) {
            const el = document.getElementById('registerError');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }
        
        function showRegisterSuccess(msg) {
            const el = document.getElementById('registerSuccess');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }
        
        // Login
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showLoginError('Please fill in all fields');
                return;
            }
            
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Loading...';
            btn.disabled = true;
            
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    console.log('Login successful');
                    // Redirect to homepage
                    window.location.href = '../index.html';
                })
                .catch((error) => {
                    showLoginError(error.message);
                    btn.textContent = '💕 Login';
                    btn.disabled = false;
                });
        }
        
        // Register
        function handleRegister() {
            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            
            if (!username || !email || !password) {
                showRegisterError('Please fill in all fields');
                return;
            }
            
            if (username.length < 3) {
                showRegisterError('Username must be at least 3 characters');
                return;
            }
            
            if (password.length < 6) {
                showRegisterError('Password must be at least 6 characters');
                return;
            }
            
            const btn = document.getElementById('registerBtn');
            btn.textContent = 'Loading...';
            btn.disabled = true;
            
            // Check username
            database.ref('usernames/' + username).once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        showRegisterError('Username already taken!');
                        btn.textContent = '✨ Register';
                        btn.disabled = false;
                        return Promise.reject('username-taken');
                    }
                    
                    // Create user
                    return auth.createUserWithEmailAndPassword(email, password);
                })
                .then((userCredential) => {
                    if (!userCredential) return;
                    
                    const user = userCredential.user;
                    
                    // Save user data
                    const updates = {};
                    updates['users/' + user.uid] = {
                        username: username,
                        email: email,
                        createdAt: Date.now()
                    };
                    updates['usernames/' + username] = user.uid;
                    
                    return database.ref().update(updates);
                })
                .then(() => {
                    showRegisterSuccess('Registration successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 1500);
                })
                .catch((error) => {
                    if (error !== 'username-taken') {
                        showRegisterError(error.message);
                    }
                    btn.textContent = '✨ Register';
                    btn.disabled = false;
                });
        }
        
        // Google Login
        function handleGoogleLogin() {
            auth.signInWithPopup(googleProvider)
                .then((result) => {
                    const user = result.user;
                    
                    // Check if user exists
                    return database.ref('users/' + user.uid).once('value')
                        .then((snapshot) => {
                            if (!snapshot.exists()) {
                                const username = user.email.split('@')[0];
                                const updates = {};
                                updates['users/' + user.uid] = {
                                    username: username,
                                    email: user.email,
                                    createdAt: Date.now(),
                                    googleAuth: true
                                };
                                updates['usernames/' + username] = user.uid;
                                return database.ref().update(updates);
                            }
                        });
                })
                .then(() => {
                    // Redirect to homepage
                    window.location.href = '../index.html';
                })
                .catch((error) => {
                    if (error.code === 'auth/popup-blocked') {
                        // Use redirect method
                        auth.signInWithRedirect(googleProvider);
                    } else {
                        showLoginError(error.message);
                    }
                });
        }
        
        // Handle Google redirect result
        auth.getRedirectResult()
            .then((result) => {
                if (result && result.user) {
                    const user = result.user;
                    return database.ref('users/' + user.uid).once('value')
                        .then((snapshot) => {
                            if (!snapshot.exists()) {
                                const username = user.email.split('@')[0];
                                const updates = {};
                                updates['users/' + user.uid] = {
                                    username: username,
                                    email: user.email,
                                    createdAt: Date.now(),
                                    googleAuth: true
                                };
                                updates['usernames/' + username] = user.uid;
                                return database.ref().update(updates);
                            }
                        })
                        .then(() => {
                            window.location.href = '../index.html';
                        });
                }
            })
            .catch((error) => {
                console.error('Redirect error:', error);
            });
        
        // Check if already logged in
        auth.onAuthStateChanged((user) => {
            if (user && window.location.pathname.includes('login.html')) {
                // Already logged in - redirect to homepage
                // But don't redirect during Google popup
                const isGooglePopup = sessionStorage.getItem('google-popup');
                if (!isGooglePopup) {
                    window.location.href = '../index.html';
                }
            }
        });
    </script>
</body>
</html>
