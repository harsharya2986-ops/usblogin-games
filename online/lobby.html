<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby 💕 | UsBlog Games</title>
    <style>
        :root {
            --primary: #ff6b9d;
            --secondary: #e84393;
            --accent: #f8b500;
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lobby-container {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn {
            padding: 8px 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 68, 68, 0.5);
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .game-info {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            border: 1px solid rgba(255, 107, 157, 0.3);
        }

        .game-emoji { font-size: 2.5rem; }
        .game-name { color: var(--primary); font-weight: bold; font-size: 1.1rem; margin-top: 0.25rem; }

        .section-title {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .btn-find {
            padding: 0.9rem;
            border-radius: 2rem;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-bottom: 1.25rem;
        }

        .btn-find:hover { transform: translateY(-2px); }
        .btn-find:disabled { opacity: 0.6; cursor: not-allowed; }

        .team-display {
            text-align: center;
            padding: 0.75rem;
            background: rgba(248, 181, 0, 0.15);
            border-radius: 1rem;
            border: 2px dashed rgba(248, 181, 0, 0.5);
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 6px;
            display: none;
            margin-bottom: 0.75rem;
        }

        .team-display.show { display: block; animation: popIn 0.3s ease; }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .btn-create {
            padding: 0.75rem;
            border-radius: 1.5rem;
            border: none;
            background: linear-gradient(135deg, #f8b500, #f39c12);
            color: #333;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
        }

        .join-section { display: flex; gap: 0.5rem; }

        .join-section input {
            flex: 1;
            padding: 0.7rem;
            border-radius: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            outline: none;
        }

        .btn-join {
            padding: 0.7rem 1.25rem;
            border-radius: 1.5rem;
            border: none;
            background: var(--accent);
            color: #333;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .overlay.show { display: flex; }

        .overlay-content {
            text-align: center;
            background: rgba(26, 26, 46, 0.95);
            padding: 2rem;
            border-radius: 2rem;
            border: 2px solid var(--primary);
            max-width: 350px;
            width: 90%;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .countdown { font-size: 3.5rem; font-weight: bold; color: var(--accent); margin: 0.5rem 0; }
        .status-text { color: white; font-size: 0.9rem; margin-bottom: 1rem; }
        .btn-cancel { padding: 0.6rem 1.5rem; border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.3); background: transparent; color: white; cursor: pointer; }

        @media (max-width: 400px) {
            .lobby-container { padding: 1rem; border-radius: 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="lobby-container">
        <div class="lobby-header">
            <a href="../index.html" class="back-btn">← Back</a>
            <div class="user-info">
                <div class="user-avatar">💕</div>
                <span id="userNameDisplay" style="font-size: 0.85rem; font-weight: 600;">Player</span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="game-info">
            <div class="game-emoji" id="gameEmoji">🎮</div>
            <div class="game-name" id="gameName">Game</div>
        </div>

        <div class="section-title">🎲 Random Matchmaking</div>
        <button class="btn-find" id="findBtn" onclick="findRandomMatch()">🎲 Find Random Match</button>

        <div class="section-title">💕 Play with Friend</div>
        <div class="team-display" id="teamDisplay"></div>
        <button class="btn-create" onclick="createTeam()">✨ Create Team Code</button>
        <div class="join-section">
            <input type="text" id="joinInput" placeholder="ENTER CODE" maxlength="6">
            <button class="btn-join" onclick="joinTeam()">🔑 Join</button>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-content">
            <div class="spinner" id="spinner"></div>
            <div class="countdown" id="countdown" style="display: none;"></div>
            <div class="status-text" id="statusText">Finding opponent...</div>
            <button class="btn-cancel" id="cancelBtn" onclick="cancelSearch()">Cancel</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaR33cAwHFTNdSlBuuzoju9yzah8szBmQ",
            authDomain: "usblog-games.firebaseapp.com",
            databaseURL: "https://usblog-games-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "usblog-games",
            storageBucket: "usblog-games.firebasestorage.app",
            messagingSenderId: "568211981446",
            appId: "1:568211981446:web:0e75688bb9a28c2df97d07",
            measurementId: "G-BDKRR8E565"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let currentUsername = '';
        let selectedGame = 'dino-run';
        let myMatchRef = null;
        let countdownTimer = null;

        const games = {
            'dino-run': { name: 'Dino Run', emoji: '🦖', room: 'game-room.html' },
            'ping-pong': { name: 'Ping Pong', emoji: '🏓', room: 'game-room-ping-pong.html' },
            'rock-paper-scissors': { name: 'Rock Paper Scissors', emoji: '✂️', room: 'game-room-rps.html' },
            'tic-tac-toe': { name: 'Tic Tac Toe', emoji: '⭕', room: 'game-room-tic-tac-toe.html' },
            'chess': { name: 'Chess', emoji: '♟️', room: 'game-room-chess.html' },
            'connect-four': { name: 'Connect Four', emoji: '🔴', room: 'game-room-connect-four.html' },
            'tic-tac-tumble': { name: 'Tic Tac Tumble', emoji: '🎲', room: 'game-room-tumble.html' },
            'dots-boxes': { name: 'Dots and Boxes', emoji: '📦', room: 'game-room-dots.html' }
        };

        function init() {
            auth.onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                currentUser = user;

                database.ref('users/' + user.uid).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    currentUsername = data ? data.username : user.email.split('@')[0];
                    document.getElementById('userNameDisplay').textContent = currentUsername;
                });

                const params = new URLSearchParams(window.location.search);
                selectedGame = params.get('game') || 'dino-run';

                const gameInfo = games[selectedGame] || games['dino-run'];
                document.getElementById('gameEmoji').textContent = gameInfo.emoji;
                document.getElementById('gameName').textContent = gameInfo.name;
            });
        }

        function showOverlay(message, showSpinner = true) {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('statusText').textContent = message;
            document.getElementById('spinner').style.display = showSpinner ? 'block' : 'none';
            document.getElementById('countdown').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'block';
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.remove('show');
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        }

        function findRandomMatch() {
            const btn = document.getElementById('findBtn');
            btn.disabled = true;
            btn.textContent = 'Searching...';
            showOverlay('Looking for players...');

            const matchmakingRef = database.ref('matchmaking');

            matchmakingRef.once('value').then((snapshot) => {
                let found = false;

                snapshot.forEach((child) => {
                    const match = child.val();
                    if (!found && match.gameType === selectedGame && match.status === 'waiting' && match.player1 !== currentUser.uid) {
                        found = true;
                        joinMatch(child.key, match);
                    }
                });

                if (!found) {
                    createMatch();
                }
            });
        }

        function createMatch() {
            const newMatchRef = database.ref('matchmaking').push();
            myMatchRef = newMatchRef.key;

            newMatchRef.set({
                gameType: selectedGame,
                player1: currentUser.uid,
                player1Name: currentUsername,
                status: 'waiting',
                createdAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                newMatchRef.on('value', (snapshot) => {
                    const match = snapshot.val();
                    if (match && match.status === 'matched' && match.player2) {
                        startCountdown(myMatchRef);
                    }
                });
            });
        }

        function joinMatch(matchId, match) {
            myMatchRef = matchId;
            database.ref('matchmaking/' + matchId).update({
                player2: currentUser.uid,
                player2Name: currentUsername,
                status: 'matched'
            }).then(() => {
                startCountdown(matchId);
            });
        }

        function startCountdown(matchId) {
            showOverlay('Match Found!', false);

            const countdownEl = document.getElementById('countdown');
            countdownEl.style.display = 'block';
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('statusText').textContent = 'Match Found! Starting in...';
            document.getElementById('cancelBtn').style.display = 'none';

            let count = 5;
            countdownEl.textContent = count;

            countdownTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else if (count === 0) {
                    countdownEl.textContent = 'GO! 💕';
                } else {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    hideOverlay();
                    const gameRoom = games[selectedGame].room;
                    window.location.href = `${gameRoom}?match=${matchId}&game=${selectedGame}`;
                }
            }, 1000);
        }

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function createTeam() {
            let code = generateCode();

            database.ref('teams/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) { code = generateCode(); }

                return database.ref('teams/' + code).set({
                    gameType: selectedGame,
                    host: currentUser.uid,
                    hostName: currentUsername,
                    status: 'waiting',
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });
            }).then(() => {
                const display = document.getElementById('teamDisplay');
                display.textContent = code;
                display.classList.add('show');

                database.ref('teams/' + code).on('value', (snapshot) => {
                    const team = snapshot.val();
                    if (team && team.status === 'ready' && team.partner) {
                        startCountdown(code);
                    }
                });
            });
        }

        function joinTeam() {
            const code = document.getElementById('joinInput').value.toUpperCase().trim();

            if (code.length !== 6) {
                alert('Please enter a 6-character code');
                return;
            }

            database.ref('teams/' + code).once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    alert('Team not found! Check the code.');
                    return;
                }

                const team = snapshot.val();

                if (team.status === 'ready') {
                    alert('This team is already full!');
                    return;
                }

                if (team.host === currentUser.uid) {
                    alert('You cannot join your own team!');
                    return;
                }

                return database.ref('teams/' + code).update({
                    partner: currentUser.uid,
                    partnerName: currentUsername,
                    status: 'ready'
                });
            }).then(() => {
                const code = document.getElementById('joinInput').value.toUpperCase().trim();
                if (code && code.length === 6) {
                    startCountdown(code);
                }
            });
        }

        function cancelSearch() {
            if (myMatchRef) {
                database.ref('matchmaking/' + myMatchRef).remove();
                myMatchRef = null;
            }
            hideOverlay();
            document.getElementById('findBtn').disabled = false;
            document.getElementById('findBtn').textContent = '🎲 Find Random Match';
        }

        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
