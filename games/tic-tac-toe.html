<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Tic Tac Toe 💕 | UsBlog Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .game-container {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            border: 2px solid rgba(255, 107, 157, 0.3);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-btn {
            color: #ff6b9d;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 157, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 107, 157, 0.2);
        }

        .game-title {
            font-size: 22px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 15px rgba(255, 107, 157, 0.5);
        }

        .status-bar {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-text {
            font-size: 16px;
            color: white;
            font-weight: 600;
        }

        .scoreboard {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .score-chip {
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .score-chip.pink { color: #ff6b9d; border: 1px solid rgba(255, 107, 157, 0.3); }
        .score-chip.gold { color: #fdcb6e; border: 1px solid rgba(253, 203, 110, 0.3); }

        .macro-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            aspect-ratio: 1;
            margin-bottom: 15px;
        }

        .macro-cell {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 4px;
            position: relative;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .macro-cell.active {
            border-color: #ff6b9d;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.6);
        }

        .macro-cell.won-pink {
            background: rgba(255, 107, 157, 0.15);
            border-color: #ff6b9d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .macro-cell.won-gold {
            background: rgba(253, 203, 110, 0.15);
            border-color: #fdcb6e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .macro-overlay {
            font-size: 40px;
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .mini-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .mini-cell {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mini-cell:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .mini-cell.pink {
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.8);
            animation: placeMark 0.3s ease;
        }

        .mini-cell.gold {
            color: #fdcb6e;
            text-shadow: 0 0 10px rgba(253, 203, 110, 0.8);
            animation: placeMark 0.3s ease;
        }

        @keyframes placeMark {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff6b9d, #e84393);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }

        .btn-reset:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        @media (max-width: 500px) {
            .game-container {
                padding: 10px;
                border-radius: 18px;
            }
            .game-title {
                font-size: 18px;
            }
            .mini-cell {
                font-size: 14px;
                border-radius: 4px;
            }
            .macro-overlay {
                font-size: 30px;
            }
            .macro-cell {
                border-radius: 8px;
                padding: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../index.html" class="back-btn">← Back</a>
            <h1 class="game-title">💕 Super Tic Tac Toe</h1>
            <div style="width: 60px;"></div>
        </div>

        <div class="status-bar">
            <div class="status-text" id="statusText">Your turn! Choose a cell</div>
        </div>

        <div class="scoreboard">
            <div class="score-chip pink">💕 You: <span id="playerScore">0</span></div>
            <div class="score-chip gold">🏹 Partner: <span id="aiScore">0</span></div>
        </div>

        <div class="macro-board" id="macroBoard"></div>

        <div class="controls">
            <button class="btn btn-reset" onclick="game.resetGame()">🔄 New Game</button>
        </div>
    </div>

    <script src="../js/games/tic-tac-toe.js"></script>
</body>
</html>
